<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DigiVpet">
<title>Digimon V-Pet 顯示控制器</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="Logo-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="Logo-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="Logo-512.png">
<link rel="apple-touch-icon" sizes="192x192" href="Logo-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="Logo-512.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{
  background:#111;
  padding:16px;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}
.title{color:#fff;text-align:center;margin-bottom:16px;font-size:20px}

/* 主LCD螢幕 */
.main-screen{
  background:#000;
  border:3px solid #666;
  width:192px;
  height:96px;
  image-rendering:pixelated;
  image-rendering:crisp-edges;
  cursor:pointer;
  display:block;
  margin:0 auto 16px;
}

/* 左右切換箭頭 */
.nav-bar{
  display:flex;
  justify-content:center;
  gap:24px;
  margin-bottom:30px;
}
.arrow-btn{
  width:80px;height:50px;
  font-size:26px;
  background:#333;
  color:#fff;
  border:none;
  border-radius:8px;
}

/* 中間8個功能按鈕 */
.btn-panel{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:6px;
}
.func-btn{
  height:60px;
  background:#333;
  border:none;
  border-radius:8px;
  color:#fff;
  font-size:14px;
}
.func-btn.active{
  background:#c42222;
  color:#fff;
  font-weight:700;
}

/* 頁面最底部導航欄 */

/* 狀態面板（按鈕下方） */
.stats-display{
  display:none;
  background:#222;
  border:1px solid #c42222;
  border-radius:8px;
  padding:12px 16px;
  color:#fff;
  font-size:13px;
  width:100%;
  max-width:400px;
  margin:8px auto 0;
  box-sizing:border-box;
}
.stats-display .sd-title{
  text-align:center;
  font-size:16px;
  font-weight:700;
  color:#ffcc00;
  margin-bottom:8px;
  padding-bottom:6px;
  border-bottom:1px solid #444;
}
.stats-display .sd-row{
  display:flex;
  justify-content:space-between;
  padding:3px 0;
  border-bottom:1px solid #333;
}
.stats-display .sd-row span:first-child{ color:#aaa; }
.stats-display .sd-row span:last-child{ color:#fff; font-weight:600; }

/* 對戰面板 */
.battle-info{
  text-align:center;
  color:#ffcc00;
  font-size:13px;
  font-weight:700;
  margin-bottom:8px;
}
.battle-vs-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:4px 6px;
  border-radius:4px;
  background:rgba(0,0,0,0.3);
  margin-bottom:4px;
}
.battle-side{
  text-align:center;
  flex:1;
}
.battle-side.player .battle-side-name{
  color:#44ccff;
  font-size:12px;
  font-weight:700;
}
.battle-side.enemy .battle-side-name{
  color:#ff6644;
  font-size:12px;
  font-weight:700;
}
.battle-side .battle-side-hp{
  color:#36c73d;
  font-weight:700;
  font-size:11px;
}
.battle-side .battle-side-hp.low{ color:#eddd31; }
.battle-vs-text{
  color:#ffcc00;
  font-size:13px;
  font-weight:900;
  margin:0 6px;
}
.battle-msg{
  text-align:center;
  color:#f0f0f0;
  font-size:12px;
  min-height:18px;
  margin-bottom:6px;
}
.battle-log{
  max-height:120px;
  overflow-y:auto;
  padding:4px 8px;
  margin-bottom:6px;
  background:rgba(0,0,0,0.3);
  border-radius:6px;
  font-size:11px;
  color:#ccc;
  line-height:1.6;
  scrollbar-width:thin;
  scrollbar-color:#555 #222;
}
.battle-log .log-entry{
  padding:1px 0;
  border-bottom:1px solid rgba(255,255,255,0.06);
}
.battle-log .log-entry.crit{ color:#ff8844; }
.battle-log .log-entry.dodge{ color:#88aaff; }
.battle-log .log-entry.attr-adv{ color:#ffcc00; }
.battle-log .log-entry.attr-dis{ color:#8888cc; }
.battle-btns{
  display:flex;
  gap:8px;
  justify-content:center;
  margin-top:8px;
}
.battle-atk-btn{
  padding:10px 24px;
  background:#c42222;
  color:#fff;
  border:none;
  border-radius:6px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  flex:1;
  max-width:140px;
}
.battle-atk-btn:hover{ background:#e53030; }
.battle-atk-btn:active{ background:#a01a1a; }
.battle-atk-btn:disabled{
  background:#555;
  cursor:not-allowed;
}
.battle-run-btn{
  padding:10px 24px;
  background:#555;
  color:#fff;
  border:none;
  border-radius:6px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  flex:1;
  max-width:140px;
}
.battle-run-btn:hover{ background:#777; }
.battle-run-btn:active{ background:#333; }
.battle-run-btn:disabled{
  background:#333;
  cursor:not-allowed;
}
.adversity-evo-banner{
  display:none;
  text-align:center;
  color:#ff6600;
  font-size:13px;
  font-weight:700;
  margin:4px 0;
  animation:adversityFlash 0.5s ease-in-out infinite alternate;
}
@keyframes adversityFlash{
  from{opacity:0.3;}
  to{opacity:1;}
}

/* 食物面板選項 */
.food-item{
  padding:8px 12px;
  margin:4px 0;
  background:#333;
  border-radius:6px;
  cursor:pointer;
  font-size:15px;
  color:#fff;
  transition:background .15s;
}
.food-item:hover{ background:#555; }
.food-item:active{ background:#c42222; }

/* 訓練面板 */
.training-mode-selector{
  display:flex;
  flex-direction:column;
  gap:4px;
  margin-bottom:8px;
}
.training-mode-btn{
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex:1;
  padding:6px;
  background:#333;
  color:#fff;
  border:2px solid #888;
  border-radius:4px;
  font-size:12px;
  font-family:inherit;
  cursor:pointer;
  user-select:none;
}
.training-mode-btn.active{
  background:#333;
  border-color:#fff;
}
.training-mode-btn.disabled{
  opacity:0.35;
  pointer-events:none;
  cursor:not-allowed;
}
.training-mode-btn.disabled::after{
  content:" (不可用)";
  color:#999;
  font-size:10px;
}
.training-mode-btn .help-icon{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:18px;height:18px;
  background:#555;
  color:#ffcc00;
  border:1px solid #aaa;
  border-radius:50%;
  font-size:11px;
  font-weight:700;
  cursor:pointer;
  flex-shrink:0;
  line-height:1;
}
.training-click-btn{
  width:100%;
  max-width:360px;
  height:70px;
  background:#c42222;
  color:#fff;
  border:none;
  border-radius:10px;
  font-size:26px;
  font-weight:700;
  cursor:pointer;
  margin-top:8px;
}
.training-click-btn:active{ background:#ff4444; }
.training-timer{
  position:absolute;
  left:50%;
  top:-150px;
  transform:translateX(-50%);
  font-size:48px;
  font-weight:bold;
  color:#ff0;
  text-shadow:2px 2px 0 #000;
}
.training-back-btn{
  display:block;
  margin:8px auto 0;
  padding:8px 24px;
  background:#555;
  color:#fff;
  border:none;
  border-radius:6px;
  font-size:14px;
  cursor:pointer;
}

/* 特殊進化訓練卡片 */
.evo-card{
  width:44px; height:44px;
  border:2px solid #666;
  border-radius:6px;
  cursor:pointer;
  font-size:20px;
  color:#fff;
  transition: background 0.3s, transform 0.15s;
}
.evo-card:active{ transform:scale(0.9); }
.evo-card.flipped{ background:#444; color:#888; }
.evo-card.found{ opacity:0.5; pointer-events:none; }
.evo-card-type-0{ background:url('BG/Card core.png') center/cover; }   /* 紅色組→核心卡 */
.evo-card-type-1{ background:url('BG/Card Star.png') center/cover; }  /* 黃色組→星卡 */
.evo-card-type-2{ background:url('BG/4-leaf clover.png') center/cover; } /* 綠色組→四葉草 */

/* 圖鑑面板 */
.digidex-stage{
  margin-bottom:12px;
}
.digidex-stage-title{
  color:#ffcc00;
  font-size:14px;
  font-weight:700;
  margin-bottom:6px;
  padding-bottom:4px;
  border-bottom:1px solid #444;
}
.digidex-grid{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}
.digidex-entry{
  display:flex;
  flex-direction:column;
  align-items:center;
  background:#333;
  border-radius:6px;
  padding:8px;
  width:72px;
  cursor:pointer;
  transition:background .15s;
}
.digidex-entry:hover{ background:#555; }
.digidex-entry canvas{
  display:block;
  width:48px;
  height:48px;
  image-rendering:pixelated;
  image-rendering:crisp-edges;
  margin-bottom:4px;
}
.digidex-entry .d-name{
  font-size:11px;
  color:#fff;
  text-align:center;
  word-break:break-all;
}
.digidex-entry .d-info{
  font-size:9px;
  color:#aaa;
  text-align:center;
  line-height:1.3;
  margin-top:4px;
  padding-top:4px;
  border-top:1px solid #444;
}
.digidex-detail{
  display:none;
  padding:8px;
}
.digidex-detail .detail-sprite{
  display:block;
  margin:0 auto 8px;
  image-rendering:pixelated;
  image-rendering:crisp-edges;
}
.digidex-detail .detail-name{
  font-size:16px;
  font-weight:700;
  color:#fff;
  text-align:center;
  margin-bottom:8px;
}
.digidex-detail .detail-row{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  color:#ccc;
  padding:3px 0;
  border-bottom:1px solid #333;
}
.digidex-detail .detail-row span:last-child{ color:#fff; }
.digidex-detail .detail-back{
  margin-top:8px;
  padding:8px;
  width:100%;
  background:#555;
  color:#fff;
  border:none;
  border-radius:4px;
  font-size:13px;
  cursor:pointer;
}
.digidex-detail .detail-back:hover{ background:#777; }

</style>
</head>
<body>
<h2 class="title">Digimon V-Pet</h2>

<!-- 單個主顯示屏 -->
<canvas id="screen" class="main-screen" width="32" height="16"></canvas>

<!-- 左右箭頭切換 -->
<div class="nav-bar">
  <button class="arrow-btn" id="btnLeft">◀</button>
  <button class="arrow-btn" id="btnRight">▶</button>
</div>

<!-- 中層：8個功能按鈕 -->
<div class="btn-panel" id="btnPanel">
</div>

<!-- 對戰面板（8個按鈕下方） -->
<div class="stats-display" id="battleDisplay" style="display:none;">
  <div class="sd-title" id="battleTitle">對戰</div>
  <div class="battle-info" id="battleInfo">
    <div class="battle-vs-row">
      <div class="battle-side enemy">
        <div class="battle-side-name" id="battleEnemyName"></div>
        <div class="battle-side-hp" id="battleEnemyHpText"></div>
      </div>
      <div class="battle-vs-text">⚔ VS</div>
      <div class="battle-side player">
        <div class="battle-side-name" id="battlePlayerName"></div>
        <div class="battle-side-hp" id="battlePlayerHpText"></div>
      </div>
    </div>
  </div>
  <div class="battle-msg" id="battleMsg"></div>
  <div class="battle-log" id="battleLog"></div>
  <div class="adversity-evo-banner" id="adversityEvoBanner">逆境進化!</div>
  <div class="battle-btns" id="battleBtns">
    <button class="battle-atk-btn" id="battleAttackBtn">攻擊</button>
    <button class="battle-run-btn" id="battleRunBtn">逃跑</button>
  </div>
</div>

<!-- 狀態面板（按鈕下方） -->
<div class="stats-display" id="statsDisplay">
  <div class="sd-title" id="sdName">Agumon</div>
  <div class="sd-row"><span>階段</span><span id="sdStage">成長期</span></div>
  <div class="sd-row"><span>屬性</span><span id="sdAttr">vaccine</span></div>
  <div class="sd-row"><span>年齡</span><span id="sdAge">0歲</span></div>
  <div class="sd-row"><span>體重</span><span id="sdWeight">5</span></div>
  <div class="sd-row"><span>飢餓</span><span id="sdHunger" style="font-size:12px;letter-spacing:1px;">❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️</span></div>
  <div class="sd-row"><span>生命值</span><span id="sdHp">120 / 120</span></div>
  <div class="sd-row"><span>攻擊力</span><span id="sdAtk">12</span></div>
  <div class="sd-row"><span>速度</span><span id="sdSpeed">3</span></div>
  <div class="sd-row"><span>爆擊率</span><span id="sdDouble">8%</span></div>
  <div class="sd-row"><span>閃避率</span><span id="sdEvade">5%</span></div>
  <div class="sd-row"><span>親密度</span><span id="sdAffinity">0</span></div>
  <div class="sd-row"><span>訓練點</span><span id="sdTrainingPoints">0</span></div>
</div>

<!-- 食物面板（按鈕下方） -->
<div class="stats-display" id="foodDisplay" style="display:none;">
  <div class="sd-title">食物選擇</div>
  <div id="foodList" style="padding:4px 0;">
    <div class="food-item" data-food="meat" onclick="feedDigimon('meat')">🥩 1.肉</div>
  </div>
</div>

<!-- 訓練面板 -->
<div class="stats-display" id="trainingDisplay" style="display:none;">
  <div class="sd-title">訓練</div>
  <!-- 模式選擇 -->
  <div id="trainingModeSelect">
    <div class="training-mode-selector">
      <div class="training-mode-btn" id="trainingModeAttack" data-mode="attack">
        <span>1. 攻擊訓練</span>
        <span class="help-icon" data-mode="attack">!</span>
      </div>
      <div class="training-mode-btn" id="trainingModeLife" data-mode="life">
        <span>2. 生命訓練</span>
        <span class="help-icon" data-mode="life">!</span>
      </div>
      <div class="training-mode-btn" id="trainingModeCritical" data-mode="critical">
        <span>3. 爆擊訓練</span>
        <span class="help-icon" data-mode="critical">!</span>
      </div>
      <div class="training-mode-btn" id="trainingModeEvade" data-mode="evade">
        <span>4. 閃避訓練</span>
        <span class="help-icon" data-mode="evade">!</span>
      </div>
      <div class="training-mode-btn" id="trainingModeSpeed" data-mode="speed">
        <span>5. 攻速訓練</span>
        <span class="help-icon" data-mode="speed">!</span>
      </div>
      <div class="training-mode-btn" id="trainingModeEvo" data-mode="evo">
        <span>6. 特殊進化訓練</span>
        <span class="help-icon" data-mode="evo">!</span>
      </div>
    </div>
    <div id="trainingHelpPopup" style="display:none;background:#1a1a2e;border:1px solid #ffcc00;border-radius:6px;padding:8px 10px;margin-bottom:8px;font-size:12px;color:#ddd;line-height:1.6;"></div>
    <div style="text-align:center;">
      <button class="training-back-btn" id="trainingBackBtn">返回</button>
    </div>
  </div>
  <!-- 開始訓練後 -->
  <div id="trainingPlayView" style="display:none; text-align:center; position:relative;">
    <div id="trainingTimerDisplay" class="training-timer">3</div>
    <button class="training-click-btn" id="trainingClickBtn">點擊</button>
    <div id="speedTrainingBtns" style="display:none; gap:8px; justify-content:center;">
      <button class="training-click-btn" id="speedBtnA" style="background:#e74c3c; width:64px;">A</button>
      <button class="training-click-btn" id="speedBtnB" style="background:#3498db; width:64px;">B</button>
    </div>
    <div id="evoGrid" style="display:none; flex-direction:column; gap:4px; align-items:center; margin:8px 0;">
      <div style="display:flex; gap:4px;">
        <button class="evo-card" data-idx="0"></button>
        <button class="evo-card" data-idx="1"></button>
        <button class="evo-card" data-idx="2"></button>
      </div>
      <div style="display:flex; gap:4px;">
        <button class="evo-card" data-idx="3"></button>
        <button class="evo-card" data-idx="4"></button>
        <button class="evo-card" data-idx="5"></button>
      </div>
      <div style="display:flex; gap:4px;">
        <button class="evo-card" data-idx="6"></button>
        <button class="evo-card" data-idx="7"></button>
        <button class="evo-card" data-idx="8"></button>
      </div>
    </div>
    <button class="training-back-btn" id="trainingModeBackBtn">返回選擇</button>
  </div>
</div>

<!-- 圖鑑面板 -->
<div class="stats-display" id="digidexDisplay" style="display:none;">
  <div class="sd-title">圖鑑</div>
  <div id="digidexContent"></div>
  <div class="digidex-detail" id="digidexDetail"></div>
</div>

<script>
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');

// ========== 參數設定 ==========
const CELL_SIZE = 16;
const GAP = 1;
const PITCH = CELL_SIZE + GAP; // 17
const ROWS = 18;
const COLS = 12;
const FRAME_LABELS = ["idle","idle","eat","eat","sleep","sleep","refuse","happy","angry","hurt","sad","attack"];
const DIGIMON_NAMES = ["Botamon","Koromon","Agumon","Greymon","MetalGreymon","WarGreymon","Omegamon"];

// ========== 圖鑑資料 ==========
const DIGIDEX_STAGES = [
  { name: "幼年期",   rows: [0] },
  { name: "幼年期Ⅱ", rows: [1] },
  { name: "成長期",   rows: [2, 3] },
  { name: "成熟期",   rows: [4, 5, 6, 7, 8, 9, 10] },
  { name: "完全體",   rows: [11, 12, 13] },
];
// 所有 sprite row 的名稱（0～13）
const ALL_NAMES = [
  "黑球獸","滾球獸","亞古獸","貝塔獸",
  "暴龍獸","巨龍獸","惡魔獸","火焰獸","飛龍獸","海龍獸","鼻涕獸",
  "機械暴龍獸","豆豆獸","熊仔獸",
];

// 進化路線：根據當前 row 返回下一階段的隨機 row
function getEvolutionRow(row) {
  if (row === 0) return 1;                         // 黑球獸 → 滾球獸
  if (row === 1) return 2 + Math.floor(Math.random() * 2); // 滾球獸 → 隨機成長期 (2~3)
  if (row >= 2 && row <= 3) return 4 + Math.floor(Math.random() * 7); // 成長期 → 隨機成熟期 (4~10)
  if (row >= 4 && row <= 10) return 11 + Math.floor(Math.random() * 3); // 成熟期 → 隨機完全體 (11~13)
  return row;                                      // 完全體 → 不變
}

// 精靈圖路徑（獨立行圖片）
const BG_NAMES = ["Normal", "Noon", "dusk", "Night"];

let rowImages = new Array(18); // row_00.png ~ row_17.png
let attackRowImages = new Array(14); // Attack/00_at.png ~ 13_at.png（龍發射的火球圖）
let meatImage = new Image();
let bgImages = {};
let currentBgName = "Normal";

function getBgNameByHour(h) {
  if (h >= 19 || h < 5) return "Night";
  if (h >= 5 && h < 7) return "dusk";
  if (h >= 7 && h < 10) return "Normal";
  if (h >= 10 && h < 14) return "Noon";
  if (h >= 14 && h < 17) return "Normal";
  return "dusk"; // 17:00-18:59
}

function updateBgByTime() {
  const name = getBgNameByHour(new Date().getHours());
  if (name !== currentBgName) {
    currentBgName = name;
    renderFrame();
  }
}
let currentRow = 2;    // 目前選擇的數碼獸 row
// 當前場景（目前僅用來決定渲染行為）

// ========== 自動動畫變數 ==========
let autoX = 9;            // 1~17 連續座標（16px 精靈在 32px 畫布內）
let autoTargetX = null;
let autoAnimStep = 0;
const ANIM_IV = 800;
const EDGE_IV = 500;
const MOVE_IV = 2000;
const EDGE_SEQ = [0, 11, 11, 0];
const MID_SEQ  = [0, 0, 0, 1];
let autoAnimIv = ANIM_IV;
let autoTimer = null;
let autoMoveTimer = null;

const EAT_IV = 400;
const REFUSE_IV = 300;

// ========== 繪製 ==========
function getColForAuto(){
  const isEdge = autoX <= 1 || autoX >= 17;
  const isMoving = autoTargetX !== null;
  if(isEdge && !isMoving) return EDGE_SEQ[autoAnimStep % 4];
  return MID_SEQ[autoAnimStep % 4];
}

function renderFrame(){
  if(trainingMode){
    renderTrainingCanvas();
    return;
  }
  if(gameMode === "battle"){
    renderBattleScene();
    return;
  }
  ctx.fillStyle="#000";
  ctx.fillRect(0,0,32,16);
  // 背景（根據目前時間）
  ctx.drawImage(bgImages[currentBgName] || bgImages["Normal"], 0, 0, 32, 16);

  if(gameMode === "eating"){
    // 進食模式：龍在右邊向左，食物固定，動畫依序切換 4 幀
    const col = (gameModeStep % 2 === 0) ? 2 : 3; // eat1 / eat2
    const foodX = 0;                                // 食物固定在左側
    const foodFrame = Math.floor((gameModeStep + 1) / 2); // 只在 EAT2 時進幀
    // 畫肉
    if(meatImage.complete && meatImage.naturalWidth > 0){
      ctx.drawImage(
        meatImage,
        foodFrame * CELL_SIZE, 0, CELL_SIZE, CELL_SIZE,
        foodX, 0, CELL_SIZE, CELL_SIZE
      );
    }
    // 龍在右邊 (autoX=14)，面向左（預設方向）
    ctx.drawImage(
      rowImages[currentRow],
      col * PITCH, 0,
      CELL_SIZE, CELL_SIZE,
      16, 0,  // 龍靠右邊站位
      CELL_SIZE, CELL_SIZE
    );
    return;
  }

  if(gameMode === "refusing"){
    // 拒絕模式：龍在中間左右面向交替（左→右→左→右）
    const faceFlip = gameModeStep % 2 === 0;
    ctx.save();
    let drawX = 8;
    if(faceFlip){
      ctx.translate(32, 0);
      ctx.scale(-1, 1);
      drawX = 16 - 8; // 翻轉後座標校正
    }
    ctx.drawImage(
      rowImages[currentRow],
      6 * PITCH, 0,  // col 6 = refuse frame, source y=0
      CELL_SIZE, CELL_SIZE,
      drawX, 0,
      CELL_SIZE, CELL_SIZE
    );
    ctx.restore();
    return;
  }

  // 普通模式
  const colIndex = getColForAuto();
  const faceRight = (autoTargetX !== null && autoX < autoTargetX) || (autoTargetX === null && autoX >= 9);
  const spriteX = autoX - 1;

  ctx.save();
  let drawX = spriteX;
  if(faceRight){
    ctx.translate(32, 0);
    ctx.scale(-1, 1);
    drawX = 16 - spriteX; // 翻转後座標校正
  }
  ctx.drawImage(
    rowImages[currentRow],
    colIndex * PITCH, 0,
    CELL_SIZE, CELL_SIZE,
    drawX, 0,
    CELL_SIZE, CELL_SIZE
  );
  ctx.restore();
}

// ========== 動畫 / 移動 ==========
function stepAutoAnim(){
  // 進食模式
  if(gameMode === "eating"){
    gameModeStep++;
    if(gameModeStep >= 6){
      gameMode = "auto";
      gameModeStep = 0;
      // 動畫結束後走回中間
      autoTargetX = 9;
      autoAnimStep = 0;
      restartAnimTimer(ANIM_IV);
      if(!autoMoveTimer) autoMoveTimer = setInterval(stepAutoMove, MOVE_IV);
      renderFrame();
      return;
    }
    renderFrame();
    return;
  }
  // 拒絕模式（搖晃）
  if(gameMode === "refusing"){
    gameModeStep++;
    if(gameModeStep >= 8){
      gameMode = "auto";
      gameModeStep = 0;
      autoAnimStep = 0;
      autoTargetX = 9;
      restartAnimTimer(ANIM_IV);
      if(!autoMoveTimer) autoMoveTimer = setInterval(stepAutoMove, MOVE_IV);
      renderFrame();
      return;
    }
    renderFrame();
    return;
  }
  // 普通模式
  let justLanded = false;
  if(autoTargetX !== null){
    const step = autoX < autoTargetX ? 1 : -1;
    autoX += step;
    if(Math.abs(autoX - autoTargetX) < 0.5 ||
       (step > 0 && autoX >= autoTargetX) ||
       (step < 0 && autoX <= autoTargetX)){
      autoX = autoTargetX;
      autoTargetX = null;
      justLanded = true;
    }
  }
  if(justLanded && (autoX <= 1 || autoX >= 17)) {
    autoAnimStep = -1;
  }
  autoAnimStep++;
  renderFrame();
  const isEdge = autoX <= 1 || autoX >= 17;
  if(isEdge && autoTargetX === null && autoAnimIv !== EDGE_IV){
    restartAnimTimer(EDGE_IV);
  } else if(!isEdge && autoAnimIv !== ANIM_IV){
    restartAnimTimer(ANIM_IV);
  }
}

function stepAutoMove(){
  if(autoTargetX !== null) return;
  const isEdge = autoX <= 1 || autoX >= 17;
  if(isEdge){
    if(autoAnimStep < 5) return;
    autoTargetX = 9;
  } else {
    if(Math.random() < 0.1) return;
    const dir = Math.random() < 0.5 ? -1 : 1;
    const t = autoX + dir * 5;
    autoTargetX = Math.max(1, Math.min(17, t));
    if(autoTargetX === autoX) return;
  }
  autoAnimStep = 0;
}

function restartAnimTimer(iv){
  if(autoAnimIv === iv) return;
  if(autoTimer) clearInterval(autoTimer);
  autoAnimIv = iv;
  autoTimer = setInterval(stepAutoAnim, iv);
}

function startAutoPlay(){
  updateBgByTime(); // 首次根據時間設定背景
  autoX = 9;
  autoTargetX = null;
  autoAnimStep = 0;
  autoAnimIv = ANIM_IV;
  autoTimer = setInterval(stepAutoAnim, ANIM_IV);
  autoMoveTimer = setInterval(stepAutoMove, MOVE_IV);
  renderFrame();
}

  trainingPowerHidden = false;
  // 重置生命訓練狀態（隨機 2~4 個 point）
  lifePointsRemaining = Math.floor(Math.random() * 3) + 2;
  lifeShieldBroken = false;
  lifePhase = "play";

  // 爆擊訓練：不計時，改 bar 移動
  if(trainingType === "critical"){
    document.getElementById("trainingTimerDisplay").textContent = "";
    criticalWallBroken = false;
    startCriticalBar();
    renderFrame();
    return;
  }

  // 閃避訓練：不計時，飛彈移動
  if(trainingType === "evade"){
    document.getElementById("trainingTimerDisplay").textContent = "";
    evadePhase = "moving";
    evadeProjX = -16;
    evadeSucceeded = false;
    evadeDragonFlipped = false;
    startEvadeProjectile();
    renderFrame();
    return;
  }

  // 攻速訓練：序列 AB 配對，從左到右點擊
  if(trainingType === "speed"){
    speedActive = true;
    speedSequence = [];
    speedCurrentIndex = 0;
    speedDragonX = 48;
    speedMovePhase = "";
    speedCorrectFlashAt = -1;
    // 隨機生成 6 個 A/B 字母
    for(let i = 0; i < SPEED_SEQ_COUNT; i++){
      speedSequence.push(Math.random() < 0.5 ? "A" : "B");
    }
    speedCountdown = 3;
    document.getElementById("trainingTimerDisplay").textContent = speedCountdown;
    if(speedCountdownTimer){ clearInterval(speedCountdownTimer); }
    speedCountdownTimer = setInterval(() => {
      speedCountdown--;
      document.getElementById("trainingTimerDisplay").textContent = speedCountdown;
      if(speedCountdown <= 0){
        clearInterval(speedCountdownTimer);
        speedCountdownTimer = null;
        clearSpeedTraining();
        speedDragonX = 32;
        triggerTrainingFailure();
      }
    }, 1000);
    document.getElementById("trainingClickBtn").style.display = "none";
    document.getElementById("speedTrainingBtns").style.display = "flex";
    renderFrame();
    return;
  }

  // 特殊進化訓練：記憶翻牌
  if(trainingType === "evo"){
    evoActive = true;
    evoFound = 0;
    evoPhase = "showing";
    evoTarget = Math.floor(Math.random() * EVO_TYPES);
    // 每種類型各 3 張，共 9 張，打亂
    evoCards = [];
    for(let t = 0; t < EVO_TYPES; t++){
      for(let n = 0; n < EVO_EACH; n++){
        evoCards.push(t);
      }
    }
    for(let i = evoCards.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [evoCards[i], evoCards[j]] = [evoCards[j], evoCards[i]];
    }
    // 顯示卡片顏色
    updateEvoCards(true);
    // 2 秒後翻牌
    if(evoFlipTimer) clearTimeout(evoFlipTimer);
    evoFlipTimer = setTimeout(() => {
      evoPhase = "playing";
      updateEvoCards(false);
    }, EVO_SHOW_MS);
    document.getElementById("trainingTimerDisplay").textContent = "";
    document.getElementById("trainingClickBtn").style.display = "none";
    document.getElementById("speedTrainingBtns").style.display = "none";
    document.getElementById("evoGrid").style.display = "flex";
    renderFrame();
    return;
  }

  // 開始倒數計時（UI 每秒更新）
  trainingCountdown = (trainingType === "life") ? 2 : 3;
  document.getElementById("trainingTimerDisplay").textContent = trainingCountdown;
  trainingTimer = setInterval(() => {
    if(!trainingMode) return; // 已退出訓練，立即停止
    trainingCountdown--;
    document.getElementById("trainingTimerDisplay").textContent = trainingCountdown;
    if(trainingCountdown <= 0){
      clearInterval(trainingTimer);
      trainingTimer = null;
      document.getElementById("trainingTimerDisplay").textContent = "";
      // 生命訓練：4 個點全消失 = 成功，否則失敗
      if(trainingType === "life"){
        if(lifePointsRemaining <= 0 && !lifeShieldBroken){
          triggerTrainingAttack();
        } else {
          triggerTrainingFailure();
        }
      } else {
        triggerTrainingFailure();
      }
    }
  }, 1000);

  renderFrame();
}

function backToTrainingModeSelect(){
  if(trainingAttackActive || trainingCelebrationActive || trainingFailureActive) return;
  // 清除計時器
  if(trainingTimer){
    clearInterval(trainingTimer);
    trainingTimer = null;
  }
  document.getElementById("trainingTimerDisplay").textContent = "";
  // 重置充能狀態
  trainingLevel = 0;
  trainingClickCount = 0;
  trainingPowerHidden = false;
  lifePhase = "play";
  // 爆擊訓練清理
  if(criticalBarTimer){
    clearInterval(criticalBarTimer);
    criticalBarTimer = null;
  }
  if(criticalAttackTimer){
    clearInterval(criticalAttackTimer);
    criticalAttackTimer = null;
  }
  criticalBarActive = false;
  // 閃避訓練清理
  if(evadeProjTimer){
    clearInterval(evadeProjTimer);

  }

  }

  }

    boomTimer = null;
  }

  }

    trainingTimer = null;
  }
  document.getElementById("trainingTimerDisplay").textContent = "";

    clearInterval(trainingFailureTimer);

  }

  }

  }

  }

  }

  }

  }

  evadeDragonFlipped = false;

  if(trainingSucceeded){
    gameTrainingPoints += 1;
    gameWeight = Math.max(1, gameWeight - 1); // 訓練減肥
    trainingSucceeded = false;
  }
  // 恢復 canvas 尺寸
  canvas.width = CANVAS_NORMAL_W;
  canvas.style.width = "";
  // 恢復自動模式
  startAutoPlay();
}

function handleTrainingClick(){
  if(trainingAttackActive) return;  // 攻擊動畫中不可操作
  if(trainingCelebrationActive) return; // 慶祝中不可操作
  if(trainingFailed || trainingFailureActive) return; // 失敗後不可再點
  
  // 生命訓練邏輯
  if(trainingType === "life"){
    if(lifeShieldBroken) return;
    if(lifePointsRemaining <= 0){
      // 點完所有 point 再點 → 盾牌破壞 = 失敗
      lifeShieldBroken = true;
      if(trainingTimer){
        clearInterval(trainingTimer);
        trainingTimer = null;
      }
      document.getElementById("trainingTimerDisplay").textContent = "";
      triggerTrainingFailure();
      return;
    }
    lifePointsRemaining--;
    renderFrame();
    return;
  }

  // 爆擊訓練：停止 bar，判定成敗
  if(trainingType === "critical"){
    if(!criticalBarActive) return;
    stopCriticalBar();
    return;
  }

  // 閃避訓練：飛彈碰到 instruct 即成功
  if(trainingType === "evade"){
    if(evadePhase !== "moving") return;
    // 成功區間：飛彈頭（右側）碰到 instruct（x=40~48）
    if(evadeProjX >= 24 && evadeProjX <= 32){
      evadePhase = "success";
      evadeSucceeded = true;
      evadeDragonFlipped = true;  // 成功後龍面向右
      clearInterval(evadeProjTimer);
      evadeProjTimer = null;
      // 飛彈穿過（繼續往右飛出畫面消失）
      const finishTimer = setInterval(() => {
        evadeProjX += 2;
        if(evadeProjX >= 64){
          clearInterval(finishTimer);
          evadePhase = "done";
          startEvadeCelebration();
        }
        renderFrame();
      }, 30);
    } else {
      // 不在躲避區點擊 = 失敗
      evadePhase = "failure";
      evadeSucceeded = false;
      clearInterval(evadeProjTimer);
      evadeProjTimer = null;
      triggerTrainingFailure();
    }
    return;
  }
  
  trainingClickCount++;
  // 每2次點擊向右移動1格
  if(trainingClickCount % 2 === 0){
    trainingLevel++;
    if(trainingLevel >= TRAIN_SLOTS){
      // 成功滿能 → 清除計時器，觸發攻擊
      if(trainingTimer){
        clearInterval(trainingTimer);
        trainingTimer = null;
      }
      document.getElementById("trainingTimerDisplay").textContent = "";
      triggerTrainingAttack();
      return;
    }
  }
  renderFrame();
}

function triggerTrainingAttack(){
  trainingSucceeded = true;
  trainingAttackActive = true;
  trainingLevel = 6;
  // 確保計時器清除
  if(trainingTimer){
    clearInterval(trainingTimer);
    trainingTimer = null;
  }
  document.getElementById("trainingTimerDisplay").textContent = "";
  // 攻擊時停止 idle 與沙包動畫
  if(trainingIdleTimer){
    clearInterval(trainingIdleTimer);
    trainingIdleTimer = null;
  }
  if(sandbagTimer){
    clearInterval(sandbagTimer);
    sandbagTimer = null;
  }

  // 生命訓練：新的成功動畫序列（boxing → boom → shield 完好 → 龍移動 happy）
  if(trainingType === "life"){
    startLifeSuccessAnimation();
    return;
  }

  trainingProjectileX = 16;
  renderFrame();
  
  // 火球連續每像素向左移動
  trainingProjectileTimer = setInterval(() => {
    if(!trainingMode) return;
    trainingProjectileX -= 1;
    renderFrame();
    if(trainingProjectileX <= 0){
      // 火球擊中沙包 → 停止移動、觸發爆炸
      clearInterval(trainingProjectileTimer);
      trainingProjectileTimer = null;
      trainingAttackActive = false;
      startBoomSequence();
    } else if(trainingProjectileX < -16){
      // 防護：若直接飛過頭則重置
      clearInterval(trainingProjectileTimer);
      trainingProjectileTimer = null;
      trainingAttackActive = false;
      endTrainingAttack();
    }
  }, 16);
}

function startBoomSequence(){
  // 切換到爆炸狀態
  sandbagState = "boom";
  boomFrame = 0;
  boomCycle = 0;
  renderFrame();
  
  // 每 200ms 切換爆炸幀，2 週期後結束
  boomTimer = setInterval(() => {
    if(!trainingMode) return;
    boomFrame = boomFrame === 0 ? 1 : 0;
    if(boomFrame === 0){
      boomCycle++; // 完成一個完整週期 (01→02)
    }
    if(boomCycle >= 2){
      clearInterval(boomTimer);
      boomTimer = null;
      // 爆炸結束 → 換成被打中的沙包
      sandbagState = "hit";
      renderFrame();
      endTrainingAttack();
      return;
    }
    renderFrame();
  }, 200);
}

function endTrainingAttack(){
  // 攻擊/爆炸完成的清理與重置
  trainingLevel = 0;
  trainingClickCount = 0;
  trainingProjectileX = 0;
  trainingAttackActive = false;
  trainingPowerHidden = true;

  // 停止 idle 定時器（若有）
  if(trainingIdleTimer){
    clearInterval(trainingIdleTimer);
    trainingIdleTimer = null;
  }

  // 開始慶祝動畫：idle → happy → idle → happy
  trainingCelebrationActive = true;
  trainingCelebrationStep = 0;
  trainingCelebrationTimer = setInterval(() => {
    if(!trainingMode) return;
    trainingCelebrationStep++;
    if(trainingCelebrationStep >= TRAINING_CELEBRATION_SEQ.length){
      // 慶祝結束，自動返回
      clearInterval(trainingCelebrationTimer);
      trainingCelebrationTimer = null;
      trainingCelebrationActive = false;
      stopTraining();
    }
    renderFrame();
  }, 600);

  renderFrame();
}

function triggerTrainingFailure(){
  if(trainingAttackActive) return;  // 攻擊中不算失敗
  if(trainingFailed) return;       // 已經失敗了
  if(trainingLevel >= TRAIN_SLOTS) return; // 已滿不算
  if(trainingFailureActive) return;

  // 確保計時器已清除
  if(trainingTimer){
    clearInterval(trainingTimer);
    trainingTimer = null;
  }
  document.getElementById("trainingTimerDisplay").textContent = "";

  trainingFailed = true;
  trainingFailureActive = true;
  trainingPowerHidden = true;

  // 停止 Idle 動畫
  if(trainingIdleTimer){
    clearInterval(trainingIdleTimer);
    trainingIdleTimer = null;
  }

  // 生命訓練：先等 1 秒（盾牌完好），龍再移動到盾牌位置 + SAD
  if(trainingType === "life"){
    lifePhase = "failureHold";      // 等 1 秒，龍在 x=48，盾牌完好
    renderFrame();
    lifeFailureHoldTimer = setTimeout(() => {
      lifeFailureHoldTimer = null;
      lifePhase = "failure";        // 盾牌隱藏，龍移到盾牌位置
      lifeDragonMoveX = 32;
      // 開始 SAD 動畫
      trainingFailureStep = 0;
      trainingFailureTimer = setInterval(() => {
        if(!trainingMode) return;
        trainingFailureStep++;
        if(trainingFailureStep >= TRAINING_FAILURE_SEQ.length){
          clearInterval(trainingFailureTimer);
          trainingFailureTimer = null;
          trainingFailureActive = false;
          trainingFailed = false;
          stopTraining();
        }
        renderFrame();
      }, 600);
      renderFrame();
    }, 1000);
    return;
  }

  // 其他訓練：直接失敗動畫
  trainingFailureStep = 0;
  trainingFailureTimer = setInterval(() => {
    if(!trainingMode) return;
    trainingFailureStep++;
    if(trainingFailureStep >= TRAINING_FAILURE_SEQ.length){
      clearInterval(trainingFailureTimer);
      trainingFailureTimer = null;
      trainingFailureActive = false;
      trainingFailed = false;
      stopTraining();
    }
    renderFrame();
  }, 600);

  renderFrame();
}

// ========== 生命訓練成功動畫 ==========
function startLifeSuccessAnimation(){
  trainingSucceeded = true;
  // 確保計時器清除
  if(trainingTimer){
    clearInterval(trainingTimer);
    trainingTimer = null;
  }
  document.getElementById("trainingTimerDisplay").textContent = "";
  if(trainingCelebrationTimer){
    clearInterval(trainingCelebrationTimer);
    trainingCelebrationTimer = null;
  }
  trainingCelebrationActive = false;
  trainingCelebrationStep = 0;
  trainingPowerHidden = true;

  // 龍保持原本位置 x=48
  lifeDragonMoveX = 48;

  // 階段 1: boxing 從最左一格一格向右移動到盾牌
  lifePhase = "boxing";
  lifeBoxingX = 0;
  renderFrame();

  let boxingStepCount = 0;
  lifeBoxingTimer = setInterval(() => {
    if(!trainingMode) return;
    boxingStepCount++;
    if(boxingStepCount >= 32){
      // 已到達盾牌位置 (x=32)，切到 BOOM 階段
      clearInterval(lifeBoxingTimer);
      lifeBoxingTimer = null;
      lifePhase = "boom";
      startLifeBoom();
    } else {
      lifeBoxingX += 1; // 每次移動 1 像素
      renderFrame();
    }
  }, 30);
}

function startLifeBoom(){
  // 顯示 BOOM 動畫覆蓋盾牌位置
  boomFrame = 0;
  boomCycle = 0;
  renderFrame();

  lifeBoomTimer = setInterval(() => {
    if(!trainingMode) return;
    boomFrame = boomFrame === 0 ? 1 : 0;
    if(boomFrame === 0) boomCycle++;
    if(boomCycle >= 2){
      // BOOM 結束 → 盾牌完好顯示 1 秒
      clearInterval(lifeBoomTimer);
      lifeBoomTimer = null;
      lifePhase = "shieldHold";
      renderFrame();
      lifeShieldHoldTimer = setTimeout(() => {
        lifeShieldHoldTimer = null;
        // 盾牌隱藏，龍移動到盾牌位置 + happy
        lifePhase = "celebration";
        startLifeCelebration();
      }, 1000);
      return;
    }
    renderFrame();
  }, 200);
}

function startLifeCelebration(){
  lifeDragonMoveX = 48;
  trainingCelebrationActive = true;
  trainingCelebrationStep = 0;
  trainingAttackActive = false; // 慶祝階段由 trainingCelebrationActive 阻擋操作

  trainingCelebrationTimer = setInterval(() => {
    if(!trainingMode) return;
    trainingCelebrationStep++;
    // 龍在慶祝過程中從 x=48 移動到 x=32（盾牌位置，從右到左第2個16×16）
    if(trainingCelebrationStep === 1) lifeDragonMoveX = 32;       // 第1下 happy 就到盾牌位置
    else if(trainingCelebrationStep >= 2) lifeDragonMoveX = 32;   // 停留

    if(trainingCelebrationStep >= TRAINING_CELEBRATION_SEQ.length){
      clearInterval(trainingCelebrationTimer);
      trainingCelebrationTimer = null;
      trainingCelebrationActive = false;
      stopTraining();
      return;
    }
    renderFrame();
  }, 600);
  renderFrame();
}

// ========== 爆擊訓練函數 ==========
function startCriticalBar(){
  criticalPos = 0;
  criticalDirection = 1;
  criticalBarActive = true;
  criticalPaused = false;
  renderFrame();

  criticalBarTimer = setInterval(() => {
    if(!criticalBarActive) return;
    if(criticalPaused) return; // 端點暫停中，等 timeout 恢復

    criticalPos += criticalDirection;

    if(criticalPos > 3){
      // 到最右邊 (x=48)，暫停 1 秒後左移
      criticalPos = 3;
      criticalPaused = true;
      renderFrame();
      setTimeout(() => {
        criticalPaused = false;
        criticalDirection = -1;
        criticalPos = 2;
        renderFrame();
      }, 400);
      return;
    } else if(criticalPos < 0){
      // 到最左邊 (x=0)，立即右移
      criticalPos = 0;
      criticalDirection = 1;
      criticalPos = 1;
      renderFrame();
      return;
    }
    renderFrame();
  }, 150);
}

function stopCriticalBar(){
  criticalBarActive = false;
  if(criticalBarTimer){
    clearInterval(criticalBarTimer);
    criticalBarTimer = null;
  }
  if(criticalPos === 3){
    // 停在最右 → 成功！雙上下攻擊
    startCriticalSuccessAnimation();
  } else {
    // 沒對準 → 失敗
    if(trainingTimer){
      clearInterval(trainingTimer);
      trainingTimer = null;
    }
    document.getElementById("trainingTimerDisplay").textContent = "";
    triggerTrainingFailure();
  }
}

function startCriticalSuccessAnimation(){
  trainingSucceeded = true;
  // 成功：龍在 x=32 發射雙火球 → 抵達牆後 BOOM → 牆變 broken → 慶祝
  trainingAttackActive = true;
  criticalAttackStep = 16;  // 火球起始 x 位置
  criticalWallBroken = false;
  renderFrame();

  // Phase 1：火球從 x=16 一格一格向左移動到牆（16ms 每格）
  criticalAttackTimer = setInterval(() => {
    if(!trainingMode) return;
    criticalAttackStep -= 1;
    if(criticalAttackStep <= 0){
      // 火球抵達牆，切到 Phase 2：BOOM 動畫
      clearInterval(criticalAttackTimer);
      boomFrame = 0;
      boomCycle = 0;
      renderFrame();

      criticalAttackTimer = setInterval(() => {
        if(!trainingMode) return;
        boomFrame = boomFrame === 0 ? 1 : 0;
        if(boomFrame === 0) boomCycle++;
        if(boomCycle >= 2){
          // BOOM 結束 → 牆變 broken → 慶祝
          clearInterval(criticalAttackTimer);
          criticalAttackTimer = null;
          criticalWallBroken = true;
          trainingAttackActive = false;
          endTrainingAttack();
          return;
        }
        renderFrame();
      }, 200);
      return;
    }
    renderFrame();
  }, 16);
}

// ========== 閃避訓練函式 ==========
function startEvadeProjectile(){
  // instruct 3幀循環固定 x=40（每200ms切換一幀）
  evadeInstructFrame = 0;
  if(evadeInstructTimer){ clearInterval(evadeInstructTimer); }
  evadeInstructTimer = setInterval(() => {
    evadeInstructFrame = (evadeInstructFrame + 1) % 3;
    renderFrame();
  }, 200);

  // 飛彈移動（從左往右，每20ms移動1像素）
  evadeProjTimer = setInterval(() => {
    if(!trainingMode) return;
    evadeProjX += 1;
    if(evadeProjX >= 48){
      // 飛彈到達龍的位置而沒被閃避 → 失敗（被擊中）
      clearInterval(evadeProjTimer);
      evadeProjTimer = null;
      if(evadeInstructTimer){ clearInterval(evadeInstructTimer); evadeInstructTimer = null; }
      if(evadePhase === "moving"){
        evadePhase = "failure";
        evadeSucceeded = false;
        triggerTrainingFailure();
      }
    }
    renderFrame();
  }, 30);
}

function startEvadeCelebration(){
  // 清除計時器
  if(trainingTimer){ clearInterval(trainingTimer); trainingTimer = null; }
  document.getElementById("trainingTimerDisplay").textContent = "";
  if(trainingCelebrationTimer){ clearInterval(trainingCelebrationTimer); trainingCelebrationTimer = null; }
  trainingCelebrationActive = false;
  trainingCelebrationStep = 0;
  trainingPowerHidden = true;
  trainingAttackActive = false;

  trainingCelebrationActive = true;
  trainingCelebrationStep = 0;
  trainingCelebrationTimer = setInterval(() => {
    if(!trainingMode) return;
    trainingCelebrationStep++;
    if(trainingCelebrationStep >= TRAINING_CELEBRATION_SEQ.length){
      clearInterval(trainingCelebrationTimer);
      trainingCelebrationTimer = null;
      trainingCelebrationActive = false;
      trainingCelebrationStep = 0;
      stopTraining();
    }
    renderFrame();
  }, 600);
  renderFrame();
}

// ========== 攻速訓練函數 ==========
function handleSpeedClick(btn){
  if(!speedActive || speedMovePhase !== "") return;
  if(btn === speedSequence[speedCurrentIndex]){
    // 正確：顯示正確指示器並前進到下一個字母
    const justCorrectIdx = speedCurrentIndex;
    speedCorrectFlashAt = justCorrectIdx;
    if(speedCorrectFlashTimer){ clearTimeout(speedCorrectFlashTimer); }
    speedCorrectFlashTimer = setTimeout(() => {
      speedCorrectFlashAt = -1;
      speedCorrectFlashTimer = null;
      renderFrame();
    }, 400);
    speedCurrentIndex++;
    if(speedCurrentIndex >= SPEED_SEQ_COUNT){
      // 全部正確！停止倒數並開始龍向左走的成功動畫
      speedActive = false;
      if(speedCountdownTimer){ clearInterval(speedCountdownTimer); speedCountdownTimer = null; }
      document.getElementById("trainingTimerDisplay").textContent = "";
      document.getElementById("speedTrainingBtns").style.display = "none";
      document.getElementById("trainingClickBtn").style.display = "";
      startSpeedWalkAnimation();
    }
    renderFrame();
  } else {
    // 錯誤 → 立刻失敗，龍移到 x=32
    clearSpeedTraining();
    speedDragonX = 32;
    triggerTrainingFailure();
  }
}

function startSpeedWalkAnimation(){
  trainingSucceeded = true;
  // 第一階段：龍從 x=48 一格一格往左走到 x=0
  speedMovePhase = "movingLeft";
  speedDragonX = 48;
  if(speedMoveTimer){ clearInterval(speedMoveTimer); }
  speedMoveTimer = setInterval(() => {
    speedDragonX--;
    renderFrame();
    if(speedDragonX <= 0){
      // 走到最左，開始返回
      clearInterval(speedMoveTimer);
      speedMovePhase = "returning";
      speedMoveTimer = setInterval(() => {
        speedDragonX++;
        renderFrame();
        if(speedDragonX >= 32){
          // 回到 x=32，顯示 happy
          clearInterval(speedMoveTimer);
          speedMoveTimer = null;
          speedMovePhase = "done";
          // 開始慶祝動畫
          trainingCelebrationActive = true;
          trainingCelebrationStep = 0;
          trainingCelebrationTimer = setInterval(() => {
            if(!trainingMode) return;
            trainingCelebrationStep++;
            if(trainingCelebrationStep >= TRAINING_CELEBRATION_SEQ.length){
              clearInterval(trainingCelebrationTimer);
              trainingCelebrationTimer = null;
              trainingCelebrationActive = false;
              stopTraining();
            }
            renderFrame();
          }, 600);
          renderFrame();
        }
      }, 15);
    }
  }, 15);
}

function clearSpeedTraining(){
  speedActive = false;
  speedMovePhase = "";
  speedCurrentIndex = 0;
  speedSequence = [];
  speedDragonX = 48;
  speedCorrectFlashAt = -1;
  if(speedMoveTimer){ clearInterval(speedMoveTimer); speedMoveTimer = null; }
  if(speedCorrectFlashTimer){ clearTimeout(speedCorrectFlashTimer); speedCorrectFlashTimer = null; }
  if(speedCountdownTimer){ clearInterval(speedCountdownTimer); speedCountdownTimer = null; }
  document.getElementById("trainingTimerDisplay").textContent = "";
  document.getElementById("trainingClickBtn").style.display = "";
  document.getElementById("speedTrainingBtns").style.display = "none";
  document.getElementById("evoGrid").style.display = "none";
}

// ========== 特殊進化訓練函數 ==========
function updateEvoCards(show){
  const cards = document.querySelectorAll(".evo-card");
  cards.forEach(card => {
    const idx = parseInt(card.getAttribute("data-idx"));
    const type = evoCards[idx];
    card.className = "evo-card";
    card.style.backgroundImage = ""; // 清除上局殘留的 inline style
    card.style.backgroundSize = "";
    card.style.backgroundPosition = "";
    if(show){
      // 顯示顏色
      card.classList.add("evo-card-type-"+type);
      card.textContent = "";
    } else {
      // 翻牌（背面）
      card.classList.add("flipped");
      card.textContent = "?";
    }
  });
}

function handleEvoClick(idx){
  if(!evoActive || evoPhase !== "playing") return;
  const card = document.querySelector(`.evo-card[data-idx="${idx}"]`);
  if(!card || card.classList.contains("found")) return;
  const type = evoCards[idx];
  if(type === evoTarget){
    // 正確！
    evoFound++;
    card.classList.add("found");
    card.textContent = "✓";
    card.style.backgroundImage = "url('" + EVO_COLOR_IMGS[type] + "')";
    card.style.backgroundSize = "cover";
    card.style.backgroundPosition = "center";
    if(evoFound >= EVO_EACH){
      // 全部找到 → 成功
      trainingSucceeded = true;
      evoActive = false;
      evoPhase = "success";
      if(evoFlipTimer){ clearTimeout(evoFlipTimer); evoFlipTimer = null; }
      document.getElementById("trainingTimerDisplay").textContent = "";
      document.getElementById("trainingClickBtn").style.display = "none";
      updateEvoCards(true);
      // 記錄形態（還不切換，等遮罩完全蓋住龍時才換）
      evoOldRow = currentRow;
      evoNewRow = getEvolutionRow(currentRow);
      // 階段1: 進化掃描 (步驟 0~12, 100ms/步)
      //   步驟0~3: 從上方一格一格向下 (y:-16→-4)
      //   步驟4~8: 停在 y=0 遮蓋龍，步驟4時切換為進化龍 (0.5秒)
      //   步驟9~12: 一格一格向上收回 (y:-4→-16)
      evoEvolvePhase = "evolving";
      evoEvolutionActive = true;
      evoEvolutionStep = 0;
      if(evoEvolutionTimer){ clearInterval(evoEvolutionTimer); }
      evoEvolutionTimer = setInterval(() => {
        if(!trainingMode){ return; } // 已退出訓練，立即停止
        evoEvolutionStep++;
        if(evoEvolutionStep < EVO_EVOLVE_END){
          // 步驟4時：掃描遮罩完全蓋住龍 → 切換為進化龍
          if(evoEvolutionStep === 4){
            currentRow = evoNewRow;
            gameAffinity = DIGIMON_STATS[evoNewRow].bondInitial;
          }
        } else if(evoEvolutionStep === EVO_EVOLVE_END){
          // 階段2: 新龍發出攻擊
          evoEvolvePhase = "attack";
          evoEvolutionActive = false;
        } else if(evoEvolutionStep < EVO_ATTACK_END){
          // 持續攻擊
        } else if(evoEvolutionStep === EVO_ATTACK_END){
          // 階段3: 退化掃描（和進化相同：遮罩下→覆蓋→換回原龍→遮罩上）
          evoEvolvePhase = "devolve";
          // 還不切換 currentRow，等遮罩完全蓋住龍時才換（sub-step 4）
        } else if(evoEvolutionStep < EVO_DEVOLVE_END){
          // 步驟23時（EVO_ATTACK_END+4）：遮罩完全蓋住 → 切換回原形態
          if(evoEvolutionStep === EVO_ATTACK_END + 4){
            currentRow = evoOldRow;
            gameAffinity = DIGIMON_STATS[evoOldRow].bondInitial;
          }
        } else if(evoEvolutionStep === EVO_DEVOLVE_END){
          // 階段4: 開心慶祝
          evoEvolvePhase = "happy";
          trainingCelebrationActive = true;
          trainingCelebrationStep = 0;
        } else if(evoEvolutionStep >= EVO_DEVOLVE_END){
          // 開心階段，每2-3 tick推進(平均250ms一步)
          const offset = evoEvolutionStep - EVO_DEVOLVE_END;
          if(offset > 0 && (offset % 5 === 0 || offset % 5 === 2)){
            trainingCelebrationStep++;
          }
          if(trainingCelebrationStep >= TRAINING_CELEBRATION_SEQ.length){ // 開心2次
            clearInterval(evoEvolutionTimer);
            evoEvolutionTimer = null;
            evoEvolutionActive = false;
            trainingCelebrationActive = false;
            saveGameState();
            stopTraining();
            return;
          }
        }
        renderFrame();
      }, EVO_SEQ_INTERVAL);
      renderFrame();
    }
  } else {
    // 錯誤 → 立刻失敗
    // 顯示錯誤卡片原圖
    card.style.backgroundImage = "url('" + EVO_COLOR_IMGS[type] + "')";
    card.style.backgroundSize = "cover";
    card.style.backgroundPosition = "center";
    card.textContent = "✗";
    clearEvoTraining();
    triggerTrainingFailure();
  }
}

function clearEvoTraining(){
  evoActive = false;
  evoPhase = "";
  evoCards = [];
  evoFound = 0;
  evoTarget = -1;
  if(evoFlipTimer){ clearTimeout(evoFlipTimer); evoFlipTimer = null; }
  if(evoEvolutionTimer){ clearInterval(evoEvolutionTimer); evoEvolutionTimer = null; }
  evoEvolutionActive = false;
  evoEvolutionStep = 0;
  evoEvolvePhase = "";
  evoNewRow = -1;
  evoOldRow = -1;
  evoMissileX = 16;
  document.getElementById("trainingTimerDisplay").textContent = "";
  document.getElementById("trainingClickBtn").style.display = "";
  document.getElementById("evoGrid").style.display = "none";
}

function renderTrainingCanvas(){
  // 繪製訓練背景 (384×96 等比繪於 64×16 canvas)
  if(tbgImage.complete && tbgImage.naturalWidth > 0){
    ctx.drawImage(tbgImage, 0, 0, CANVAS_TRAIN_W, 16);
  } else {
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, CANVAS_TRAIN_W, 16);
  }

  // 龍幀選擇：慶祝/失敗/攻擊/平時
  let dragonFrame;
  if(trainingFailureActive){
    dragonFrame = TRAINING_FAILURE_SEQ[trainingFailureStep];
  } else if(trainingCelebrationActive){
    const idx = trainingType === "evo" ? trainingCelebrationStep % TRAINING_CELEBRATION_SEQ.length : trainingCelebrationStep;
    dragonFrame = TRAINING_CELEBRATION_SEQ[idx];
  } else if(trainingAttackActive && trainingType !== "life"){
    dragonFrame = 11;
  } else {
    dragonFrame = trainingIdleFrame;
  }

  if(trainingType === "life"){
    // 生命訓練：根據 lifePhase 決定顯示
    // 計算龍當前 x 位置（慶祝/失敗 sad 時在盾牌位置 x=32，其餘固定 x=48）
    const lifeDragonX = (lifePhase === "celebration" || lifePhase === "failure") ? lifeDragonMoveX : 48;

    // 盾牌 / BOOM 顯示
    if(lifePhase === "boom"){
      // 階段 2: BOOM 動畫覆蓋盾牌位置
      const bImg = boomFrame === 0 ? boomImage : boomImage2;
      if(bImg.complete && bImg.naturalWidth > 0){
        ctx.drawImage(bImg, 32, 0, 16, 16);
      }
    } else if(lifePhase === "celebration" || lifePhase === "failure"){
      // 階段 5: 盾牌隱藏（慶祝 / 失敗 SAD 時）
    } else {
      // 階段 play / boxing / shieldHold：顯示盾牌
      const shieldImg = lifeShieldBroken ? shieldBreakImage : shieldImage;
      if(shieldImg.complete && shieldImg.naturalWidth > 0){
        ctx.drawImage(shieldImg, 32, 0, 16, 16);
      }
      // 僅 play 階段顯示剩餘 point
      if(lifePhase === "play" && !lifeShieldBroken && pointImage.complete && pointImage.naturalWidth > 0){
        const positions = [
          [32, 0], // 上左
          [40, 0], // 上右
          [32, 8], // 下左
          [40, 8], // 下右
        ];
        for(let i = 0; i < lifePointsRemaining && i < 4; i++){
          ctx.drawImage(pointImage, positions[i][0], positions[i][1], 8, 8);
        }
      }
    }

    // 顯示 boxing 圖（僅 boxing 階段）
    if(lifePhase === "boxing" && boxingImage.complete && boxingImage.naturalWidth > 0){
      ctx.drawImage(boxingImage, lifeBoxingX, 0, 16, 16);
    }

    // 龍（跟隨 lifeDragonX，慶祝時從 48 移動到 32）
    if(rowImages[currentRow] && rowImages[currentRow].complete && rowImages[currentRow].naturalWidth > 0){
      ctx.drawImage(
        rowImages[currentRow],
        dragonFrame * PITCH, 0,
        16, 16,
        lifeDragonX, 0,
        16, 16
      );
    }

    // 慶祝時 happy icons（固定位置 x=24, x=48，與攻擊訓練相同）
    if(trainingCelebrationActive && happyImage.complete && happyImage.naturalWidth > 0
       && TRAINING_CELEBRATION_SEQ[trainingCelebrationStep] === 7){
      ctx.drawImage(happyImage, 24, 0, 8, 8);
      ctx.drawImage(happyImage, 24, 8, 8, 8);
      ctx.drawImage(happyImage, 48, 0, 8, 8);
      ctx.drawImage(happyImage, 48, 8, 8, 8);
    }
    // 失敗時 sad icons（固定位置 x=24, x=48，與攻擊訓練相同）
    if(trainingFailureActive && sadImage.complete && sadImage.naturalWidth > 0
       && TRAINING_FAILURE_SEQ[trainingFailureStep] === 10){
      ctx.drawImage(sadImage, 24, 0, 8, 8);
      ctx.drawImage(sadImage, 24, 8, 8, 8);
      ctx.drawImage(sadImage, 48, 0, 8, 8);
      ctx.drawImage(sadImage, 48, 8, 8, 8);
    }
    return;
  }

  // 爆擊訓練：顯示 牆 + bar + 龍
  if(trainingType === "critical"){
    // 牆在最左 x=0（破壞後顯示 Wall broken）
    const wImg = criticalWallBroken ? wallBrokenImage : wallImage;
    if(wImg.complete && wImg.naturalWidth > 0){
      ctx.drawImage(wImg, 0, 0, 16, 16);
    }

    // Critical Hit Bar 放在最右 x=48，根據 criticalPos 顯示對應的 cell
    // 慶祝（happy）或失敗（sad）時隱藏
    if(!trainingCelebrationActive && !trainingFailureActive && criticalBarImage.complete && criticalBarImage.naturalWidth > 0){
      ctx.drawImage(criticalBarImage, criticalPos * 16, 0, 16, 16, 48, 0, 16, 16);
    }

    // 成功動畫：雙火球 → BOOM → 牆變 broken
    if(trainingAttackActive){
      if(criticalAttackStep > 0){
        // 火球移動中（從 x=16 一格一格向左到 x=0）
        const fireImg = (currentRow < 14) ? attackRowImages[currentRow] : attackRowImages[0];
        if(fireImg && fireImg.complete){
          ctx.drawImage(fireImg, 0, 0, 16, 8, criticalAttackStep, 0, 16, 8);
          ctx.drawImage(fireImg, 0, 0, 16, 8, criticalAttackStep, 8, 16, 8);
        }
      } else {
        // 火球到達牆壁，BOOM 動畫覆蓋牆位置
        const bImg = boomFrame === 0 ? boomImage : boomImage2;
        if(bImg.complete && bImg.naturalWidth > 0){
          ctx.drawImage(bImg, 0, 0, 16, 16);
        }
      }
      // 龍在 x=32 攻擊
      if(rowImages[currentRow] && rowImages[currentRow].complete && rowImages[currentRow].naturalWidth > 0){
        ctx.drawImage(rowImages[currentRow], 11 * PITCH, 0, 16, 16, 32, 0, 16, 16);
      }
    } else {
      // 龍在 x=32
      if(rowImages[currentRow] && rowImages[currentRow].complete && rowImages[currentRow].naturalWidth > 0){
        ctx.drawImage(rowImages[currentRow], dragonFrame * PITCH, 0, 16, 16, 32, 0, 16, 16);
      }
    }

    // 慶祝 happy icons
    if(trainingCelebrationActive && happyImage.complete && happyImage.naturalWidth > 0
       && TRAINING_CELEBRATION_SEQ[trainingCelebrationStep] === 7){
      ctx.drawImage(happyImage, 24, 0, 8, 8);
      ctx.drawImage(happyImage, 24, 8, 8, 8);
      ctx.drawImage(happyImage, 48, 0, 8, 8);
      ctx.drawImage(happyImage, 48, 8, 8, 8);
    }
    // 失敗 sad icons
    if(trainingFailureActive && sadImage.complete && sadImage.naturalWidth > 0
       && TRAINING_FAILURE_SEQ[trainingFailureStep] === 10){
      ctx.drawImage(sadImage, 24, 0, 8, 8);
      ctx.drawImage(sadImage, 24, 8, 8, 8);
      ctx.drawImage(sadImage, 48, 0, 8, 8);
      ctx.drawImage(sadImage, 48, 8, 8, 8);
    }
    return;
  }

  // 閃避訓練：飛彈從左方飛來，龍在 x=48，x=40 有 instruct 3幀循環
  if(trainingType === "evade"){
    // instruct 在 x=40，三幀循環（成功/失敗後隱藏）
    if(instructImage.complete && instructImage.naturalWidth > 0
       && !trainingCelebrationActive && !trainingFailureActive){
      ctx.drawImage(instructImage, evadeInstructFrame * 8, 0, 8, 16, 40, 0, 8, 16);
    }

    // 飛彈（從畫外飛入，missile.png 16×16）
    if(evadeMissileImage.complete && evadeMissileImage.naturalWidth > 0 && evadePhase !== "done"){
      ctx.drawImage(evadeMissileImage, 0, 0, 16, 16, evadeProjX, 0, 16, 16);
    }

    // 龍：遊戲時間在 x=48，成功/失敗後移到 x=32
    const isCelebrating = trainingCelebrationActive || trainingFailureActive;
    const dragonX = isCelebrating ? 32 : 48;
    if(rowImages[currentRow] && rowImages[currentRow].complete && rowImages[currentRow].naturalWidth > 0){
      if(evadeDragonFlipped){
        ctx.save();
        ctx.scale(-1, 1);
        ctx.drawImage(rowImages[currentRow], dragonFrame * PITCH, 0, 16, 16, -(dragonX + 16), 0, 16, 16);
        ctx.restore();
      } else {
        ctx.drawImage(rowImages[currentRow], dragonFrame * PITCH, 0, 16, 16, dragonX, 0, 16, 16);
      }
    }

    // 成功飛彈穿過後消失位置再畫一次（確保飛彈超出左邊界時不再繪製）
    if(attackProjImage.complete && attackProjImage.naturalWidth > 0 && evadeSucceeded && evadePhase === "done"){
      // 飛彈已消失
    }

    // 慶祝 happy icons
    if(trainingCelebrationActive && happyImage.complete && happyImage.naturalWidth > 0
       && TRAINING_CELEBRATION_SEQ[trainingCelebrationStep] === 7){
      ctx.drawImage(happyImage, 24, 0, 8, 8);
      ctx.drawImage(happyImage, 24, 8, 8, 8);
      ctx.drawImage(happyImage, 48, 0, 8, 8);
      ctx.drawImage(happyImage, 48, 8, 8, 8);
    }

    // 失敗 sad icons
    if(trainingFailureActive && sadImage.complete && sadImage.naturalWidth > 0
       && TRAINING_FAILURE_SEQ[trainingFailureStep] === 10){
      ctx.drawImage(sadImage, 24, 0, 8, 8);
      ctx.drawImage(sadImage, 24, 8, 8, 8);
      ctx.drawImage(sadImage, 48, 0, 8, 8);
      ctx.drawImage(sadImage, 48, 8, 8, 8);
    }
    return;
  }

  // 攻速訓練：序列 AB 配對，龍在右邊面向左
  if(trainingType === "speed"){
    // 龍位置：遊戲中在 x=48，動畫中在 speedDragonX
    const dragonPosX = (!speedActive)
      ? speedDragonX : 48;
    const faceRight = (speedMovePhase === "returning" || speedMovePhase === "done");
    if(rowImages[currentRow] && rowImages[currentRow].complete && rowImages[currentRow].naturalWidth > 0){
      if(faceRight){
        ctx.save();
        ctx.scale(-1, 1);
        ctx.drawImage(rowImages[currentRow], dragonFrame * PITCH, 0, 16, 16, -(dragonPosX + 16), 0, 16, 16);
        ctx.restore();
      } else {
        ctx.drawImage(rowImages[currentRow], dragonFrame * PITCH, 0, 16, 16, dragonPosX, 0, 16, 16);
      }
    }
    // 使用 AB.png 精靈繪製序列：箭頭 + 6 個 A/B
    if(speedSequence.length > 0 && (speedActive || speedCorrectFlashAt >= 0) && abGuideImage.complete && abGuideImage.naturalWidth > 0){
      // 箭頭
      ctx.font = "6px monospace";
      ctx.textAlign = "left";
      ctx.fillStyle = "#aaa";
      ctx.fillText("→", 0, 10);
      // 繪製每個字母（AB.png 下半部：A=sx:0,sy:8, B=sx:8,sy:8）
      const lxStart = 5;
      const lSpacing = 7;
      for(let i = 0; i < speedSequence.length; i++){
        const lx = lxStart + i * lSpacing;
        const isCurrent = (i === speedCurrentIndex);
        const isDone = (i < speedCurrentIndex);
        const isFlash = (i === speedCorrectFlashAt);
        const letter = speedSequence[i];
        const sx = (letter === "A") ? 0 : 8;
        // 字母精靈 6×6
        ctx.drawImage(abGuideImage, sx, 8, 8, 8, lx, 8, 6, 6);
        // 已完成：上方繪製「正確」指示器
        if(isDone && abGuideImage.complete){
          ctx.drawImage(abGuideImage, 0, 0, 8, 8, lx, 0, 6, 6);
        }
        // 當前字母：黃色底線 + 箭頭
        if(isCurrent){
          ctx.fillStyle = "#ffcc00";
          ctx.fillRect(lx, 14, 6, 2);
          ctx.fillText("▲", lx + 1, 7);
        }
        // 剛按下正確：閃現「正確」
        if(isFlash && abGuideImage.complete){
          ctx.drawImage(abGuideImage, 0, 0, 8, 8, lx + 1, 0, 8, 8);
        }
      }
    }
    // 慶祝 (左右各一對)
    if(trainingCelebrationActive && happyImage.complete && happyImage.naturalWidth > 0
       && TRAINING_CELEBRATION_SEQ[trainingCelebrationStep] === 7){
      ctx.drawImage(happyImage, 24, 0, 8, 8);
      ctx.drawImage(happyImage, 24, 8, 8, 8);
      ctx.drawImage(happyImage, 48, 0, 8, 8);
      ctx.drawImage(happyImage, 48, 8, 8, 8);
    }
    // 失敗
    if(trainingFailureActive && sadImage.complete && sadImage.naturalWidth > 0
       && TRAINING_FAILURE_SEQ[trainingFailureStep] === 10){
      ctx.drawImage(sadImage, 24, 0, 8, 8);
      ctx.drawImage(sadImage, 24, 8, 8, 8);
      ctx.drawImage(sadImage, 48, 0, 8, 8);
      ctx.drawImage(sadImage, 48, 8, 8, 8);
    }
    return;
  }

  // 特殊進化訓練：龍在 x=32，右側顯示目標顏色
  if(trainingType === "evo"){
    // 決定龍的動畫幀（攻擊時交替動畫）
    let evoDrawFrame = dragonFrame;
    if(evoEvolvePhase === "attack"){
      evoDrawFrame = 11; // 張嘴攻擊幀
    } else if(evoEvolvePhase === "evolving" || evoEvolvePhase === "devolve"){
      evoDrawFrame = trainingIdleFrame; // 閒置態
    }
    // 進化成功後全程顯示牆（x=0）
    if(evoOldRow >= 0){
      if(evoEvolvePhase === "attack"){
        // 攻擊階段：子步3火球擊中後換破牆 + 爆炸
        const atkSub = evoEvolutionStep - EVO_EVOLVE_END;
        const wallHit = atkSub >= 3;
        const wall = wallHit ? wallBrokenImage : wallImage;
        if(wall.complete && wall.naturalWidth > 0){
          ctx.drawImage(wall, 0, 0, 16, 16);
        }
        // 火球從龍射向牆（單發，取上半 16×8）
        const fireImg = (currentRow < 14) ? attackRowImages[currentRow] : attackRowImages[0];
        if(fireImg && fireImg.complete && atkSub >= 0 && atkSub < 3){
          const missileX = 16 - 6 * atkSub; // 16→10→4
          ctx.drawImage(fireImg, 0, 0, 16, 8, missileX, 0, 16, 8);
        }
        // 擊中爆炸
        if(atkSub >= 3 && atkSub <= 5){
          const bImg = (atkSub % 2 === 0) ? boomImage : boomImage2;
          if(bImg.complete && bImg.naturalWidth > 0){
            ctx.drawImage(bImg, 0, 0, 16, 16);
          }
        }
      } else {
        // 進化/退化/開心階段：破牆
        const useBroken = evoEvolvePhase !== "evolving";
        const wall = useBroken ? wallBrokenImage : wallImage;
        if(wall.complete && wall.naturalWidth > 0){
          ctx.drawImage(wall, 0, 0, 16, 16);
        }
      }
    }
    // 先畫龍在 x=32（進化動畫播放時也不消失）
    if(rowImages[currentRow] && rowImages[currentRow].complete && rowImages[currentRow].naturalWidth > 0){
      ctx.drawImage(rowImages[currentRow], evoDrawFrame * PITCH, 0, 16, 16, 32, 0, 16, 16);
    }
    // 階段「evolving」或「devolve」：掃描遮罩從上往下一格一格移動再收回
    if((evoEvolvePhase === "evolving" || evoEvolvePhase === "devolve") && evolutionImage.complete && evolutionImage.naturalWidth > 0){
      // 計算子步數：evolving 從0開始；devolve 從 EVO_ATTACK_END 開始
      const sub = evoEvolvePhase === "evolving" ? evoEvolutionStep : (evoEvolutionStep - EVO_ATTACK_END);
      const s = Math.min(sub, 12); // 確保不超出 0-12 範圍
      let maskY;
      if(s < 4){ maskY = -16 + 4*s; }                    // 向下: 0→-16, 1→-12, 2→-8, 3→-4
      else if(s < 9){ maskY = 0; }                        // 停在封面: 4-8
      else { maskY = -4 - 4*(s-9); }                      // 向上: 9→-4, 10→-8, 11→-12, 12→-16
      ctx.drawImage(evolutionImage, 32, maskY, 16, 16);
    }
    // 右側顯示目標圖案（僅遊戲進行中），用圖片替代純色方塊
    if(evoPhase === "playing" && evoTarget >= 0 && evoTarget < EVO_TYPES){
      const iconImg = evoColorImages[evoTarget];
      if(iconImg && iconImg.complete && iconImg.naturalWidth > 0){
        ctx.drawImage(iconImg, 50, 3, 10, 10);
      }
    }
    // 開心階段：顯示 happy 圖標
    if(evoEvolvePhase === "happy" && happyImage.complete && happyImage.naturalWidth > 0
       && TRAINING_CELEBRATION_SEQ[trainingCelebrationStep % TRAINING_CELEBRATION_SEQ.length] === 7){
      ctx.drawImage(happyImage, 24, 0, 8, 8);
      ctx.drawImage(happyImage, 24, 8, 8, 8);
      ctx.drawImage(happyImage, 48, 0, 8, 8);
      ctx.drawImage(happyImage, 48, 8, 8, 8);
    }
    // 失敗圖標
    if(trainingFailureActive && sadImage.complete && sadImage.naturalWidth > 0
       && TRAINING_FAILURE_SEQ[trainingFailureStep] === 10){
      ctx.drawImage(sadImage, 24, 0, 8, 8);
      ctx.drawImage(sadImage, 24, 8, 8, 8);
      ctx.drawImage(sadImage, 48, 0, 8, 8);
      ctx.drawImage(sadImage, 48, 8, 8, 8);
    }
    return;
  }

  // 攻擊訓練：原來的布局
  // 1) 最左側訓練靶子 (x=0)，依狀態顯示不同圖
  if(sandbagState === "hit"){
    // 被打中後：顯示 Sandbag03
    if(sandbagImage3.complete && sandbagImage3.naturalWidth > 0){
      ctx.drawImage(sandbagImage3, 0, 0, 16, 16);
    }
  } else if(sandbagState === "boom"){
    // 爆炸動畫：顯示 Boom01/Boom02
    const bImg = boomFrame === 0 ? boomImage : boomImage2;
    if(bImg.complete && bImg.naturalWidth > 0){
      ctx.drawImage(bImg, 0, 0, 16, 16);
    }
  } else {
    // 正常狀態：靜止顯示 Sandbag01
    if(sandbagImage.complete && sandbagImage.naturalWidth > 0){
      ctx.drawImage(sandbagImage, 0, 0, 16, 16);
    }
  }
  
  // 2) 龍在中間（x=32）
  if(rowImages[currentRow] && rowImages[currentRow].complete && rowImages[currentRow].naturalWidth > 0){
    ctx.drawImage(
      rowImages[currentRow],
      dragonFrame * PITCH, 0,
      16, 16,
      32, 0,
      16, 16
    );
  }
  
  // 慶祝時只在 happy 幀顯示愛心
  if(trainingCelebrationActive && happyImage.complete && happyImage.naturalWidth > 0
     && TRAINING_CELEBRATION_SEQ[trainingCelebrationStep] === 7){
    ctx.drawImage(happyImage, 24, 0, 8, 8);
    ctx.drawImage(happyImage, 24, 8, 8, 8);
    ctx.drawImage(happyImage, 48, 0, 8, 8);
    ctx.drawImage(happyImage, 48, 8, 8, 8);
  }
  // 失敗時只在 sad 幀顯示難過圖
  if(trainingFailureActive && sadImage.complete && sadImage.naturalWidth > 0
     && TRAINING_FAILURE_SEQ[trainingFailureStep] === 10){
    ctx.drawImage(sadImage, 24, 0, 8, 8);
    ctx.drawImage(sadImage, 24, 8, 8, 8);
    ctx.drawImage(sadImage, 48, 0, 8, 8);
    ctx.drawImage(sadImage, 48, 8, 8, 8);
  }
  
  // Power 在龍右側（x=48），攻擊完成後隱藏
  if(!trainingPowerHidden){
    if(powerImage.complete && powerImage.naturalWidth > 0){
      const powerFrame = Math.min(trainingLevel, 5);
      ctx.drawImage(
        powerImage,
        powerFrame * 16, 0, 16, 16,
        48, 0,
        16, 16
      );
    } else {
      ctx.fillStyle = "#ff0";
      ctx.fillRect(49, 1, 14, 14);
    }
  }
  
  // 攻擊彈在龍左方，火球連續移動（單發，取上半 16×8）
  if(trainingAttackActive){
    const fireImg = (currentRow < 14) ? attackRowImages[currentRow] : attackRowImages[0];
    if(fireImg && fireImg.complete){
      ctx.drawImage(fireImg, 0, 0, 16, 8, trainingProjectileX, 0, 16, 8);
    }
  }
}

      gameAffinity,
      gameTrainingPoints,

function loadGameState(){
  try {

    if(!raw) return;

    const elapsed = Math.floor((Date.now() - data.timestamp) / 60000); // 經過分鐘

    currentRow = data.currentRow ?? 2;

    gameAffinity = Math.max(0, Math.min(100, DIGIMON_STATS[data.currentRow ?? 2].bondInitial));
  } catch(e){ /* 忽略讀檔錯誤 */ }
}

function clickFunction(idx){
  // 進食中不能點其他按鈕
  if(gameMode === "eating") return;
  // 對戰中點其他按鈕 → 逃跑
  if(battleActive && idx !== 3){
    endBattle("run");
    return;
  }
  // 訓練中點其他按鈕 → 退出訓練
  if(trainingMode && idx !== 2){
    stopTraining();
  }
  const btn = document.querySelector(`.func-btn[data-idx="${idx}"]`);
  if(!btn) return;
  btn.classList.add('active');
  setTimeout(() => btn.classList.remove('active'), 200);
  console.log(`功能: ${FUNCTION_BTNS[idx]}`);
  if(idx === 0) showStats();   // 狀態
  else if(idx === 1) showFood(); // 食物
  else if(idx === 2) startTraining(); // 訓練
  else if(idx === 3) startBattle(); // 對戰
  else if(idx === 7) showDigidex(); // 圖鑑
}

// 統一傷害計算（含閃避→暴擊→屬性→下限1）
function calcBattleDamage(attackerRow, defenderRow){
  const atkr = DIGIMON_STATS[attackerRow];
  const defr = DIGIMON_STATS[defenderRow];
  // 閃避優先判定
  if(Math.random() < defr.dodgeRate) return { dodged: true, dmg: 0, msg: defr.name + " 閃避了攻擊！" };
  // 基礎傷害
  let dmg = atkr.atk;
  let msgExtra = "";
  // 暴擊
  let isCrit = false;
  if(Math.random() < atkr.critRate){
    dmg = Math.round(dmg * CRIT_MULT);
    msgExtra = "爆擊！";
    isCrit = true;
  }
  // 屬性相剋
  const aType = atkr.attr || "none";
  const dType = defr.attr || "none";
  const attrMult = (ATTR_TYPE_MULT[aType] && ATTR_TYPE_MULT[aType][dType]) || 1.0;
  if(attrMult > 1.0) msgExtra += " 屬性剋制！";
  else if(attrMult < 1.0) msgExtra += " 屬性劣勢…";
  dmg = Math.round(dmg * attrMult);
  dmg = Math.max(1, dmg); // 下限1
  const attrAdv = attrMult > 1.0;
  const attrDis = attrMult < 1.0;
  const msg = msgExtra ? (msgExtra + " " + dmg + " 傷害！") : (dmg + " 傷害！");
  return { dodged: false, dmg, msg, crit: isCrit, attrAdv: attrAdv, attrDis: attrDis };
}

// 逆境進化判定：血量<40%且尚未用完次數，且必須有下一階段可進化
function tryAdversityEvo(){
  if(battleAdversityTries >= ADVERSITY_EVO_MAX_TRIES) return false;
  const hpPct = battlePlayerHp / battlePlayerMaxHp;
  if(hpPct <= 0 || hpPct >= 0.4) return false;
  // 檢查是否有下一階段可進化（完全體為最高階段，不可再進化）
  const curStage = DIGIMON_STATS[currentRow].stage;
  const stageOrder = ["幼年期","幼年期Ⅱ","成長期","成熟期","完全體"];
  const curIdx = stageOrder.indexOf(curStage);
  if(curIdx < 0 || curIdx >= stageOrder.length - 1) return false;
  const prob = 0.0542 + (gameAffinity / 100) * (0.1060 - 0.0542);
  return Math.random() < prob;
}

// 逆境進化執行：動畫 → 進化 → 攻擊
function doAdversityEvo(nextAttacker, onDone){
  battleAdversityTries++;
  const curStage = DIGIMON_STATS[currentRow].stage;

  // 確定下一階段
  const stageOrder = ["幼年期","幼年期Ⅱ","成長期","成熟期","完全體"];
  const curIdx = stageOrder.indexOf(curStage);
  if(curIdx < 0 || curIdx >= stageOrder.length - 1) return;

  const nextStage = stageOrder[curIdx + 1];

  // 找到所有下一階段的數碼獸
  const candidates = [];
  for(let i = 0; i < TOTAL_DIGIMON; i++){
    if(DIGIMON_STATS[i].stage === nextStage){
      candidates.push(i);
    }
  }
  if(candidates.length === 0) return;

  battleEvoNextRow = candidates[Math.floor(Math.random() * candidates.length)];
  if(battleAdversityEvoRow < 0) battleAdversityEvoRow = battleEvoNextRow;

  // 開始動畫序列：exclaim(0.5秒) → evoDown → 進化 → evoUp → 攻擊
  battleEvoState = "exclaim";
  battleEvoStep = 0;
  battleEvoCallback = () => { executeAttack(nextAttacker, onDone); };
  document.getElementById("adversityEvoBanner").style.display = "none";
  document.getElementById("battleMsg").textContent = "逆境進化！";
  renderBattleScene();

  // Phase 1: 顯示 ! 0.5 秒
  setTimeout(() => {
    if(!battleActive) return;
    battleEvoState = "evoDown";
    battleEvoStep = 0;
    runEvoAnim();
  }, 500);
}

function runEvoAnim(){
  if(!battleActive) return;
  const interval = setInterval(() => {
    if(!battleActive || battleEvoState === "none"){ clearInterval(interval); return; }

    if(battleEvoState === "evoDown"){
      battleEvoStep++;
      renderBattleScene();
      if(battleEvoStep >= 16){
        // 進化！
        currentRow = battleEvoNextRow;
        gameAffinity = DIGIMON_STATS[battleEvoNextRow].bondInitial;
        const s = DIGIMON_STATS[battleEvoNextRow];
        battlePlayerMaxHp = s.hp;
        battlePlayerHp = s.hp;
        updateBattleHpDisplay();
        const advAttrColor = getAttrColor(s.attr, DIGIMON_STATS[battleEnemyRow].attr);
        document.getElementById("battlePlayerName").innerHTML = s.name + '(<span style="color:' + advAttrColor + '">' + (ATTR_CN[s.attr] || s.attr || "—") + '</span>) ⚡';
        document.getElementById("adversityEvoBanner").style.display = "block";
        document.getElementById("battleMsg").textContent = s.name + " 逆境進化！！";
        clearInterval(interval);
        // Phase 3: evoUp
        setTimeout(() => {
          if(!battleActive) return;
          battleEvoState = "evoUp";
          battleEvoStep = 16;
          runEvoAnimUp();
        }, 500);
      }
    }
  }, 50);
}

function runEvoAnimUp(){
  if(!battleActive) return;
  const interval = setInterval(() => {
    if(!battleActive || battleEvoState !== "evoUp"){ clearInterval(interval); return; }
    battleEvoStep--;
    renderBattleScene();
    if(battleEvoStep <= 0){
      battleEvoState = "none";
      battleEvoStep = 0;
      clearInterval(interval);
      renderBattleScene();
      if(battleEvoCallback){ const cb = battleEvoCallback; battleEvoCallback = null; cb(); }
    }
  }, 50);
}

// ========== 敵方逆境進化 ==========
function doEnemyAdversityEvo(nextAttacker, onDone){
  battleEnemyAdversityTries++;
  const curStage = DIGIMON_STATS[battleEnemyRow].stage;

  const stageOrder = ["幼年期","幼年期Ⅱ","成長期","成熟期","完全體"];
  const curIdx = stageOrder.indexOf(curStage);
  if(curIdx < 0 || curIdx >= stageOrder.length - 1) return;

  const nextStage = stageOrder[curIdx + 1];
  const candidates = [];
  for(let i = 0; i < TOTAL_DIGIMON; i++){
    if(DIGIMON_STATS[i].stage === nextStage){
      candidates.push(i);
    }
  }
  if(candidates.length === 0) return;

  battleEnemyEvoNextRow = candidates[Math.floor(Math.random() * candidates.length)];
  if(battleEnemyAdversityEvoRow < 0) battleEnemyAdversityEvoRow = battleEnemyEvoNextRow;

  battleEnemyEvoState = "exclaim";
  battleEnemyEvoStep = 0;
