function runEnemyEvoAnim(){
  if(!battleActive) return;
  const interval = setInterval(() => {
    if(!battleActive || battleEnemyEvoState === "none"){ clearInterval(interval); return; }

    if(battleEnemyEvoState === "evoDown"){
      battleEnemyEvoStep++;
      renderBattleScene();
      if(battleEnemyEvoStep >= 16){
        // 敵方進化！
        const oldRow = battleEnemyRow;
        battleEnemyRow = battleEnemyEvoNextRow;
        const s = DIGIMON_STATS[battleEnemyEvoNextRow];
        battleEnemyMaxHp = s.hp;
        battleEnemyHp = s.hp;
        updateBattleHpDisplay();
        const eAttrColor = getAttrColor(s.attr, DIGIMON_STATS[currentRow].attr);
        document.getElementById("battleEnemyName").innerHTML = s.name + '(<span style="color:' + eAttrColor + '">' + (ATTR_CN[s.attr] || s.attr || "—") + '</span>)';
        document.getElementById("battleMsg").textContent = s.name + " 敵方逆境進化！！";
        clearInterval(interval);
        setTimeout(() => {
          if(!battleActive) return;
          battleEnemyEvoState = "evoUp";
          battleEnemyEvoStep = 16;
          runEnemyEvoAnimUp();
        }, 500);
      }
    }
  }, 50);
}

function runEnemyEvoAnimUp(){
  if(!battleActive) return;
  const interval = setInterval(() => {
    if(!battleActive || battleEnemyEvoState !== "evoUp"){ clearInterval(interval); return; }
    battleEnemyEvoStep--;
    renderBattleScene();
    if(battleEnemyEvoStep <= 0){
      battleEnemyEvoState = "none";
      battleEnemyEvoStep = 0;
      clearInterval(interval);
      renderBattleScene();
      if(battleEnemyEvoCallback){ const cb = battleEnemyEvoCallback; battleEnemyEvoCallback = null; cb(); }
    }
  }, 50);
}

// 單次攻擊執行動畫
function executeAttack(who, onDone){
  if(!battleActive || battleResult) return;
  battleTurn = "";

  // 玩家攻擊前逆境進化判定
  if(who === "player" && battleAdversityTries < ADVERSITY_EVO_MAX_TRIES){
    if(tryAdversityEvo()){
      doAdversityEvo(who, onDone);
      return;
    }
  }

  // 敵方攻擊前逆境進化判定
  if(who === "enemy" && battleEnemyAdversityTries < ADVERSITY_EVO_MAX_TRIES){
    const eHpPct = battleEnemyHp / battleEnemyMaxHp;
    if(eHpPct > 0 && eHpPct < 0.4 && Math.random() < 0.0542){
      // 檢查敵方是否有下一階段可進化（完全體不可再進化）
      const eStage = DIGIMON_STATS[battleEnemyRow].stage;
      const eStageIdx = ["幼年期","幼年期Ⅱ","成長期","成熟期","完全體"].indexOf(eStage);
      if(eStageIdx >= 0 && eStageIdx < 4){
        doEnemyAdversityEvo(who, onDone);
        return;
      }
    }
  }

  const atkrRow = who === "player" ? currentRow : battleEnemyRow;
  const defrRow = who === "player" ? battleEnemyRow : currentRow;
  const atkrName = DIGIMON_STATS[atkrRow].name;

  const { dodged, dmg, msg, crit, attrAdv, attrDis } = calcBattleDamage(atkrRow, defrRow);
  battleIsCrit = crit;

  if(dodged){
    // 顯示攻擊幀 & 發射火球
    battleMsg = atkrName + " 攻擊！";
    document.getElementById("battleMsg").textContent = battleMsg;
    if(who === "player"){
      battlePlayerFrame = 11;
      battleProjectileX = 44;
      battleProjectileDir = 1;
    } else {
      battleEnemyFrame = 11;
      battleProjectileX = 8;
      battleProjectileDir = 0;
    }
    battleProjectileActive = true;
    renderBattleScene();

    // 火球飛向目標，穿越後目標龍原地轉身
    const dodgeDx = who === "player" ? -4 : 4;
    const dodgeTriggerX = who === "player" ? 14 : 42;  // 到達龍的位置觸發轉身
    const dodgeExitX = who === "player" ? -8 : 56;      // 飛出屏幕邊界
    let dodgedTriggered = false;
    const dodgeAnimTimer = setInterval(() => {
      if(!battleActive && !battleResult){ clearInterval(dodgeAnimTimer); return; }
      battleProjectileX += dodgeDx;
      if(who === "player") battlePlayerFrame = 11;
      else battleEnemyFrame = 11;

      // 火球到達龍的位置 → 龍原地轉身，火球繼續飛
      if(!dodgedTriggered && Math.abs(battleProjectileX - dodgeTriggerX) <= 4){
        dodgedTriggered = true;
        if(who === "player") battleEnemyDodge = true;
        else battlePlayerDodge = true;
      }

      // 火球飛出屏幕 → 結束
      const exited = who === "player" ? (battleProjectileX <= dodgeExitX) : (battleProjectileX >= dodgeExitX);
      if(exited){
        clearInterval(dodgeAnimTimer);
        battleProjectileActive = false;
        battleProjectileX = 0;

        battleMsg = msg;
        document.getElementById("battleMsg").textContent = battleMsg;
        addBattleLog(DIGIMON_STATS[defrRow].name, "閃避了攻擊！", false, true, false);
        battlePlayerFrame = 0;
        battleEnemyFrame = 0;
        renderBattleScene();

        setTimeout(() => {
          battlePlayerDodge = false;
          battleEnemyDodge = false;
          renderBattleScene();
          setTimeout(onDone, 300);
        }, 700);
        return;
      }
      renderBattleScene();
    }, 80);
    return;
  }

  // 攻擊動畫
  battleMsg = atkrName + " 攻擊！";
  document.getElementById("battleMsg").textContent = battleMsg;
  if(who === "player"){
    battlePlayerFrame = 11;
    battleProjectileX = 48;  // 我方火球發射位置
    battleProjectileDir = 1;
  } else {
    battleEnemyFrame = 11;
    battleProjectileX = 8;   // 敵方火球發射位置
    battleProjectileDir = 0;
  }
  battleProjectileActive = true;

  const dx = who === "player" ? -4 : 4;
  const isEnemyAttack = who === "enemy";
  const animTimer = setInterval(() => {
    if(!battleActive && !battleResult){ clearInterval(animTimer); return; }
    battleProjectileX += dx;
    if(who === "player") battlePlayerFrame = 11;
    else battleEnemyFrame = 11;

    if((who === "player" && battleProjectileX <= 0) || (who === "enemy" && battleProjectileX >= 48)){
      clearInterval(animTimer);
      battleProjectileX = 0;
      battleProjectileActive = false;
      battlePlayerFrame = 0;
      battleEnemyFrame = 0;

      // 開始爆炸動畫
      battleBoomActive = true;
      // 玩家攻擊→打中敵方(x=0), 敵方攻擊→打中玩家(x=48)
      battleBoomX = (who === "player") ? 0 : 48;
      battleBoomFrame = 0;
      battleBoomCycles = 0;
      if(battleBoomTimer){ clearInterval(battleBoomTimer); }

      battleBoomTimer = setInterval(() => {
        if(!battleActive && !battleResult){ clearInterval(battleBoomTimer); battleBoomTimer = null; return; }
        battleBoomFrame = battleBoomFrame === 0 ? 1 : 0;
        if(battleBoomFrame === 0) battleBoomCycles++;
        if(battleBoomCycles >= 2){
          clearInterval(battleBoomTimer);
          battleBoomTimer = null;
          battleBoomActive = false;

          if(isEnemyAttack){
            battlePlayerHp = Math.max(0, battlePlayerHp - dmg);
          } else {
            battleEnemyHp = Math.max(0, battleEnemyHp - dmg);
          }
          updateBattleHpDisplay();

          battleMsg = msg;
          document.getElementById("battleMsg").textContent = battleMsg;
          let typeLabel = "";
          if(crit && attrAdv) typeLabel = "爆擊！屬性剋制！";
          else if(crit) typeLabel = "爆擊！";
          else if(attrAdv) typeLabel = "屬性剋制！";
          else if(attrDis) typeLabel = "屬性劣勢…";
          else typeLabel = "普通攻擊";
          addBattleLog(atkrName, `${typeLabel} → -${dmg} HP`, crit, false, attrAdv, attrDis);
          renderBattleScene();

          if(battlePlayerHp <= 0){
            endBattle("lose");
            return;
          }
          if(battleEnemyHp <= 0){
            endBattle("win");
            return;
          }

          setTimeout(onDone, 600);
          return;
        }
        renderBattleScene();
      }, 200);

      renderBattleScene();
      return;
    }
    renderBattleScene();
  }, 80);
}

// 全自動戰鬥主循環
function runBattleAuto(){
  if(!battleActive || battleResult) return;
  const who = battleOrder[battleTurnIdx % 2];
  executeAttack(who, () => {
    if(!battleActive || battleResult) return;
    battleTurnIdx++;
    runBattleAuto();
  });
}

function startBattle(){
  const panel = document.getElementById("battleDisplay");
  // 對戰進行中，再次點擊切換為關閉（逃跑）
  if(battleActive){
    endBattle("run");
    return;
  }
  // 幼年期不可對戰
  if(currentRow <= 1){
    alert("幼年期還不能戰鬥！");
    return;
  }
  // 關閉其他面板
  document.getElementById("statsDisplay").style.display = "none";
  document.getElementById("foodDisplay").style.display = "none";
  document.getElementById("digidexDisplay").style.display = "none";
  document.getElementById("trainingDisplay").style.display = "none";
  panel.style.display = "block";

  // 暫停自動模式
  if(autoTimer){ clearInterval(autoTimer); autoTimer = null; }
  if(autoMoveTimer){ clearInterval(autoMoveTimer); autoMoveTimer = null; }

  // 選擇敵方：僅限同階級（成長期vs成長期、成熟期vs成熟期…）
  const playerStage = DIGIMON_STATS[currentRow].stage;
  const sameStageIndices = [];
  for(let i = 0; i < TOTAL_DIGIMON; i++){
    if(DIGIMON_STATS[i].stage === playerStage && i !== currentRow){
      sameStageIndices.push(i);
    }
  }
  const enemyRow = sameStageIndices[Math.floor(Math.random() * sameStageIndices.length)];

  const ps = DIGIMON_STATS[currentRow];
  const es = DIGIMON_STATS[enemyRow];

  battleEnemyRow = enemyRow;
  battlePlayerMaxHp = ps.hp;
  battlePlayerHp = ps.hp;
  battleEnemyMaxHp = es.hp;
  battleEnemyHp = es.hp;

  // 清空對戰記錄
  battleLogEntries = [];
  document.getElementById("battleLog").innerHTML = "";
  updateBattleHpDisplay();
  battleAnimStep = 0;
  battleProjectileX = 0;
  battleProjectileDir = 0;
  battleProjectileActive = false;
  battleBoomActive = false;
  if(battleBoomTimer){ clearInterval(battleBoomTimer); battleBoomTimer = null; }
  battlePlayerFrame = 0;
  battleEnemyFrame = 0;
  battlePlayerDodge = false;
  battleEnemyDodge = false;
  battleResult = "";
  battleMsg = "";
  battleActive = true;
  // 重置逆境進化狀態
  battleOriginalRow = currentRow;
  battleAdversityEvoRow = -1;
  battleAdversityTries = 0;
  battleEvoState = "none";
  battleEvoStep = 0;
  battleEvoNextRow = -1;
  battleEvoCallback = null;
  // 重置敵方逆境進化狀態
  battleEnemyOriginalRow = battleEnemyRow;
  battleEnemyAdversityEvoRow = -1;
  battleEnemyAdversityTries = 0;
  battleEnemyEvoState = "none";
  battleEnemyEvoStep = 0;
  battleEnemyEvoNextRow = -1;
  battleEnemyEvoCallback = null;
  document.getElementById("adversityEvoBanner").style.display = "none";

  const pAttrColor = getAttrColor(ps.attr, es.attr);
  const eAttrColor = getAttrColor(es.attr, ps.attr);
  document.getElementById("battlePlayerName").innerHTML = ps.name + '(<span style="color:' + pAttrColor + '">' + (ATTR_CN[ps.attr] || ps.attr || "—") + '</span>)';
  document.getElementById("battleEnemyName").innerHTML = es.name + '(<span style="color:' + eAttrColor + '">' + (ATTR_CN[es.attr] || es.attr || "—") + '</span>)';
  document.getElementById("battleMsg").textContent = "點擊攻擊開始對戰！";
  document.getElementById("battleAttackBtn").disabled = false;
  document.getElementById("battleRunBtn").disabled = true;

  // 調整 canvas 為 64×24
  trainingMode = false;  // 確保退出訓練模式
  canvas.width = CANVAS_BATTLE_W;
  canvas.height = CANVAS_BATTLE_H;
  canvas.style.width = (CANVAS_BATTLE_W * 6) + "px";
  canvas.style.height = (CANVAS_BATTLE_H * 6) + "px";
  gameMode = "battle";
  battlePlayerFrame = 0;
  battleEnemyFrame = 0;
  renderBattleScene();
}

function startBattleIntro(){
  battleIntro = true;
  battleIntroStep = 0;
  battlePlayerFrame = 0;
  battleEnemyFrame = 0;
  renderBattleScene();

  battleIntroTimer = setInterval(() => {
    if(!battleActive && !battleResult){ clearInterval(battleIntroTimer); battleIntroTimer = null; return; }
    battleIntroStep++;
    if(battleIntroStep >= 7){
      // 3 次 idle+attack 完成，回到 idle 再開始
      clearInterval(battleIntroTimer);
      battleIntroTimer = null;
      battleIntro = false;
      battlePlayerFrame = 0;
      battleEnemyFrame = 0;
      renderBattleScene();
      setTimeout(() => beginBattle(), 400);
      return;
    }
    if(battleIntroStep % 2 === 1){
      // 攻擊幀（奇數步：1, 3, 5）
      battlePlayerFrame = 11;
      battleEnemyFrame = 11;
    } else {
      // 待機幀（偶數步：2, 4, 6）
      battlePlayerFrame = 0;
      battleEnemyFrame = 0;
    }
    renderBattleScene();
  }, 500);
}

function beginBattle(){
  const ps = DIGIMON_STATS[currentRow];
  const es = DIGIMON_STATS[battleEnemyRow];

  // 清空對戰記錄
  battleLogEntries = [];
  document.getElementById("battleLog").innerHTML = "";

  // 速度決定先後手（相同速度時隨機）
  const playerSpd = ps.speed || 10;
  const enemySpd = es.speed || 10;
  if(playerSpd > enemySpd) battleOrder = ["player", "enemy"];
  else if(enemySpd > playerSpd) battleOrder = ["enemy", "player"];
  else battleOrder = Math.random() < 0.5 ? ["player", "enemy"] : ["enemy", "player"];
  battleTurnIdx = 0;
  battleTurn = battleOrder[0];

  renderBattleScene();
  setTimeout(() => runBattleAuto(), 300);
}

function renderBattleScene(){
  const ctx2 = canvas.getContext('2d');
  ctx2.imageSmoothingEnabled = false;
  ctx2.clearRect(0, 0, CANVAS_BATTLE_W, CANVAS_BATTLE_H);

  // === 上方 64×8 血條區 ===
  // 血條底框
  if(hpBarBottomImage.complete && hpBarBottomImage.naturalWidth > 0){
    ctx2.drawImage(hpBarBottomImage, 0, 0, 64, 8);
  } else {
    ctx2.fillStyle = "#333";
    ctx2.fillRect(0, 0, 64, 8);
  }



  // 血量條區間：敵左(0-29) | 間隙(30-33) | 我方右(34-63)
  // 「外減到內」：敵方從左端縮向中間，我方從右端縮向中間
  const BAR_MAX = 30;

  // 敵方血量（左側，靠中間對齊，填充向左延伸）
  const enemyHpRatio = Math.max(0, battleEnemyHp / battleEnemyMaxHp);
  const enemyHpW = Math.floor(BAR_MAX * enemyHpRatio);
  if(enemyHpW > 0){
    ctx2.fillStyle = enemyHpRatio <= 0.4 ? "#eddd31" : "#36c73d";
    ctx2.fillRect(BAR_MAX - enemyHpW, 1, enemyHpW, 6);
  }

  // 我方血量（右側，靠中間對齊，填充向右延伸）
  const playerHpRatio = Math.max(0, battlePlayerHp / battlePlayerMaxHp);
  const playerHpW = Math.floor(BAR_MAX * playerHpRatio);
  if(playerHpW > 0){
    ctx2.fillStyle = playerHpRatio <= 0.4 ? "#eddd31" : "#36c73d";
    ctx2.fillRect(34, 1, playerHpW, 6);
  }

  // === 下方 64×16 對戰區 ===
  // 對戰背景
  if(battleBgImage.complete && battleBgImage.naturalWidth > 0){
    ctx2.drawImage(battleBgImage, 0, 8, 64, 16);
  } else {
    ctx2.fillStyle = "#1a1a2e";
    ctx2.fillRect(0, 8, 64, 16);
  }

  // 敵方龍（左側 x=0, y=8，面向左；閃避時轉身朝右）
  if(rowImages[battleEnemyRow] && rowImages[battleEnemyRow].complete && rowImages[battleEnemyRow].naturalWidth > 0){
    const frame = (battleEnemyFrame >= 0) ? battleEnemyFrame * PITCH : 0;
    ctx2.save();
    ctx2.translate(16, 8);
    if(battleEnemyDodge){
      // 閃避：正面繪製（朝右，背對玩家），位置 x=0~16
      ctx2.drawImage(rowImages[battleEnemyRow], frame, 0, 16, 16, -16, 0, 16, 16);
    } else {
      ctx2.scale(-1, 1);
      ctx2.drawImage(rowImages[battleEnemyRow], frame, 0, 16, 16, 0, 0, 16, 16);
    }
    ctx2.restore();
  }

  // 玩家龍（右側 x=49，面向左；閃避時轉身朝右）
  if(rowImages[currentRow] && rowImages[currentRow].complete && rowImages[currentRow].naturalWidth > 0){
    const frame = (battlePlayerFrame >= 0) ? battlePlayerFrame * PITCH : 0;
    if(battlePlayerDodge){
      // 閃避：翻轉朝右，背對敵方
      ctx2.save();
      ctx2.translate(65, 8);
      ctx2.scale(-1, 1);
      ctx2.drawImage(rowImages[currentRow], frame, 0, 16, 16, 0, 0, 16, 16);
      ctx2.restore();
    } else {
      ctx2.drawImage(rowImages[currentRow], frame, 0, 16, 16, 49, 8, 16, 16);
    }
  }

  // === 逆境進化特效 ===
  if(battleEvoState === "exclaim"){
    // 顯示 ! 圖標在我方龍左上角
    if(battleEvoExclaimImg.complete && battleEvoExclaimImg.naturalWidth > 0){
      ctx2.drawImage(battleEvoExclaimImg, 40, 8, 16, 8);
    }
  } else if(battleEvoState === "evoDown"){
    // evolution.png 從上到下一格一格覆蓋
    if(battleEvoEffectImg.complete && battleEvoEffectImg.naturalWidth > 0){
      // 使用 source clip 只繪製從 0 到 battleEvoStep 的像素行
      ctx2.drawImage(battleEvoEffectImg, 0, 0, 16, battleEvoStep, 49, 8, 16, battleEvoStep);
    }
  } else if(battleEvoState === "evoUp"){
    // evolution.png 從下到上一格一格消失（繪製剩餘部分）
    if(battleEvoEffectImg.complete && battleEvoEffectImg.naturalWidth > 0){
      ctx2.drawImage(battleEvoEffectImg, 0, 0, 16, battleEvoStep, 49, 8, 16, battleEvoStep);
    }
  }

  // === 敵方逆境進化特效 ===
  if(battleEnemyEvoState === "exclaim"){
    // 顯示 ! 圖標在敵方龍右上角
    if(battleEvoExclaimImg.complete && battleEvoExclaimImg.naturalWidth > 0){
      ctx2.drawImage(battleEvoExclaimImg, 16, 8, 16, 8);
    }
  } else if(battleEnemyEvoState === "evoDown"){
    // evolution.png 從上到下一格一格覆蓋敵方龍
    if(battleEvoEffectImg.complete && battleEvoEffectImg.naturalWidth > 0){
      ctx2.drawImage(battleEvoEffectImg, 0, 0, 16, battleEnemyEvoStep, 0, 8, 16, battleEnemyEvoStep);
    }
  } else if(battleEnemyEvoState === "evoUp"){
    // evolution.png 從下到上一格一格消失
    if(battleEvoEffectImg.complete && battleEvoEffectImg.naturalWidth > 0){
      ctx2.drawImage(battleEvoEffectImg, 0, 0, 16, battleEnemyEvoStep, 0, 8, 16, battleEnemyEvoStep);
    }
  }

  // === Happy / Sad 效果 ===
  if(battleShowHappy && battleHappyImg.complete && battleHappyImg.naturalWidth > 0){
    ctx2.drawImage(battleHappyImg, 40, 8, 8, 8);
  }
  if(battleShowSad && battleSadImg.complete && battleSadImg.naturalWidth > 0){
    ctx2.drawImage(battleSadImg, 40, 8, 8, 8);
  }
  if(battleShowEnemySad && battleSadImg.complete && battleSadImg.naturalWidth > 0){
    ctx2.drawImage(battleSadImg, 16, 8, 8, 8);
  }
  if(battleShowEnemyHappy && battleHappyImg.complete && battleHappyImg.naturalWidth > 0){
    ctx2.drawImage(battleHappyImg, 16, 8, 8, 8);
  }

  // 攻擊彈（普攻單發上方，爆擊雙發上下）
  if(battleProjectileActive){
    const atkrRow = (battleProjectileDir === 1) ? currentRow : battleEnemyRow;
    let fireImg = (atkrRow < attackRowImages.length) ? attackRowImages[atkrRow] : null;
    if(!fireImg || !fireImg.complete) fireImg = attackRowImages[0];
    if(fireImg && fireImg.complete){
      if(battleProjectileDir === 0){
        // 敵方火球：翻轉朝右
        ctx2.save();
        ctx2.translate(battleProjectileX + 16, 9);
        ctx2.scale(-1, 1);
        ctx2.drawImage(fireImg, 0, 0, 16, 8, 0, 0, 16, 8);
        ctx2.restore();
        if(battleIsCrit){
          // 爆擊雙火球：下方
          ctx2.save();
          ctx2.translate(battleProjectileX + 16, 17);
          ctx2.scale(-1, 1);
          ctx2.drawImage(fireImg, 0, 0, 16, 8, 0, 0, 16, 8);
          ctx2.restore();
        }
      } else {
        // 我方火球：正常朝左（上方）
        ctx2.drawImage(fireImg, 0, 0, 16, 8, battleProjectileX, 9, 16, 8);
        if(battleIsCrit){
          // 爆擊雙火球：下方
          ctx2.drawImage(fireImg, 0, 0, 16, 8, battleProjectileX, 17, 16, 8);
        }
      }
    }
  }

  // 爆炸動畫（擊中時播放）
  if(battleBoomActive){
    const bImg = (battleBoomFrame === 0) ? boomImage : boomImage2;
    if(bImg.complete && bImg.naturalWidth > 0){
      ctx2.drawImage(bImg, battleBoomX, 8, 16, 16);
    }
  }
}

// 首次點擊攻擊→播放開場動畫，結束後啟動全自動戰鬥
function handleBattleAttack(){
  if(!battleActive || battleResult || battleIntro) return;
  document.getElementById("battleAttackBtn").disabled = true;
  document.getElementById("battleRunBtn").disabled = true;
  startBattleIntro();
}

function endBattle(result){
  battleResult = result;
  battleActive = false;
  if(battleAnimTimer){ clearInterval(battleAnimTimer); battleAnimTimer = null; }
  battleProjectileX = 0;
  battleProjectileActive = false;
  battleBoomActive = false;
  if(battleBoomTimer){ clearInterval(battleBoomTimer); battleBoomTimer = null; }
  battleIntro = false;
  if(battleIntroTimer){ clearInterval(battleIntroTimer); battleIntroTimer = null; }
  battlePlayerFrame = 0;
  battleEnemyFrame = 0;
  battlePlayerDodge = false;
  battleEnemyDodge = false;
  document.getElementById("adversityEvoBanner").style.display = "none";

  // 玩家有逆境進化 → 先播放玩家退化動畫
  if(battleAdversityEvoRow >= 0){
    runDevoAnim(result);
    return;
  }

  // 敵方有逆境進化 → 先播放敵方退化動畫
  if(battleEnemyAdversityEvoRow >= 0){
    runEnemyDevoAnim(result);
    return;
  }

  // 無逆境進化：直接顯示結果
  battleOriginalRow = -1;
  battleAdversityTries = 0;
  battleEvoState = "none";
  battleEvoStep = 0;
  battleEvoCallback = null;
  battleEnemyOriginalRow = -1;
  battleEnemyAdversityTries = 0;
  battleEnemyEvoState = "none";
  battleEnemyEvoStep = 0;
  battleEnemyEvoCallback = null;
  showBattleResult(result);
}

// 退化動畫：evolution.png 從上到下 → 退化 → 從下到上 → 結果
function runDevoAnim(result){
  battleActive = true; // 保持活躍以便渲染

  // Phase 1: evoDown - evolution.png 從上到下一格一格覆蓋我方龍
  battleEvoState = "evoDown";
  battleEvoStep = 0;
  document.getElementById("battleMsg").textContent = "恢復原形…";
  renderBattleScene();

  const downInterval = setInterval(() => {
    battleEvoStep++;
    renderBattleScene();
    if(battleEvoStep >= 16){
      clearInterval(downInterval);
      // 退化！
      currentRow = battleOriginalRow;
      gameAffinity = DIGIMON_STATS[battleOriginalRow].bondInitial;
      battleAdversityEvoRow = -1;
      battleOriginalRow = -1;
      battleAdversityTries = 0;
      battleEvoNextRow = -1;
      renderBattleScene();
      // Phase 2: evoUp - evolution.png 從下到上一格一格消失
      setTimeout(() => {
        battleEvoState = "evoUp";
        battleEvoStep = 16;
        const upInterval = setInterval(() => {
          battleEvoStep--;
          renderBattleScene();
          if(battleEvoStep <= 0){
            clearInterval(upInterval);
            battleEvoState = "none";
            battleEvoStep = 0;
            battleEvoCallback = null;
            // 敵方也有進化 → 繼續敵方退化
            if(battleEnemyAdversityEvoRow >= 0){
              runEnemyDevoAnim(result);
            } else {
              battleActive = false;
              renderBattleScene();
              showBattleResult(result);
            }
          }
        }, 50);
      }, 400);
    }
  }, 50);
}

// 敵方退化動畫：evolution.png 從上到下 → 退化 → 從下到上 → 結果
function runEnemyDevoAnim(result){
  battleActive = true; // 保持活躍以便渲染

  battleEnemyEvoState = "evoDown";
  battleEnemyEvoStep = 0;
  document.getElementById("battleMsg").textContent = "敵方恢復原形…";
  renderBattleScene();

  const downInterval = setInterval(() => {
    battleEnemyEvoStep++;
    renderBattleScene();
    if(battleEnemyEvoStep >= 16){
      clearInterval(downInterval);
      // 敵方退化！
      battleEnemyRow = battleEnemyOriginalRow;
      battleEnemyAdversityEvoRow = -1;
      battleEnemyOriginalRow = -1;
      battleEnemyAdversityTries = 0;
      battleEnemyEvoNextRow = -1;
      renderBattleScene();
      setTimeout(() => {
        battleEnemyEvoState = "evoUp";
        battleEnemyEvoStep = 16;
        const upInterval = setInterval(() => {
          battleEnemyEvoStep--;
          renderBattleScene();
          if(battleEnemyEvoStep <= 0){
            clearInterval(upInterval);
            battleEnemyEvoState = "none";
            battleEnemyEvoStep = 0;
            battleEnemyEvoCallback = null;
            // 重置所有進化狀態
            battleOriginalRow = -1;
            battleAdversityTries = 0;
            battleAdversityEvoRow = -1;
            battleEvoState = "none";
            battleEvoStep = 0;
            battleEvoCallback = null;
            battleActive = false;
            renderBattleScene();
            showBattleResult(result);
          }
        }, 50);
      }, 400);
    }
  }, 50);
}

// 顯示戰鬥結果 + 勝敗動畫 + 自動關閉
function showBattleResult(result){
  const panel = document.getElementById("battleDisplay");
  let msg = "";
  if(result === "win"){
    msg = "勝利！";
    gameTrainingPoints += 2;
  } else if(result === "lose"){
    msg = "戰敗…";
  } else {
    msg = "逃跑了";
  }
  document.getElementById("battleMsg").textContent = msg;
  document.getElementById("battleAttackBtn").disabled = true;
  document.getElementById("battleRunBtn").disabled = true;

  // 勝敗動畫：勝利方 idle→happy ×2，失敗方 idle→sad ×2
  let endStep = 0;
  const endAnimTimer = setInterval(() => {
    if(endStep >= 4){
      clearInterval(endAnimTimer);
      battleShowHappy = false;
      battleShowSad = false;
      battleShowEnemySad = false;
      battleShowEnemyHappy = false;
      renderBattleScene();
      return;
    }
    if(result === "win"){
      battlePlayerFrame = (endStep % 2 === 0) ? 7 : 0;  // 我方 happy 表情
      battleShowHappy = (endStep % 2 === 0);              // Happy.png 圖標
      battleEnemyFrame = (endStep % 2 === 0) ? 10 : 0;   // 敵方 sad 表情
      battleShowEnemySad = (endStep % 2 === 0);           // sad.png 敵方圖標
    } else if(result === "lose"){
      battlePlayerFrame = (endStep % 2 === 0) ? 10 : 0;   // 我方 sad 表情
      battleShowSad = (endStep % 2 === 0);                // sad.png 圖標
      battleEnemyFrame = (endStep % 2 === 0) ? 7 : 0;     // 敵方 happy 表情
      battleShowEnemyHappy = (endStep % 2 === 0);          // Happy.png 敵方圖標
    }
    renderBattleScene();
    endStep++;
  }, 500);

  // 2 秒後自動關閉
  setTimeout(() => {
    clearInterval(endAnimTimer);  // 防止 step 4 畫戰場畫面
    panel.style.display = "none";
    canvas.width = CANVAS_NORMAL_W;
    canvas.height = 16;
    canvas.style.width = "";
    canvas.style.height = "";
    gameMode = "auto";
    battleResult = "";
    battleEnemyRow = -1;
    startAutoPlay();
  }, 2000);
}

// ========== 圖鑑 ==========
function createMiniSprite(row, size){
  const c = document.createElement('canvas');
  c.width = 16; c.height = 16;
  const cx = c.getContext('2d');
  cx.imageSmoothingEnabled = false;
  cx.drawImage(rowImages[row], 0, 0, 16, 16, 0, 0, 16, 16);
  // 設 CSS 尺寸，保持畫素感
  c.style.width = size + 'px';
  c.style.height = size + 'px';
  return c;
}

function showDigidex(){
  const panel = document.getElementById("digidexDisplay");
  const statsPanel = document.getElementById("statsDisplay");
  const foodPanel = document.getElementById("foodDisplay");
  if(panel.style.display === "block"){ panel.style.display = "none"; return; }
  statsPanel.style.display = "none";
  foodPanel.style.display = "none";
  document.getElementById("trainingDisplay").style.display = "none";
  // 重置詳情視圖
  document.getElementById("digidexContent").style.display = "";
  document.getElementById("digidexDetail").style.display = "none";

  const container = document.getElementById("digidexContent");
  container.innerHTML = "";
  for(const stage of DIGIDEX_STAGES){
    const stageDiv = document.createElement('div');
    stageDiv.className = 'digidex-stage';

    const title = document.createElement('div');
    title.className = 'digidex-stage-title';
    title.textContent = stage.name;
    stageDiv.appendChild(title);

    const grid = document.createElement('div');
    grid.className = 'digidex-grid';

    for(const row of stage.rows){
      const entry = document.createElement('div');
      entry.className = 'digidex-entry';
      entry.style.cursor = 'pointer';
      const sprite = createMiniSprite(row, 48);
      entry.appendChild(sprite);
      const nameSpan = document.createElement('div');
      nameSpan.className = 'd-name';
      nameSpan.textContent = ALL_NAMES[row] || `row_${String(row).padStart(2,'0')}`;
      entry.appendChild(nameSpan);
      // 點擊打開詳情頁
      entry.addEventListener('click', (e) => {
        showDigidexDetail(row);
        e.stopPropagation();
      });
      // 僅供瀏覽，不切換數碼獸
      grid.appendChild(entry);
    }

    stageDiv.appendChild(grid);
    container.appendChild(stageDiv);
  }

  panel.style.display = "block";
}

function showDigidexDetail(row){
  const container = document.getElementById("digidexContent");
  const detailDiv = document.getElementById("digidexDetail");

  const name = ALL_NAMES[row] || `row_${String(row).padStart(2,'0')}`;
  
  // 隱藏列表，顯示詳情

  `;

function feedDigimon(food){
  // 關閉食物面板與圖鑑面板
  document.getElementById("foodDisplay").style.display = "none";
  document.getElementById("digidexDisplay").style.display = "none";
  if(gameMode !== "auto") return; // 動畫進行中不可操作

  if(food === "meat"){
    if(gameHunger >= 10){
      // 拒絕：搖晃動畫
      gameMode = "refusing";
      gameModeStep = 0;
      if(autoMoveTimer){ clearInterval(autoMoveTimer); autoMoveTimer = null; }
      restartAnimTimer(REFUSE_IV);
      return;
    }
    gameHunger = Math.min(10, gameHunger + 1);
    gameWeight = Math.max(1, gameWeight + 1);       // 吃東西增加體重
    // 進食：eat1/eat2 動畫，龍在右邊，食物從左到右
    gameMode = "eating";
    gameModeStep = 0;
    autoX = 14;
    autoTargetX = null;
    if(autoMoveTimer){ clearInterval(autoMoveTimer); autoMoveTimer = null; }
    restartAnimTimer(EAT_IV);
    saveGameState();
    renderFrame();
    console.log(`餵食: ${food}, 飽食度: ${gameHunger}`);
  }
}

document.getElementById("battleAttackBtn").onclick = handleBattleAttack;
document.getElementById("battleRunBtn").onclick = () => endBattle("run");
</script>
