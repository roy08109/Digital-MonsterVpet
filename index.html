<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DigiVpet">
<title>數碼暴龍一代</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="Logo-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="Logo-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="Logo-512.png">
<link rel="apple-touch-icon" sizes="192x192" href="Logo-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="Logo-512.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{
  background:#111;
  padding:16px;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}
.title{color:#fff;text-align:center;margin-bottom:16px;font-size:20px}

/* 頂部導航欄 */
.top-bar{
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  margin-bottom:16px;
}
.top-bar .title{
  margin-bottom:0;
  flex:1;
}
.settings-btn{
  position:absolute;
  right:0;
  top:50%;
  transform:translateY(-50%);
  width:36px;
  height:36px;
  background:#333;
  border:none;
  border-radius:50%;
  color:#fff;
  font-size:20px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:background 0.2s, transform 0.3s;
  line-height:1;
}
.settings-btn:hover{ background:#555; }
.settings-btn:active{ transform:translateY(-50%) scale(0.92); }
.call-btn{
  position:absolute;
  left:0;
  top:50%;
  transform:translateY(-50%);
  width:36px;
  height:36px;
  background:#333;
  border:none;
  border-radius:50%;
  color:#fff;
  font-size:20px;
  cursor:pointer;
  display:none; /* 預設隱藏，飢餓=0 時由 JS 顯示 */
  align-items:center;
  justify-content:center;
  transition:background 0.2s, transform 0.3s;
  line-height:1;
}
.call-btn img{ width:20px; height:20px; image-rendering:pixelated; }
.call-btn:hover{ background:#555; }
.call-btn:active{ transform:translateY(-50%) scale(0.92); }

/* 設定面板遮罩 */
.settings-overlay{
  display:none;
  position:fixed;
  top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,0.7);
  z-index:1000;
  justify-content:center;
  align-items:center;
}
.settings-overlay.open{ display:flex; }

.settings-panel{
  background:#1a1a2e;
  border:2px solid #c42222;
  border-radius:12px;
  padding:20px;
  width:90%;
  max-width:340px;
  color:#fff;
  animation:fadeInUp 0.25s ease;
}
@keyframes fadeInUp{
  from{ opacity:0; transform:translateY(20px); }
  to{ opacity:1; transform:translateY(0); }
}
.settings-panel h3{
  text-align:center;
  color:#ffcc00;
  font-size:18px;
  margin-bottom:16px;
  padding-bottom:10px;
  border-bottom:1px solid #333;
}
.settings-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 0;
  border-bottom:1px solid #2a2a3e;
}
.settings-row:last-child{ border-bottom:none; }
.settings-row .setting-label{
  font-size:14px;
  color:#ccc;
}
.settings-row .setting-desc{
  font-size:11px;
  color:#777;
  margin-top:2px;
}

/* 開關按鈕 */
.toggle-switch{
  position:relative;
  width:52px;
  height:28px;
  background:#444;
  border-radius:14px;
  cursor:pointer;
  transition:background 0.3s;
  flex-shrink:0;
}
.toggle-switch.on{ background:#c42222; }
.toggle-switch::after{
  content:'';
  position:absolute;
  top:3px;left:3px;
  width:22px;height:22px;
  background:#fff;
  border-radius:50%;
  transition:left 0.3s;
}
.toggle-switch.on::after{ left:27px; }

.settings-close{
  display:block;
  width:100%;
  margin-top:10px;
  padding:10px 0;
  background:#c42222;
  color:#fff;
  border:none;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
  font-weight:700;
  transition:background 0.2s;
}
.settings-close:hover{ background:#e03030; }

.settings-delete{
  display:block;
  width:100%;
  margin-top:16px;
  padding:10px 0;
  background:transparent;
  color:#ff5555;
  border:1px solid #ff5555;
  border-radius:8px;
  font-size:14px;
  cursor:pointer;
  transition:all 0.2s;
}
.settings-delete:hover{ background:#ff5555; color:#fff; }

/* Toast 提示 */
#toast{
  position:fixed;
  bottom:100px;left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,0.85);
  color:#fff;
  padding:10px 24px;
  border-radius:20px;
  font-size:14px;
  z-index:2000;
  pointer-events:none;
  opacity:0;
  transition:opacity 0.3s;
  white-space:nowrap;
}
#toast.show{ opacity:1; }

/* 主LCD螢幕 */
.main-screen{
  background-color:#000;
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  border:3px solid #666;
  width:192px;
  height:96px;
  image-rendering:pixelated;
  image-rendering:crisp-edges;
  cursor:pointer;
  display:block;
  margin:0 auto 16px;
  transition:background-image 0.3s ease;
}

/* 屏幕容器 & 關燈遮罩 */
.screen-container{
  position:relative;
  width:fit-content;
  margin:0 auto 16px;
}
.screen-container .main-screen{
  margin:0 auto 0;
}
.dark-overlay{
  position:absolute;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.7);
  pointer-events:none;
  display:none;
  z-index:10;
}
.dark-overlay.on{ display:block; }

/* 中間8個功能按鈕 */
.btn-panel{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:6px;
}
.func-btn{
  height:60px;
  background:#333;
  border:none;
  border-radius:8px;
  color:#fff;
  font-size:14px;
}
.func-btn.active{
  background:#c42222;
  color:#fff;
  font-weight:700;
}

/* 頁面最底部導航欄 */

/* 狀態面板（按鈕下方） */
.stats-display{
  display:none;
  background:#222;
  border:1px solid #c42222;
  border-radius:8px;
  padding:12px 16px;
  color:#fff;
  font-size:13px;
  width:100%;
  max-width:400px;
  margin:8px auto 0;
  box-sizing:border-box;
}
.stats-display .sd-title{
  text-align:center;
  font-size:16px;
  font-weight:700;
  color:#ffcc00;
  margin-bottom:8px;
  padding-bottom:6px;
  border-bottom:1px solid #444;
}
.stats-display .sd-row{
  display:flex;
  justify-content:space-between;
  padding:3px 0;
  border-bottom:1px solid #333;
}
.stats-display .sd-row span:first-child{ color:#aaa; }
.stats-display .sd-row span:last-child{ color:#fff; font-weight:600; }
.sd-col.bonus{ display:inline-block; min-width:66px; text-align:right; color:#ffcc00; font-weight:600; }
.sd-col.base{ display:inline-block; min-width:54px; text-align:right; font-weight:600; }
.sd-col.total{ display:inline-block; min-width:54px; text-align:right; font-weight:600; }
.sd-op{ font-weight:normal; }

/* 對戰面板 */
.battle-info{
  text-align:center;
  color:#ffcc00;
  font-size:13px;
  font-weight:700;
  margin-bottom:8px;
}
.battle-vs-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:4px 6px;
  border-radius:4px;
  background:rgba(0,0,0,0.3);
  margin-bottom:4px;
}
.battle-side{
  text-align:center;
  flex:1;
}
.battle-side.player .battle-side-name{
  color:#44ccff;
  font-size:12px;
  font-weight:700;
}
.battle-side.enemy .battle-side-name{
  color:#ff6644;
  font-size:12px;
  font-weight:700;
}
.battle-side .battle-side-hp{
  color:#36c73d;
  font-weight:700;
  font-size:11px;
}
.battle-side .battle-side-hp.low{ color:#eddd31; }
.battle-vs-text{
  color:#ffcc00;
  font-size:13px;
  font-weight:900;
  margin:0 6px;
}
.battle-msg{
  text-align:center;
  color:#f0f0f0;
  font-size:12px;
  min-height:18px;
  margin-bottom:6px;
}
.battle-log{
  max-height:120px;
  overflow-y:auto;
  padding:4px 8px;
  margin-bottom:6px;
  background:rgba(0,0,0,0.3);
  border-radius:6px;
  font-size:11px;
  color:#ccc;
  line-height:1.6;
  scrollbar-width:thin;
  scrollbar-color:#555 #222;
}
.battle-log .log-entry{
  padding:1px 0;
  border-bottom:1px solid rgba(255,255,255,0.06);
}
.battle-log .log-entry.crit{ color:#ff8844; }
.battle-log .log-entry.dodge{ color:#88aaff; }
.battle-log .log-entry.attr-adv{ color:#ffcc00; }
.battle-log .log-entry.attr-dis{ color:#8888cc; }
.battle-btns{
  display:flex;
  gap:8px;
  justify-content:center;
  margin-top:8px;
}
.battle-atk-btn{
  padding:10px 24px;
  background:#c42222;
  color:#fff;
  border:none;
  border-radius:6px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  flex:1;
  max-width:140px;
}
.battle-atk-btn:hover{ background:#e53030; }
.battle-atk-btn:active{ background:#a01a1a; }
.battle-atk-btn:disabled{
  background:#555;
  cursor:not-allowed;
}
.battle-run-btn{
  padding:10px 24px;
  background:#555;
  color:#fff;
  border:none;
  border-radius:6px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  flex:1;
  max-width:140px;
}
.battle-run-btn:hover{ background:#777; }
.battle-run-btn:active{ background:#333; }
.battle-run-btn:disabled{
  background:#333;
  cursor:not-allowed;
}
.adversity-evo-banner{
  display:none;
  text-align:center;
  color:#ff6600;
  font-size:13px;
  font-weight:700;
  margin:4px 0;
  animation:adversityFlash 0.5s ease-in-out infinite alternate;
}
@keyframes adversityFlash{
  from{opacity:0.3;}
  to{opacity:1;}
}

/* 食物面板選項 */
.food-item{
  padding:8px 12px;
  margin:4px 0;
  background:#333;
  border-radius:6px;
  cursor:pointer;
  font-size:15px;
  color:#fff;
  transition:background .15s;
}
.food-item:hover{ background:#555; }
.food-item:active{ background:#c42222; }

/* 訓練面板 */
.training-mode-selector{
  display:flex;
  flex-direction:column;
  gap:4px;
  margin-bottom:8px;
}
.training-mode-btn{
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex:1;
  padding:6px;
  background:#333;
  color:#fff;
  border:2px solid #888;
  border-radius:4px;
  font-size:12px;
  font-family:inherit;
  cursor:pointer;
  user-select:none;
}
.training-mode-btn.active{
  background:#333;
  border-color:#fff;
}
.training-mode-btn.disabled{
  opacity:0.35;
  pointer-events:none;
  cursor:not-allowed;
}
.training-mode-btn.disabled::after{
  content:" (不可用)";
  color:#999;
  font-size:10px;
}
.training-mode-btn .help-icon{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:18px;height:18px;
  background:#555;
  color:#ffcc00;
  border:1px solid #aaa;
  border-radius:50%;
  font-size:11px;
  font-weight:700;
  cursor:pointer;
  flex-shrink:0;
  line-height:1;
}
.training-click-btn{
  width:100%;
  max-width:360px;
  height:70px;
  background:#c42222;
  color:#fff;
  border:none;
  border-radius:10px;
  font-size:26px;
  font-weight:700;
  cursor:pointer;
  margin-top:8px;
}
.training-click-btn:active{ background:#ff4444; }
.training-timer{
  position:absolute;
  left:50%;
  top:-150px;
  transform:translateX(-50%);
  font-size:48px;
  font-weight:bold;
  color:#ff0;
  text-shadow:2px 2px 0 #000;
}
.training-back-btn{
  display:block;
  margin:8px auto 0;
  padding:8px 24px;
  background:#555;
  color:#fff;
  border:none;
  border-radius:6px;
  font-size:14px;
  cursor:pointer;
}

/* 特殊進化訓練卡片 */
.evo-card{
  width:44px; height:44px;
  border:2px solid #666;
  border-radius:6px;
  cursor:pointer;
  font-size:20px;
  color:#fff;
  transition: background 0.3s, transform 0.15s;
}
.evo-card:active{ transform:scale(0.9); }
.evo-card.flipped{ background:#444; color:#888; }
.evo-card.found{ opacity:0.5; pointer-events:none; }
.evo-card-type-0{ background:url('BG/Card core.png') center/cover; }   /* 紅色組→核心卡 */
.evo-card-type-1{ background:url('BG/Card Star.png') center/cover; }  /* 黃色組→星卡 */
.evo-card-type-2{ background:url('BG/4-leaf clover.png') center/cover; } /* 綠色組→四葉草 */

/* 圖鑑面板 */
.digidex-stage{
  margin-bottom:12px;
}
.digidex-stage-title{
  color:#ffcc00;
  font-size:14px;
  font-weight:700;
  margin-bottom:6px;
  padding-bottom:4px;
  border-bottom:1px solid #444;
}
.digidex-grid{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}
.digidex-entry{
  display:flex;
  flex-direction:column;
  align-items:center;
  background:#333;
  border-radius:6px;
  padding:8px;
  width:72px;
  cursor:pointer;
  transition:background .15s;
}
.digidex-entry:hover{ background:#555; }
.digidex-entry canvas{
  display:block;
  width:48px;
  height:48px;
  image-rendering:pixelated;
  image-rendering:crisp-edges;
  margin-bottom:4px;
}
.digidex-entry .d-name{
  font-size:11px;
  color:#fff;
  text-align:center;
  word-break:break-all;
}
.digidex-entry .d-info{
  font-size:9px;
  color:#aaa;
  text-align:center;
  line-height:1.3;
  margin-top:4px;
  padding-top:4px;
  border-top:1px solid #444;
}
.digidex-detail{
  display:none;
  padding:8px;
}
.digidex-detail .detail-sprite{
  display:block;
  margin:0 auto 8px;
  image-rendering:pixelated;
  image-rendering:crisp-edges;
}
.digidex-detail .detail-name{
  font-size:16px;
  font-weight:700;
  color:#fff;
  text-align:center;
  margin-bottom:8px;
}
.digidex-detail .detail-row{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  color:#ccc;
  padding:3px 0;
  border-bottom:1px solid #333;
}
.digidex-detail .detail-row span:last-child{ color:#fff; }
.digidex-detail .detail-back{
  margin-top:8px;
  padding:8px;
  width:100%;
  background:#555;
  color:#fff;
  border:none;
  border-radius:4px;
  font-size:13px;
  cursor:pointer;
}
.digidex-detail .detail-back:hover{ background:#777; }

</style>
</head>
<body>
<div class="top-bar">
  <button class="call-btn" id="callBtn" title="呼叫"><img src="BG/call.png" alt="呼叫"></button>
  <h2 class="title">數碼暴龍一代</h2>
  <button class="settings-btn" id="settingsBtn" title="設定">⚙</button>
</div>

<!-- 單個主顯示屏 -->
<div class="screen-container">
  <canvas id="screen" class="main-screen" width="32" height="16"></canvas>
  <div class="dark-overlay" id="darkOverlay"></div>
</div>

<!-- 中層：8個功能按鈕 -->
<div class="btn-panel" id="btnPanel">
</div>

<!-- 對戰面板（8個按鈕下方） -->
<div class="stats-display" id="battleDisplay" style="display:none;">
  <div class="sd-title" id="battleTitle">對戰</div>
  <div class="battle-info" id="battleInfo">
    <div class="battle-vs-row">
      <div class="battle-side enemy">
        <div class="battle-side-name" id="battleEnemyName"></div>
        <div class="battle-side-hp" id="battleEnemyHpText"></div>
      </div>
      <div class="battle-vs-text">⚔ VS</div>
      <div class="battle-side player">
        <div class="battle-side-name" id="battlePlayerName"></div>
        <div class="battle-side-hp" id="battlePlayerHpText"></div>
      </div>
    </div>
  </div>
  <div class="battle-msg" id="battleMsg"></div>
  <div class="battle-log" id="battleLog"></div>
  <div class="adversity-evo-banner" id="adversityEvoBanner">逆境進化!</div>
  <div class="battle-btns" id="battleBtns">
    <button class="battle-atk-btn" id="battleAttackBtn">攻擊</button>
    <button class="battle-run-btn" id="battleRunBtn">退出</button>
  </div>
</div>

<!-- 狀態面板（按鈕下方） -->
<div class="stats-display" id="statsDisplay">
  <div class="sd-title" id="sdName">Agumon</div>
  <div class="sd-row"><span>階段</span><span id="sdStage">成長期</span></div>
  <div class="sd-row"><span>屬性</span><span id="sdAttr">vaccine</span></div>
  <div class="sd-row"><span>年齡</span><span id="sdAge">0歲</span></div>
  <div class="sd-row"><span>體重</span><span id="sdWeight">5</span></div>
  <div class="sd-row"><span>飢餓</span><span id="sdHunger" style="font-size:12px;letter-spacing:1px;">❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️</span></div>
  <div class="sd-row"><span>生命值</span><span id="sdHp">120</span></div>
  <div class="sd-row"><span>攻擊力</span><span id="sdAtk">12</span></div>
  <div class="sd-row"><span>速度</span><span id="sdSpeed">3.0</span></div>
  <div class="sd-row"><span>爆擊率</span><span id="sdDouble">8%</span></div>
  <div class="sd-row"><span>閃避率</span><span id="sdEvade">5%</span></div>
  <div class="sd-row"><span>親密度</span><span id="sdAffinity">0</span></div>
  <div class="sd-row"><span>訓練點</span><span id="sdTrainingPoints">12</span></div>
  <div class="sd-row"><span>育成失誤</span><span id="sdCareMistakes" style="color:#ff6666;">0</span></div>
</div>

<!-- 食物面板（按鈕下方） -->
<div class="stats-display" id="foodDisplay" style="display:none;">
  <div class="sd-title">食物選擇</div>
  <div id="foodList" style="padding:4px 0;">
    <div class="food-item" data-food="meat" onclick="feedDigimon('meat')">🥩 1.肉</div>
  </div>
</div>

<!-- 訓練面板 -->
<div class="stats-display" id="trainingDisplay" style="display:none;">
  <div class="sd-title">訓練</div>
  <!-- 模式選擇 -->
  <div id="trainingModeSelect">
    <div style="text-align:center;color:#ffcc00;font-weight:700;margin-bottom:6px;font-size:14px;">
      剩餘訓練點：<span id="tdTrainingPoints" style="font-size:18px;">12</span>
    </div>
    <div class="training-mode-selector">
      <div class="training-mode-btn" id="trainingModeAttack" data-mode="attack">
        <span>1. 攻擊訓練 +0.1</span>
        <span class="help-icon" data-mode="attack">!</span>
      </div>
      <div class="training-mode-btn" id="trainingModeLife" data-mode="life">
        <span>2. 生命訓練 +0.8</span>
        <span class="help-icon" data-mode="life">!</span>
      </div>
      <div class="training-mode-btn" id="trainingModeCritical" data-mode="critical">
        <span>3. 暴擊訓練 +0.004</span>
        <span class="help-icon" data-mode="critical">!</span>
      </div>
      <div class="training-mode-btn" id="trainingModeEvade" data-mode="evade">
        <span>4. 閃避訓練 +0.004</span>
        <span class="help-icon" data-mode="evade">!</span>
      </div>
      <div class="training-mode-btn" id="trainingModeSpeed" data-mode="speed">
        <span>5. 速度訓練 +0.04</span>
        <span class="help-icon" data-mode="speed">!</span>
      </div>
      <div class="training-mode-btn" id="trainingModeEvo" data-mode="affinity">

<!-- Toast 提示 -->
<div id="toast"></div>

<script>
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');

// ========== 參數設定 ==========
const CELL_SIZE = 16;
const GAP = 1;
const PITCH = CELL_SIZE + GAP; // 17
const ROWS = 18;
const COLS = 12;
const FRAME_LABELS = ["idle","idle","eat","eat","sleep","sleep","refuse","happy","angry","hurt","sad","attack"];
const DIGIMON_NAMES = ["Botamon","Koromon","Agumon","Greymon","MetalGreymon","WarGreymon","Omegamon"];

// ========== 圖鑑資料 ==========
const DIGIDEX_STAGES = [
  { name: "蛋 / 幼年期 / 幼年期Ⅱ", rows: [-1, 0, 1] },
  { name: "成長期",   rows: [2, 3] },
  { name: "成熟期",   rows: [4, 5, 6, 7, 8, 9, 10] },
  { name: "完全體",   rows: [11, 12, 13] },
];
// 所有 sprite row 的名稱（0～13）
const ALL_NAMES = [
  "黑球獸","滾球獸","亞古獸","貝塔獸",
  "暴龍獸","巨龍獸","惡魔獸","火焰獸","飛龍獸","海龍獸","鼻涕獸",
  "機械暴龍獸","豆豆獸","熊仔獸",
];
const TOTAL_DIGIMON = ALL_NAMES.length;

// 進化路線：根據當前 row 返回下一階段的隨機 row
function getEvolutionRow(row) {
  if (row === 0) return 1;                         // 黑球獸 → 滾球獸
  if (row === 1) return (gameCareMistakes >= 1) ? 3 : 2; // 滾球獸：失誤≥1→貝塔獸(3)，無失誤→亞古獸(2)
  if (row >= 2 && row <= 3) return 4 + Math.floor(Math.random() * 7); // 成長期 → 隨機成熟期 (4~10)
  if (row >= 4 && row <= 10) return 11 + Math.floor(Math.random() * 3); // 成熟期 → 隨機完全體 (11~13)
  return row;                                      // 完全體 → 不變
}

// 精靈圖路徑（獨立行圖片）
const BG_NAMES = ["Noon", "dusk", "Night"];

let rowImages = new Array(18); // row_00.png ~ row_17.png
let attackRowImages = new Array(14); // Attack/00_at.png ~ 13_at.png（龍發射的火球圖）
let meatImage = new Image();
let bgImages = {};
let currentBgName = "Noon";

function getBgNameByHour(h) {
  if (h >= 19 || h < 5) return "Night";   // 19:00 ~ 04:59
  if (h >= 5 && h < 7) return "dusk";      // 05:00 ~ 06:59  清晨
  if (h >= 7 && h < 17) return "Noon";     // 07:00 ~ 16:59  白天
  return "dusk";                            // 17:00 ~ 18:59  黃昏
}

function updateBgByTime() {
  const name = getBgNameByHour(new Date().getHours());
  if (name !== currentBgName || !mainScreen.style.backgroundImage) {
    currentBgName = name;
    updateCssBackground("auto");
    renderFrame();
  }
}

// ========== 高清像素背景生成與切換 ==========
const HD_BG = {};
const mainScreen = document.querySelector('.main-screen');

function generateHdBackgrounds() {
  // 時間段背景：直接使用 BG/ 資料夾內的 192×96 PNG 圖片
  HD_BG["Noon"] = "BG/Noon.png";
  HD_BG["dusk"] = "BG/dusk.png";
  HD_BG["Night"] = "BG/Night.png";

  // --- Training 訓練場 (384×96) ---
  HD_BG["Training"] = "BG/TrainingBG.png";

  // --- Battle 對戰 (384×144) ---
  const c6 = document.createElement('canvas'); c6.width = 384; c6.height = 144;
  const cx6 = c6.getContext('2d');
  for (let i = 0; i < 24; i++) {
    cx6.fillStyle = 'rgb(40,40,60)';
    cx6.fillRect(0, i * 2, 384, 2);
  }
  cx6.fillStyle = '#666666';
  cx6.fillRect(0, 46, 384, 2);
  cx6.fillStyle = '#444444';
  cx6.fillRect(0, 0, 384, 2);
  for (let i = 24; i < 72; i++) {
    const t = (i - 24) / 47;
    cx6.fillStyle = `rgb(${Math.floor(30+t*30)},${Math.floor(20+t*20)},${Math.floor(50+t*30)})`;
    cx6.fillRect(0, i * 2, 384, 2);
  }
  for (let y = 110; y < 144; y += 12) {
    cx6.fillStyle = 'rgba(80,60,100,0.2)';
    cx6.fillRect(0, y, 384, 2);
  }
  for (let x = 0; x < 384; x += 32) {
    cx6.fillStyle = 'rgba(80,60,100,0.15)';
    cx6.fillRect(x, 110, 2, 34);
  }
  cx6.fillStyle = '#887766';
  cx6.fillRect(2, 60, 8, 60);
  cx6.fillRect(374, 60, 8, 60);
  cx6.fillStyle = '#aa9966';
  cx6.fillRect(3, 64, 6, 6);
  cx6.fillRect(375, 64, 6, 6);
  HD_BG["Battle"] = c6.toDataURL();
}

function updateCssBackground(mode) {
  if (mode === "training") {
    mainScreen.style.backgroundImage = `url(${HD_BG["Training"]})`;
  } else if (mode === "battle") {
    mainScreen.style.backgroundImage = `url(${HD_BG["Battle"]})`;
  } else {
    // auto / eating / refusing → 時間段背景
    mainScreen.style.backgroundImage = `url(${HD_BG[currentBgName] || HD_BG["Noon"]})`;
  }
}
let currentRow = 2;    // 目前選擇的數碼獸 row
// 當前場景（目前僅用來決定渲染行為）

// ========== 自動動畫變數 ==========
let autoX = 9;            // 1~17 連續座標（16px 精靈在 32px 畫布內）
let autoTargetX = null;
let autoAnimStep = 0;
const ANIM_IV = 800;
const EDGE_IV = 500;
const MOVE_IV = 2000;
const EDGE_SEQ = [0, 11, 11, 0];
const MID_SEQ  = [0, 0, 0, 1];
let autoAnimIv = ANIM_IV;
let autoTimer = null;
let autoMoveTimer = null;

// ========== 進食/拒絕 模式變數 ==========
let gameMode = "auto";       // "auto" | "eating" | "refusing" | "battle"
let gameModeStep = 0;
const EAT_IV = 400;
const REFUSE_IV = 300;

// ========== 睡眠系統 ==========
let isSleeping = false;
let lightsOff = false; // 關燈模式
let sleepZFrame = 0; // ZZZ 動畫幀 (0/1 交替)
const SLEEP_SEQ = [4, 4, 5, 5]; // col 4="sleep", col 5="sleep2"

// ========== 蛋時期系統 ==========
let isEggPhase = true;       // 是否在蛋時期
let eggStartTime = Date.now();
let eggImage = new Image();  // 蛋精靈圖 (48×16, 3幀各16×16)

function updateSleepByTime(){
  if(isEggPhase) { isSleeping = false; lightsOff = false; return; } // 蛋時期不睡眠
  const wasSleeping = isSleeping;
  const gameHour = new Date().getHours(); // 同步现实时间
  const wakeHour = (sleepHour + 8) % 24;
  if(sleepHour < wakeHour){
    // 不跨日 e.g. 5:00 ~ 13:00
    isSleeping = (gameHour >= sleepHour && gameHour < wakeHour);
  } else {
    // 跨日 e.g. 22:00 ~ 06:00 (wakeHour=6 < sleepHour=22)
    isSleeping = (gameHour >= sleepHour || gameHour < wakeHour);
  }
  // 只在 auto 模式生效，訓練/對戰中不自動進入睡眠
  if(isSleeping && (trainingMode || gameMode === "battle")){
    isSleeping = false;
  }
  if(isSleeping && !wasSleeping){
    // 剛進入睡眠：確保在 auto mode 並停止移動
    if(autoMoveTimer){ clearInterval(autoMoveTimer); autoMoveTimer = null; }
    autoTargetX = null;
    autoX = 9; // 睡眠時置中
    if(autoTimer) renderFrame(); // 只當遊戲已初始化才重繪
  }
  if(!isSleeping && wasSleeping){
    // 剛醒來：恢復移動 & 自動開燈
    if(gameMode === "auto" && !autoMoveTimer){
      autoMoveTimer = setInterval(stepAutoMove, MOVE_IV);
    }
    lightsOff = false;
    const overlay = document.getElementById("darkOverlay");
    if(overlay) overlay.classList.remove("on");
    saveSettings();
    if(autoTimer) renderFrame(); // 只當遊戲已初始化才重繪
  }
}

// ========== 蛋時期 ==========
function startEggPhase() {
  isEggPhase = true;
  eggStartTime = Date.now();
  
  // 所有狀態數據歸零
  gameAge = 0;
  gameAgeLastDay = 0;
  stageStartDay = 0;
  gameHunger = 0;
  gameWeight = 0;
  gameAffinity = 0;
  gameTrainingPoints = 0;
  gameCareMistakes = 0;
  callFirstShownTime = 0;
  callMistakeRecorded = false;
  if(callBlinkTimer){ clearInterval(callBlinkTimer); callBlinkTimer = null; }
  resetAllBonuses();
  
  // 重置遊戲狀態
  currentRow = 0;
  isSleeping = false;
  lightsOff = false;
  poopCount = 0;
  for(let i=0;i<2;i++) poopFrame[i]=0;
  poopsOnScreen = 0;
  poopCountdown = 0;
  
  gameMode = "auto";
  gameModeStep = 0;
  autoX = 9;
  autoTargetX = null;
  autoAnimStep = 0;
  
  if(autoTimer){ clearInterval(autoTimer); autoTimer = null; }
  if(autoMoveTimer){ clearInterval(autoMoveTimer); autoMoveTimer = null; }
  
  const overlay = document.getElementById("darkOverlay");
  if(overlay) overlay.classList.remove("on");
  
  saveGameState();
  updateStatsDisplay();
  renderFrame();
  startAutoPlay();
}

function hatchEgg() {
  isEggPhase = false;
  currentRow = 0; // 黑球獸
  
  gameAge = 0;
  gameAgeLastDay = 0;
  stageStartDay = 0;
  gameHunger = 0;
  gameWeight = DIGIMON_STATS[0].weight;
  gameAffinity = DIGIMON_STATS[0].bondInitial || 10;
  
  resetAllBonuses();
  gameTrainingPoints = 0; // 幼年期無訓練點
  gameCareMistakes = 0;
  callFirstShownTime = 0;
  callMistakeRecorded = false;
  if(callBlinkTimer){ clearInterval(callBlinkTimer); callBlinkTimer = null; }
  isSleeping = false;
  lightsOff = false;
  poopCount = 0;
  for(let i=0;i<2;i++) poopFrame[i]=0;
  poopsOnScreen = 0;
  poopCountdown = 0;
  
  gameMode = "auto";
  gameModeStep = 0;
  autoX = 16;
  autoTargetX = null;
  autoAnimStep = 0;
  
  if(autoTimer){ clearInterval(autoTimer); autoTimer = null; }
  if(autoMoveTimer){ clearInterval(autoMoveTimer); autoMoveTimer = null; }
  
  // 隱藏蛋時期可能開啟的面板，確保孵化後重新打開時顯示正確數據
  document.getElementById("statsDisplay").style.display = "none";
  document.getElementById("digidexDisplay").style.display = "none";
  saveGameState();
  updateBgByTime(); // 設定背景
  selectDigimon(0); // 初始化黑球獸精靈 + 啟動遊戲循環
  
  // 誕生慶祝：idle,happy,idle,happy + Happy.png
  setTimeout(() => startCelebration(), 200);
  showToast("蛋孵化了！黑球獸誕生 🐣");
}

function getEggFrame() {
  const elapsed = (Date.now() - eggStartTime) / 1000; // 秒
  if(elapsed < 52) {
    // 等待期：左右交替（每秒切換一次）
    return Math.floor(elapsed) % 2; // 0, 1, 0, 1...
  } else if(elapsed < 57) {
    // 晃動期(52-57s)：只用最左邊16×16精靈
    return 0;
  } else {
    // 晃動後(57-60s)：顯示第3幀(右邊16×16, 破殼) 3秒
    return 2;
  }
}

function getEggWobbleOffset() {
  const elapsed = (Date.now() - eggStartTime) / 1000;
  if(elapsed < 52 || elapsed >= 57) return 0;
  // 孵化晃動 52~57秒：中→左→中→右→中 循環，100ms/步，1秒2次
  const hatchElapsed = elapsed - 52;
  const step = Math.floor(hatchElapsed / 0.1);
  const seq = [0, -1, 0, 1, 0];
  return seq[step % 5];
}

// ========== 繪製 ==========
function getColForAuto(){
  if(isSleeping) return SLEEP_SEQ[autoAnimStep % 4];
  const poopShift = getPoopOffset();
  const isEdge = autoX <= 1 - poopShift || autoX >= 17 - poopShift;
  const isMoving = autoTargetX !== null;
  if(isEdge && !isMoving) return EDGE_SEQ[autoAnimStep % 4];
  return MID_SEQ[autoAnimStep % 4];
}

function renderFrame(){
  if(trainingMode){
    renderTrainingCanvas();
    return;
  }
  if(gameMode === "battle"){
    renderBattleScene();
    return;
  }
  // === 清潔沖水模式 ===
  if(flushingMode){
    renderFlushingFrame();
    return;
  }
  // === 誕生/進化慶祝動畫 ===
  if(birthEvoCelebrate){
    ctx.clearRect(0,0,32,16);
    const col = BIRTH_EVO_HAPPY_SEQ[Math.min(birthEvoCelebrateStep, 3)];
    const isHappy = col === 7;
    // 龍居中 (x=8)，面向左
    if(rowImages[currentRow] && rowImages[currentRow].complete){
      ctx.drawImage(rowImages[currentRow], col * PITCH, 0, CELL_SIZE, CELL_SIZE, 8, 0, CELL_SIZE, CELL_SIZE);
    }
    // 左右各2個 Happy.png（上下堆疊，僅 happy 幀）
    if(isHappy && happyImage.complete && happyImage.naturalWidth > 0){
      ctx.drawImage(happyImage, 0, 0, 8, 8);   // 左上
      ctx.drawImage(happyImage, 0, 8, 8, 8);   // 左下
      ctx.drawImage(happyImage, 24, 0, 8, 8);  // 右上
      ctx.drawImage(happyImage, 24, 8, 8, 8);  // 右下
    }
    return;
  }
  // === 進化前慶祝動畫（!.png，回 idle 後進化） ===
  if(preEvoCelebrate){
    ctx.clearRect(0,0,32,16);
    const col = PRE_EVO_SEQ[Math.min(preEvoCelebrateStep, 4)];
    const isHappy = col === 7;
    // 龍居中 (x=8)
    if(rowImages[currentRow] && rowImages[currentRow].complete){
      ctx.drawImage(rowImages[currentRow], col * PITCH, 0, CELL_SIZE, CELL_SIZE, 8, 0, CELL_SIZE, CELL_SIZE);
    }
    // 左右各2個 !.png（上下堆疊，僅 happy 幀同步）
    if(isHappy && battleEvoExclaimImg.complete && battleEvoExclaimImg.naturalWidth > 0){
      ctx.drawImage(battleEvoExclaimImg, 0, 0, 8, 8);   // 左上
      ctx.drawImage(battleEvoExclaimImg, 0, 8, 8, 8);   // 左下
      ctx.drawImage(battleEvoExclaimImg, 24, 0, 8, 8);  // 右上
      ctx.drawImage(battleEvoExclaimImg, 24, 8, 8, 8);  // 右下
    }
    return;
  }
  ctx.clearRect(0,0,32,16);

  // === 蛋時期渲染 ===
  if(isEggPhase){
    const eggFrame = getEggFrame();
    const elapsed = (Date.now() - eggStartTime) / 1000;
    if(elapsed >= 60) {
      hatchEgg();
      return;
    }
    if(eggImage.complete && eggImage.naturalWidth > 0){
      // 蛋 16×16 在 32×16 畫面居中: x = (32-16)/2 = 8，加上晃動偏移
      const wobbleX = getEggWobbleOffset();
      ctx.drawImage(eggImage, eggFrame * 16, 0, 16, 16, 8 + wobbleX, 0, 16, 16);
    }
    return;
  }

  // === 繪製糞便（主螢幕：auto/eating/refusing 模式，訓練/對戰已提前 return）===
  if(poopsOnScreen > 0 && fecesImage.complete && fecesImage.naturalWidth > 0){
    for(let i = 0; i < poopsOnScreen; i++){
      const pos = POOP_POSITIONS[i];
      ctx.drawImage(
        fecesImage,
        poopFrame * 8, 0, 8, 8,   // 來源：左右2幀8x8
        pos.x, pos.y, 8, 8         // 糞便位置固定，不受偏移影響
      );
    }
  }

  if(gameMode === "eating"){
    // 進食模式：龍在右邊向左，食物固定，動畫依序切換 4 幀
    const poopShift = getPoopOffset();
    const col = (gameModeStep % 2 === 0) ? 2 : 3; // eat1 / eat2
    const foodX = 0 - poopShift;                    // 食物隨糞便偏移左移
    const foodFrame = Math.floor((gameModeStep + 1) / 2); // 只在 EAT2 時進幀
    // 畫肉
    if(meatImage.complete && meatImage.naturalWidth > 0){
      ctx.drawImage(
        meatImage,
        foodFrame * CELL_SIZE, 0, CELL_SIZE, CELL_SIZE,
        foodX, 0, CELL_SIZE, CELL_SIZE
      );
    }
    // 龍在右邊 (autoX=14)，面向左（預設方向），依糞便偏移
    ctx.drawImage(
      rowImages[currentRow],
      col * PITCH, 0,
      CELL_SIZE, CELL_SIZE,
      16 - poopShift, 0,
      CELL_SIZE, CELL_SIZE
    );
    return;
  }

  if(gameMode === "refusing"){
    // 拒絕模式：龍在中間左右面向交替（左→右→左→右），依糞便偏移
    const poopShift = getPoopOffset();
    const faceFlip = gameModeStep % 2 === 0;
    ctx.save();
    let drawX = 8 - poopShift;
    if(faceFlip){
      ctx.translate(32, 0);
      ctx.scale(-1, 1);
      drawX = 8 + poopShift; // 翻轉後座標校正：16 - (8 - poopShift)
    }
    ctx.drawImage(
      rowImages[currentRow],
      6 * PITCH, 0,  // col 6 = refuse frame, source y=0
      CELL_SIZE, CELL_SIZE,
      drawX, 0,
      CELL_SIZE, CELL_SIZE
    );
    ctx.restore();
    return;
  }

  // 普通模式
  const colIndex = getColForAuto();
  const poopShift = getPoopOffset();
  const scootedCenter = 9 - poopShift;
  const faceRight = (autoTargetX !== null && autoX < autoTargetX) || (autoTargetX === null && autoX >= scootedCenter);
  const spriteX = autoX - 1 - poopShift;

  ctx.save();
  let drawX = spriteX;
  if(faceRight){
    ctx.translate(32, 0);
    ctx.scale(-1, 1);
    drawX = 16 - spriteX; // 翻转後座標校正
  }
  ctx.drawImage(
    rowImages[currentRow],
    colIndex * PITCH, 0,
    CELL_SIZE, CELL_SIZE,
    drawX, 0,
    CELL_SIZE, CELL_SIZE
  );
  ctx.restore();

  // === 睡眠 ZZZ 動畫 ===
  if(isSleeping && sleepingZImage.complete && sleepingZImage.naturalWidth > 0){
    ctx.drawImage(
      sleepingZImage,
      sleepZFrame * 8, 0, 8, 16,  // 來源：左右2幀各8x16
      24 - poopShift, 0, 8, 16      // 龍右邊
    );
  }
  // === 自然進化特效（覆蓋全螢幕） ===
  if(evoAnimActive && (evoAnimPhase === "evoDown" || evoAnimPhase === "evoUp")){
    if(evolutionImage.complete && evolutionImage.naturalWidth > 0){
      ctx.drawImage(evolutionImage, 0, 0, 16, evoAnimStep, 0, 0, 32, evoAnimStep);
    }
  }
}

// ========== 動畫 / 移動 ==========
function stepAutoAnim(){
  // 蛋時期：只渲染不移動
  if(isEggPhase){
    const elapsed = (Date.now() - eggStartTime) / 1000;
    if(elapsed >= 60) { hatchEgg(); return; }
    // 孵化晃動期(52-57s)切換到100ms刷新，實現1秒2次晃動
    if(elapsed >= 52 && elapsed < 57 && autoAnimIv !== 100){
      restartAnimTimer(100);
    } else if(elapsed >= 57 && autoAnimIv !== ANIM_IV){
      restartAnimTimer(ANIM_IV);
    }
    renderFrame();
    return;
  }
  // 進化動畫中：只渲染不移動
  if(evoAnimActive){
    // evoDown/evoUp 階段用 interval 自行控制步數與渲染
    renderFrame();
    return;
  }
  // 誕生/進化慶祝中：計時器自行控制，不移動
  if(birthEvoCelebrate){
    renderFrame();
    return;
  }
  // 進化前慶祝中：計時器自行控制，不移動
  if(preEvoCelebrate){
    renderFrame();
    return;
  }
  // 睡眠模式：只播放睡眠幀，不移動、不吃、不拒絕
  if(isSleeping){
    autoAnimStep++;
    sleepZFrame = Math.floor((autoAnimStep % 4) / 2); // 與 SLEEP_SEQ 同步：sleep→0, sleep2→1
    renderFrame();
    return;
  }
  // 進食模式
  if(gameMode === "eating"){
    gameModeStep++;
    if(gameModeStep >= 6){
      gameMode = "auto";
      gameModeStep = 0;
      // 動畫結束後走回中間
      autoTargetX = 9 - getPoopOffset();
      autoAnimStep = 0;
      restartAnimTimer(ANIM_IV);
      if(!autoMoveTimer) autoMoveTimer = setInterval(stepAutoMove, MOVE_IV);
      renderFrame();
      return;
    }
    renderFrame();
    return;
  }
  // 拒絕模式（搖晃）
  if(gameMode === "refusing"){
    gameModeStep++;
    if(gameModeStep >= 8){
      gameMode = "auto";
      gameModeStep = 0;
      autoAnimStep = 0;
      autoTargetX = 9 - getPoopOffset();
      restartAnimTimer(ANIM_IV);
      if(!autoMoveTimer) autoMoveTimer = setInterval(stepAutoMove, MOVE_IV);
      renderFrame();
      return;
    }
    renderFrame();
    return;
  }
  // 普通模式
  let justLanded = false;
  if(autoTargetX !== null){
    const step = autoX < autoTargetX ? 1 : -1;
    autoX += step;
    if(Math.abs(autoX - autoTargetX) < 0.5 ||
       (step > 0 && autoX >= autoTargetX) ||
       (step < 0 && autoX <= autoTargetX)){
      autoX = autoTargetX;
      autoTargetX = null;
      justLanded = true;
    }
  }
  if(justLanded && (autoX <= 1 || autoX >= 17)) {
    autoAnimStep = -1;
  }
  autoAnimStep++;
  renderFrame();
  const poopShift = getPoopOffset();
  const isEdge = autoX <= 1 - poopShift || autoX >= 17 - poopShift;
  if(isEdge && autoTargetX === null && autoAnimIv !== EDGE_IV){
    restartAnimTimer(EDGE_IV);
  } else if(!isEdge && autoAnimIv !== ANIM_IV){
    restartAnimTimer(ANIM_IV);
  }
}

function stepAutoMove(){
  if(isEggPhase) return;
  if(isSleeping) return;
  if(autoTargetX !== null) return;
  const poopShift = getPoopOffset();
  const lo = 1 - poopShift;
  const hi = 17 - poopShift;
  const center = 9 - poopShift;
  const isEdge = autoX <= lo || autoX >= hi;
  if(isEdge){
    if(autoAnimStep < 5) return;
    autoTargetX = center;
  } else {
    if(Math.random() < 0.1) return;
    const dir = Math.random() < 0.5 ? -1 : 1;
    const t = autoX + dir * 5;
    autoTargetX = Math.max(lo, Math.min(hi, t));
    if(autoTargetX === autoX) return;
  }
  autoAnimStep = 0;
}

function restartAnimTimer(iv){
  if(autoAnimIv === iv) return;
  if(autoTimer) clearInterval(autoTimer);
  autoAnimIv = iv;
  autoTimer = setInterval(stepAutoAnim, iv);
}

// === 排便系統 ===
function randPoopInterval(){ return 6600 + Math.floor(Math.random() * 1201); } // 110~130分鐘 (6600~7800秒)

function resetPoopCountdown(){
  poopCountdown = randPoopInterval();
}

function startPoopTimer(){
  if(poopTimer) clearInterval(poopTimer);
  if(poopCountdown <= 0) resetPoopCountdown();
  poopTimer = setInterval(() => {
    if(isEggPhase) return; // 蛋時期不產生糞便
    poopCountdown--;
    if(poopCountdown <= 0){
      if(poopsOnScreen < 8){
        poopsOnScreen++;
        saveGameState();
      }
      resetPoopCountdown();
    }
  }, 1000);

  // 獨立動畫幀切換
  if(!poopFrameTimer){
    poopFrameTimer = setInterval(() => {
      poopFrame = (poopFrame + 1) % 2;
    }, 500);
  }
}

function stopPoopTimer(){
  if(poopTimer){ clearInterval(poopTimer); poopTimer = null; }
}

function getPoopOffset(){
  if(poopsOnScreen === 0) return 0;
  if(poopsOnScreen <= 2) return 8;
  if(poopsOnScreen <= 4) return 16;
  if(poopsOnScreen <= 6) return 24;
  return 32;
}

function startFlushing(){
  if(flushingMode) return;
  if(poopsOnScreen === 0) return; // 無屎可清
  flushingMode = true;
  flushingPhase = 0;
  flushingStep = 0;
  flushingPushX = 0;
  // 暫停 auto 計時器
  if(autoTimer){ clearInterval(autoTimer); autoTimer = null; }
  if(autoMoveTimer){ clearInterval(autoMoveTimer); autoMoveTimer = null; }
  flushingTimer = setInterval(stepFlushing, FLUSHING_PUSH_INTERVAL);
  renderFrame();
}

function stepFlushing(){
  if(!flushingMode) return;
  if(flushingPhase === 0){
    // === 推擠階段 ===
    flushingStep++;
    flushingPushX = flushingStep; // 每步推 1px（龍+屎向左偏移）
    autoAnimStep++; // 龍走路動畫
    if(flushingStep >= FLUSHING_PUSH_STEPS){
      // 推擠結束 → 清除糞便 → 進入 Happy 階段
      poopsOnScreen = 0;
      resetPoopCountdown();
      flushingPhase = 1;
      flushingStep = 0;
      flushingPushX = 0;
      autoX = 9; // 龍回到中間
      autoAnimStep = 0;
      if(flushingTimer){ clearInterval(flushingTimer); }
      flushingTimer = setInterval(stepFlushing, FLUSHING_HAPPY_INTERVAL);
      saveGameState();
      renderFrame();
      return;
    }
    // flushingPushX 已在 renderFlushingFrame 中處理視覺偏移，無需改 autoX
    renderFrame();
  } else if(flushingPhase === 1){
    // === Happy 階段 ===
    const col = FLUSHING_HAPPY_SEQ[flushingStep];
    const faceRight = false; // 龍固定面向左
    // renderFrame 會處理 happy 渲染
    flushingStep++;
    if(flushingStep >= FLUSHING_HAPPY_STEPS){
      stopFlushing();
      return;
    }
    autoAnimStep = flushingStep; // 同步步數給 renderFrame 判斷柱位
    renderFrame();
  }
}

function renderFlushingFrame(){
  ctx.clearRect(0, 0, 32, 16);

  if(flushingPhase === 0){
    // === 推擠階段：沖水從右側推入，龍和屎向左移動 ===

    // 1) 畫糞便（向左偏移 pushX）
    if(poopsOnScreen > 0 && fecesImage.complete && fecesImage.naturalWidth > 0){
      // 在推擠階段暫時還沒清除 poops，需要畫偏移後的屎
      for(let i = 0; i < poopsOnScreen; i++){
        const pos = POOP_POSITIONS[i];
        ctx.drawImage(
          fecesImage,
          poopFrame * 8, 0, 8, 8,
          pos.x - flushingPushX, pos.y, 8, 8
        );
      }
    }

    // 2) 畫龍（向左偏移 pushX）
    const dSpriteX = autoX - 1 - flushingPushX;
    if(rowImages[currentRow] && rowImages[currentRow].complete){
      const col = (autoAnimStep % 2 === 0) ? 0 : 1; // 走路動畫
      ctx.drawImage(
        rowImages[currentRow],
        col * PITCH, 0, CELL_SIZE, CELL_SIZE,
        dSpriteX, 0, CELL_SIZE, CELL_SIZE
      );
    }

    // 3) 畫沖水 sprite (16x16 全圖，從右側外完整滑入，不裁切不壓縮)
    if(flushingImage.complete && flushingImage.naturalWidth > 0){
      const waterX = 32 - flushingStep; // 逐像素左移，從 x=32 外側滑入
      ctx.drawImage(flushingImage, 0, 0, 16, 16, waterX, 0, 16, 16);
    }

  } else if(flushingPhase === 1){
    // === Happy 階段：龍在中間，播放 idle/happy 動畫 ===

    const col = FLUSHING_HAPPY_SEQ[Math.min(flushingStep, FLUSHING_HAPPY_STEPS - 1)];
    const isHappy = col === 7;

    // 1) 畫龍 (autoX=9, 固定面向左)
    const faceRight = false;
    if(rowImages[currentRow] && rowImages[currentRow].complete){
      ctx.save();
      let dX = 8;
      if(faceRight){
        ctx.translate(32, 0);
        ctx.scale(-1, 1);
        dX = 8; // 翻轉後座標: 16 - 8 = 8
      }
      ctx.drawImage(
        rowImages[currentRow],
        col * PITCH, 0, CELL_SIZE, CELL_SIZE,
        dX, 0, CELL_SIZE, CELL_SIZE
      );
      ctx.restore();
    }

    // 2) 畫 Happy.png 左右各一個 (僅在 happy 幀)
    if(isHappy && happyImage.complete && happyImage.naturalWidth > 0){
      ctx.drawImage(happyImage, 2, 0, 8, 8);
      ctx.drawImage(happyImage, 22, 0, 8, 8);
    }
  }
}

function stopFlushing(){
  if(flushingTimer){ clearInterval(flushingTimer); flushingTimer = null; }
  flushingMode = false;
  flushingPhase = 0;
  flushingStep = 0;
  flushingPushX = 0;
  // 恢復 auto 模式
  autoX = 9;
  autoTargetX = null;
  autoAnimStep = 0;
  startAutoPlay();
}

function cleanPoops(){
  if(poopsOnScreen === 0) return;
  // 如果在訓練/對戰中，不啟動沖水
  if(trainingMode || gameMode === "battle") return;
  startFlushing();
}

function startAutoPlay(){
  updateBgByTime(); // 首次根據時間設定背景
  autoX = 9 - getPoopOffset();
  autoTargetX = null;
  autoAnimStep = 0;
  autoAnimIv = ANIM_IV;
  autoTimer = setInterval(stepAutoAnim, ANIM_IV);
  if(!isSleeping){
    autoMoveTimer = setInterval(stepAutoMove, MOVE_IV);
  }
  renderFrame();
  startPoopTimer(); // 啟動排便計時器
}

let battleEnemyEvoStep = 0;           // 0-16 垂直滾動步數
let battleEnemyEvoNextRow = -1;        // 敵方進化目標 row
let battleEnemyEvoCallback = null;     // 敵方動畫完成回調

let battleEvoEffectImg = new Image();

let battleShowEnemySad = false;        // 顯示 Sad 圖（敵方）
let battleShowEnemyHappy = false;      // 顯示 Happy 圖（敵方）
// 新增常量
const CRIT_MULT = 1.5;
const ADVERSITY_EVO_MAX_TRIES = 3;
const ATTR_TYPE_MULT = {
  vaccine:  { vaccine: 1.0, virus: 1.2, data: 0.8, none: 1.0 },
  virus:    { vaccine: 0.8, virus: 1.0, data: 1.2, none: 1.0 },
  data:     { vaccine: 1.2, virus: 0.8, data: 1.0, none: 1.0 },
  none:     { vaccine: 1.0, virus: 1.0, data: 1.0, none: 1.0 }
};
function getAttrColor(myAttr, oppAttr){
  const mult = (ATTR_TYPE_MULT[myAttr] && ATTR_TYPE_MULT[myAttr][oppAttr || "none"]) || 1.0;
  if(mult > 1.0) return "#4f4";   // 克制：綠色
  if(mult < 1.0) return "#f44";   // 被克：紅色
  return "#ff4";                   // 一樣：黃色
}
const BATTLE_ANIM_IV = 120;           // 戰鬥動畫間隔
const TRAIN_SLOTS = 5;
// 主 canvas 在訓練時改為 64×16：
// [---Projectile@16---][Dragon@32][Power@48]
const CANVAS_NORMAL_W = 32;
const CANVAS_TRAIN_W = 64;
const CANVAS_BATTLE_W = 384;
const CANVAS_BATTLE_H = 144;
const B_SCALE = 6;                     // 戰鬥精靈 6x 縮放倍數

function selectTrainingType(type){
  if(trainingAttackActive || trainingCelebrationActive || trainingFailureActive) return;
  trainingType = type;
  document.getElementById("trainingModeAttack").classList.toggle("active", type === "attack");
  document.getElementById("trainingModeLife").classList.toggle("active", type === "life");
  document.getElementById("trainingModeCritical").classList.toggle("active", type === "critical");
  document.getElementById("trainingModeEvade").classList.toggle("active", type === "evade");
  document.getElementById("trainingModeSpeed").classList.toggle("active", type === "speed");
  document.getElementById("trainingModeEvo").classList.toggle("active", type === "affinity");
  // 選完後直接開始倒數
  startTrainingPlay();
}

function startTraining(){
  if(flushingMode) stopFlushing(); // 中斷清潔動畫
  const trainPanel = document.getElementById("trainingDisplay");
  
  // 若訓練面板已顯示則關閉（切換）
  if(trainPanel.style.display === "block"){
    stopTraining();
    return;
  }
  
  // 關閉其他面板
  document.getElementById("statsDisplay").style.display = "none";
  document.getElementById("foodDisplay").style.display = "none";
  document.getElementById("digidexDisplay").style.display = "none";
  
  // 暫停自動模式
  if(autoTimer) clearInterval(autoTimer);
  if(autoMoveTimer) clearInterval(autoMoveTimer);
  autoTimer = null;
  autoMoveTimer = null;

  // 從戰鬥模式直接切換：清理戰鬥狀態（不經過 auto mode）
  if(battleActive){ clearBattleState(); }
  
  trainingMode = true;
  updateCssBackground("training");
  trainingLevel = 0;
  trainingClickCount = 0;
  trainingAttackActive = false;
  trainingIdleFrame = 0;
  if(trainingProjectileTimer){
    clearInterval(trainingProjectileTimer);
    trainingProjectileTimer = null;
  }
  if(trainingIdleTimer){
    clearInterval(trainingIdleTimer);
    trainingIdleTimer = null;
  }
  if(sandbagTimer){
    clearInterval(sandbagTimer);
    sandbagTimer = null;
  }
  if(boomTimer){
    clearInterval(boomTimer);
    boomTimer = null;
  }
  trainingProjectileX = 0;
  sandbagState = "normal";
  boomFrame = 0;
  boomCycle = 0;
  
  // 開 idle 動畫定時器（切換 idle1/idle2）
  trainingIdleTimer = setInterval(() => {
    trainingIdleFrame = trainingIdleFrame === 0 ? 1 : 0;
    renderFrame();
  }, 800);
  
  // 重置慶祝狀態
  trainingPowerHidden = false;
  trainingCelebrationActive = false;
  trainingCelebrationStep = 0;
  if(trainingCelebrationTimer){
    clearInterval(trainingCelebrationTimer);
    trainingCelebrationTimer = null;
  }

  // 重置失敗狀態
  trainingFailed = false;
  trainingFailureActive = false;
  trainingFailureStep = 0;
  if(trainingFailureTimer){
    clearInterval(trainingFailureTimer);
    trainingFailureTimer = null;
  }
  if(trainingTimer){
    clearInterval(trainingTimer);
    trainingTimer = null;
  }
  document.getElementById("trainingTimerDisplay").textContent = "";
  lifePhase = "play";

  // 預設模式（高亮 1. 攻擊訓練）
  trainingType = "attack";
  document.getElementById("trainingModeAttack").classList.add("active");
  document.getElementById("trainingModeLife").classList.remove("active");
  document.getElementById("trainingModeCritical").classList.remove("active");
  document.getElementById("trainingModeEvade").classList.remove("active");
  document.getElementById("trainingModeSpeed").classList.remove("active");
  document.getElementById("trainingModeEvo").classList.remove("active");
  // 幼年期/幼年期Ⅱ只顯示攻擊訓練（無加成），隱藏其餘訓練模式
  const baby = (currentRow <= 1);
  document.getElementById("trainingModeLife").style.display = baby ? "none" : "";
  document.getElementById("trainingModeCritical").style.display = baby ? "none" : "";
  document.getElementById("trainingModeEvade").style.display = baby ? "none" : "";
  document.getElementById("trainingModeSpeed").style.display = baby ? "none" : "";
  document.getElementById("trainingModeEvo").style.display = baby ? "none" : "";
  // 幼年期攻擊訓練不顯示 +0.1
  const atkLabel = document.querySelector("#trainingModeAttack span:first-child");
  if(atkLabel) atkLabel.textContent = baby ? "1. 攻擊訓練" : "1. 攻擊訓練 +0.1";
  updateTrainingPointsDisplay();
  // 顯示模式選擇，隱藏開始訓練視圖
  document.getElementById("trainingModeSelect").style.display = "block";
  document.getElementById("trainingPlayView").style.display = "none";

  // 主 canvas 寬度改為 64
  canvas.width = CANVAS_TRAIN_W;
  canvas.style.width = (CANVAS_TRAIN_W * 6) + "px";
  // 重置按鈕顯示
  document.getElementById("trainingClickBtn").style.display = "";
  document.getElementById("speedTrainingBtns").style.display = "none";
  renderFrame();

  trainPanel.style.display = "block";
}

function startTrainingPlay(){
  // 從模式選擇切換到開始訓練視圖，並啟動 3 秒倒數
  if(trainingAttackActive || trainingCelebrationActive || trainingFailureActive) return;

  updateTrainingPointsDisplay();
  document.getElementById("trainingModeSelect").style.display = "none";
  document.getElementById("trainingPlayView").style.display = "block";

  // 重置充能狀態
  trainingLevel = 0;
  trainingClickCount = 0;
  trainingPowerHidden = false;
  // 重置生命訓練狀態（隨機 2~4 個 point）
  lifePointsRemaining = Math.floor(Math.random() * 3) + 2;
  lifeShieldBroken = false;
  lifePhase = "play";

  // 爆擊訓練：不計時，改 bar 移動
  if(trainingType === "critical"){
    document.getElementById("trainingTimerDisplay").textContent = "";
    criticalWallBroken = false;
    startCriticalBar();
    renderFrame();
    return;
  }

  // 閃避訓練：不計時，飛彈移動
  if(trainingType === "evade"){
    document.getElementById("trainingTimerDisplay").textContent = "";
    evadePhase = "moving";
    evadeProjX = -16;
    evadeSucceeded = false;
    evadeDragonFlipped = false;
    startEvadeProjectile();
    renderFrame();
    return;
  }

  // 攻速訓練：序列 AB 配對，從左到右點擊
  if(trainingType === "speed"){
    speedActive = true;
    speedSequence = [];
    speedCurrentIndex = 0;
    speedDragonX = 48;
    speedMovePhase = "";
    speedCorrectFlashAt = -1;
    // 隨機生成 6 個 A/B 字母
    for(let i = 0; i < SPEED_SEQ_COUNT; i++){
      speedSequence.push(Math.random() < 0.5 ? "A" : "B");
    }
    speedCountdown = 3;
    document.getElementById("trainingTimerDisplay").textContent = speedCountdown;
    if(speedCountdownTimer){ clearInterval(speedCountdownTimer); }
    speedCountdownTimer = setInterval(() => {
      speedCountdown--;
      document.getElementById("trainingTimerDisplay").textContent = speedCountdown;
      if(speedCountdown <= 0){
        clearInterval(speedCountdownTimer);
        speedCountdownTimer = null;
        clearSpeedTraining();
        speedDragonX = 32;
        triggerTrainingFailure();
      }
    }, 1000);
    document.getElementById("trainingClickBtn").style.display = "none";
    document.getElementById("speedTrainingBtns").style.display = "flex";
    renderFrame();
    return;
  }

  // 親密度訓練：記憶翻牌
  if(trainingType === "affinity"){
    evoActive = true;
    evoFound = 0;
    evoPhase = "showing";
    evoTarget = Math.floor(Math.random() * EVO_TYPES);
    // 每種類型各 3 張，共 9 張，打亂
    evoCards = [];
    for(let t = 0; t < EVO_TYPES; t++){
      for(let n = 0; n < EVO_EACH; n++){
        evoCards.push(t);
      }
    }
    for(let i = evoCards.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [evoCards[i], evoCards[j]] = [evoCards[j], evoCards[i]];
    }
    // 顯示卡片顏色
    updateEvoCards(true);
    // 2 秒後翻牌
    if(evoFlipTimer) clearTimeout(evoFlipTimer);
    evoFlipTimer = setTimeout(() => {
      evoPhase = "playing";
      updateEvoCards(false);
    }, EVO_SHOW_MS);
    document.getElementById("trainingTimerDisplay").textContent = "";
    document.getElementById("trainingClickBtn").style.display = "none";
    document.getElementById("speedTrainingBtns").style.display = "none";
    document.getElementById("evoGrid").style.display = "flex";
    renderFrame();
    return;
  }

  // 開始倒數計時（UI 每秒更新）
  trainingCountdown = (trainingType === "life") ? 2 : 3;
  document.getElementById("trainingTimerDisplay").textContent = trainingCountdown;
  trainingTimer = setInterval(() => {
    if(!trainingMode) return; // 已退出訓練，立即停止
    trainingCountdown--;
    document.getElementById("trainingTimerDisplay").textContent = trainingCountdown;
    if(trainingCountdown <= 0){
      clearInterval(trainingTimer);
      trainingTimer = null;
      document.getElementById("trainingTimerDisplay").textContent = "";
      // 生命訓練：4 個點全消失 = 成功，否則失敗
      if(trainingType === "life"){
        if(lifePointsRemaining <= 0 && !lifeShieldBroken){
          triggerTrainingAttack();
        } else {
          triggerTrainingFailure();
        }
      } else {
        triggerTrainingFailure();
      }
    }
  }, 1000);

  renderFrame();
}

  }
  document.getElementById("trainingTimerDisplay").textContent = "";
  updateTrainingPointsDisplay();
  // 重置充能狀態
  trainingLevel = 0;
  trainingClickCount = 0;
  trainingPowerHidden = false;
  lifePhase = "play";
  // 爆擊訓練清理
  if(criticalBarTimer){
    clearInterval(criticalBarTimer);
    criticalBarTimer = null;
  }
  if(criticalAttackTimer){
    clearInterval(criticalAttackTimer);
    criticalAttackTimer = null;
  }
  criticalBarActive = false;
  // 閃避訓練清理
  if(evadeProjTimer){
    clearInterval(evadeProjTimer);
    evadeProjTimer = null;
  }
  evadePhase = "idle";

function clearTrainingState(){
  // 清理訓練狀態但不重置 canvas/bg（供直接切換到對戰使用）
  trainingMode = false;
  if(trainingProjectileTimer){ clearInterval(trainingProjectileTimer); trainingProjectileTimer = null; }
  if(trainingIdleTimer){ clearInterval(trainingIdleTimer); trainingIdleTimer = null; }
  if(sandbagTimer){ clearInterval(sandbagTimer); sandbagTimer = null; }
  if(boomTimer){ clearInterval(boomTimer); boomTimer = null; }
  if(trainingCelebrationTimer){ clearInterval(trainingCelebrationTimer); trainingCelebrationTimer = null; }
  if(trainingTimer){ clearInterval(trainingTimer); trainingTimer = null; }
  document.getElementById("trainingTimerDisplay").textContent = "";
  if(trainingFailureTimer){ clearInterval(trainingFailureTimer); trainingFailureTimer = null; }
  if(lifeBoxingTimer){ clearInterval(lifeBoxingTimer); lifeBoxingTimer = null; }
  if(lifeBoomTimer){ clearInterval(lifeBoomTimer); lifeBoomTimer = null; }
  if(lifeShieldHoldTimer){ clearTimeout(lifeShieldHoldTimer); lifeShieldHoldTimer = null; }
  if(lifeFailureHoldTimer){ clearTimeout(lifeFailureHoldTimer); lifeFailureHoldTimer = null; }
  if(criticalBarTimer){ clearInterval(criticalBarTimer); criticalBarTimer = null; }
  if(criticalAttackTimer){ clearInterval(criticalAttackTimer); criticalAttackTimer = null; }
  criticalBarActive = false;
  if(evadeProjTimer){ clearInterval(evadeProjTimer); evadeProjTimer = null; }
  evadePhase = "idle"; evadeProjX = -16; evadeSucceeded = false; evadeDragonFlipped = false;
  if(evadeInstructTimer){ clearInterval(evadeInstructTimer); evadeInstructTimer = null; }
  evadeInstructFrame = 0;
  clearSpeedTraining();
  clearEvoTraining();
  lifePhase = "play";
  document.getElementById("trainingDisplay").style.display = "none";
  // 訓練成功獎勵
  if(trainingSucceeded){
    trainingSucceeded = false;
    const statType = trainingTypeMap(trainingType);
    const res = tryTrainingSuccess(statType);
    if(res.success){ gameWeight = Math.max(1, gameWeight - 1); }
    updateStatsDisplay();
    updateTrainingPointsDisplay();
    saveGameState();
  }
}

  }
  if(trainingIdleTimer){
    clearInterval(trainingIdleTimer);

  }
  if(sandbagTimer){
    clearInterval(sandbagTimer);
    sandbagTimer = null;
  }
  if(boomTimer){
    clearInterval(boomTimer);
    boomTimer = null;
  }
  if(trainingCelebrationTimer){
    clearInterval(trainingCelebrationTimer);
    trainingCelebrationTimer = null;
  }
  if(trainingTimer){

  }

  }
  // 生命訓練成功動畫的計時器

    clearInterval(lifeBoxingTimer);

  }
  if(lifeBoomTimer){
    clearInterval(lifeBoomTimer);

  }

    clearTimeout(lifeShieldHoldTimer);
