function endBattle(result){
  battleResult = result;
  battleActive = false;
  if(battleAnimTimer){ clearInterval(battleAnimTimer); battleAnimTimer = null; }
  battleProjectileX = 0;
  battleProjectileActive = false;
  battleBoomActive = false;
  if(battleBoomTimer){ clearInterval(battleBoomTimer); battleBoomTimer = null; }
  battleIntro = false;
  if(battleIntroTimer){ clearInterval(battleIntroTimer); battleIntroTimer = null; }
  battlePlayerFrame = 0;
  battleEnemyFrame = 0;
  battlePlayerDodge = false;
  battleEnemyDodge = false;
  document.getElementById("adversityEvoBanner").style.display = "none";

  // 玩家有逆境進化 → 先播放玩家退化動畫
  if(battleAdversityEvoRow >= 0){
    runDevoAnim(result);
    return;
  }

  // 敵方有逆境進化 → 先播放敵方退化動畫
  if(battleEnemyAdversityEvoRow >= 0){
    runEnemyDevoAnim(result);
    return;
  }

  // 無逆境進化：直接顯示結果
  battleOriginalRow = -1;
  battleAdversityTries = 0;
  battleEvoState = "none";
  battleEvoStep = 0;
  battleEvoCallback = null;
  battleEnemyOriginalRow = -1;
  battleEnemyAdversityTries = 0;
  battleEnemyEvoState = "none";
  battleEnemyEvoStep = 0;
  battleEnemyEvoCallback = null;
  showBattleResult(result);
}

// 退化動畫：evolution.png 從上到下 → 退化 → 從下到上 → 結果
function runDevoAnim(result){
  battleActive = true; // 保持活躍以便渲染

  // Phase 1: evoDown - evolution.png 從上到下一格一格覆蓋我方龍
  battleEvoState = "evoDown";
  battleEvoStep = 0;
  document.getElementById("battleMsg").textContent = "恢復原形…";
  renderBattleScene();

  const downInterval = setInterval(() => {
    battleEvoStep++;
    renderBattleScene();
    if(battleEvoStep >= 16){
      clearInterval(downInterval);
      // 退化！訓練加成完整保留
      currentRow = battleOriginalRow;
      battleAdversityEvoRow = -1;
      battleOriginalRow = -1;
      battleAdversityTries = 0;
      battleEvoNextRow = -1;
      renderBattleScene();
      // Phase 2: evoUp - evolution.png 從下到上一格一格消失
      setTimeout(() => {
        battleEvoState = "evoUp";
        battleEvoStep = 16;
        const upInterval = setInterval(() => {
          battleEvoStep--;
          renderBattleScene();
          if(battleEvoStep <= 0){
            clearInterval(upInterval);
            battleEvoState = "none";
            battleEvoStep = 0;
            battleEvoCallback = null;
            // 敵方也有進化 → 繼續敵方退化
            if(battleEnemyAdversityEvoRow >= 0){
              runEnemyDevoAnim(result);
            } else {
              battleActive = false;
              renderBattleScene();
              showBattleResult(result);
            }
          }
        }, 50);
      }, 400);
    }
  }, 50);
}

// 敵方退化動畫：evolution.png 從上到下 → 退化 → 從下到上 → 結果
function runEnemyDevoAnim(result){
  battleActive = true; // 保持活躍以便渲染

  battleEnemyEvoState = "evoDown";
  battleEnemyEvoStep = 0;
  document.getElementById("battleMsg").textContent = "敵方恢復原形…";
  renderBattleScene();

  const downInterval = setInterval(() => {
    battleEnemyEvoStep++;
    renderBattleScene();
    if(battleEnemyEvoStep >= 16){
      clearInterval(downInterval);
      // 敵方退化！
      battleEnemyRow = battleEnemyOriginalRow;
      battleEnemyAdversityEvoRow = -1;
      battleEnemyOriginalRow = -1;
      battleEnemyAdversityTries = 0;
      battleEnemyEvoNextRow = -1;
      renderBattleScene();
      setTimeout(() => {
        battleEnemyEvoState = "evoUp";
        battleEnemyEvoStep = 16;
        const upInterval = setInterval(() => {
          battleEnemyEvoStep--;
          renderBattleScene();
          if(battleEnemyEvoStep <= 0){
            clearInterval(upInterval);
            battleEnemyEvoState = "none";
            battleEnemyEvoStep = 0;
            battleEnemyEvoCallback = null;
            // 重置所有進化狀態
            battleOriginalRow = -1;
            battleAdversityTries = 0;
            battleAdversityEvoRow = -1;
            battleEvoState = "none";
            battleEvoStep = 0;
            battleEvoCallback = null;
            battleActive = false;
            renderBattleScene();
            showBattleResult(result);
          }
        }, 50);
      }, 400);
    }
  }, 50);
}

// 顯示戰鬥結果 + 勝敗動畫 + 自動關閉
function showBattleResult(result){
  const panel = document.getElementById("battleDisplay");
  let msg = "";
  if(result === "win"){
    msg = "勝利！";
  } else if(result === "lose"){
    msg = "戰敗…";
  } else {
    msg = "退出對戰";
  }
  document.getElementById("battleMsg").textContent = msg;
  document.getElementById("battleAttackBtn").disabled = true;
  document.getElementById("battleRunBtn").disabled = true;

  // 勝敗動畫：勝利方 idle→happy ×2，失敗方 idle→sad ×2
  let endStep = 0;
  const endAnimTimer = setInterval(() => {
    if(endStep >= 4){
      clearInterval(endAnimTimer);
      battleShowHappy = false;
      battleShowSad = false;
      battleShowEnemySad = false;
      battleShowEnemyHappy = false;
      renderBattleScene();
      return;
    }
    if(result === "win"){
      battlePlayerFrame = (endStep % 2 === 0) ? 7 : 0;  // 我方 happy 表情
      battleShowHappy = (endStep % 2 === 0);              // Happy.png 圖標
      battleEnemyFrame = (endStep % 2 === 0) ? 10 : 0;   // 敵方 sad 表情
      battleShowEnemySad = (endStep % 2 === 0);           // sad.png 敵方圖標
    } else if(result === "lose"){
      battlePlayerFrame = (endStep % 2 === 0) ? 10 : 0;   // 我方 sad 表情
      battleShowSad = (endStep % 2 === 0);                // sad.png 圖標
      battleEnemyFrame = (endStep % 2 === 0) ? 7 : 0;     // 敵方 happy 表情
      battleShowEnemyHappy = (endStep % 2 === 0);          // Happy.png 敵方圖標
    }
    renderBattleScene();
    endStep++;
  }, 500);

  // 2 秒後自動關閉
  setTimeout(() => {
    clearInterval(endAnimTimer);  // 防止 step 4 畫戰場畫面
    panel.style.display = "none";
    canvas.width = CANVAS_NORMAL_W;
    canvas.height = 16;
    canvas.style.width = "";
    canvas.style.height = "";
    gameMode = "auto";
    battleResult = "";
    battleEnemyRow = -1;
    updateCssBackground("auto");
    startAutoPlay();
  }, 2000);
}

// ========== 圖鑑 ==========
function createMiniSprite(row, size){
  const c = document.createElement('canvas');
  c.width = 16; c.height = 16;
  const cx = c.getContext('2d');
  cx.imageSmoothingEnabled = false;
  cx.drawImage(rowImages[row], 0, 0, 16, 16, 0, 0, 16, 16);
  // 設 CSS 尺寸，保持畫素感
  c.style.width = size + 'px';
  c.style.height = size + 'px';
  return c;
}

function showDigidex(){
  const panel = document.getElementById("digidexDisplay");
  const statsPanel = document.getElementById("statsDisplay");
  const foodPanel = document.getElementById("foodDisplay");
  if(panel.style.display === "block"){ panel.style.display = "none"; return; }
  statsPanel.style.display = "none";
  foodPanel.style.display = "none";
  document.getElementById("trainingDisplay").style.display = "none";
  // 重置詳情視圖
  document.getElementById("digidexContent").style.display = "";
  document.getElementById("digidexDetail").style.display = "none";

  const container = document.getElementById("digidexContent");
  container.innerHTML = "";
  for(const stage of DIGIDEX_STAGES){
    const stageDiv = document.createElement('div');
    stageDiv.className = 'digidex-stage';

    const title = document.createElement('div');
    title.className = 'digidex-stage-title';
    title.textContent = stage.name;
    stageDiv.appendChild(title);

    const grid = document.createElement('div');
    grid.className = 'digidex-grid';

    for(const row of stage.rows){
      const entry = document.createElement('div');
      entry.className = 'digidex-entry';
      entry.style.cursor = row === -1 ? 'default' : 'pointer';
      if(row === -1){
        // 蛋：使用eggImage左邊16×16
        const c = document.createElement('canvas');
        c.width = 16; c.height = 16;
        const cx = c.getContext('2d');
        cx.imageSmoothingEnabled = false;
        cx.drawImage(eggImage, 0, 0, 16, 16, 0, 0, 16, 16);
        c.style.width = '48px'; c.style.height = '48px';
        entry.appendChild(c);
      } else {
        const sprite = createMiniSprite(row, 48);
        entry.appendChild(sprite);
      }
      const nameSpan = document.createElement('div');
      nameSpan.className = 'd-name';
      nameSpan.textContent = row === -1 ? "數碼蛋" : (ALL_NAMES[row] || `row_${String(row).padStart(2,'0')}`);
      entry.appendChild(nameSpan);
      // 點擊打開詳情頁(蛋無詳情)
      if(row !== -1){
        entry.addEventListener('click', (e) => {
          showDigidexDetail(row);
          e.stopPropagation();
        });
      }
      grid.appendChild(entry);
    }

    stageDiv.appendChild(grid);
    container.appendChild(stageDiv);
  }

  panel.style.display = "block";
}

function showDigidexDetail(row){
  if(row === -1) return; // 蛋無詳情頁
  const container = document.getElementById("digidexContent");
  const detailDiv = document.getElementById("digidexDetail");
  const s = DIGIMON_STATS[row];
  const name = ALL_NAMES[row] || `row_${String(row).padStart(2,'0')}`;
  
  // 隱藏列表，顯示詳情
  container.style.display = "none";
  
  const stageMap = {};
  let stageName = "—";
  for(const stage of DIGIDEX_STAGES){
    for(const r of stage.rows){
      stageMap[r] = stage.name;
    }
  }
  stageName = stageMap[row] || "—";
  
  detailDiv.innerHTML = `
    <canvas class="detail-sprite" id="detailSpriteCanvas" width="64" height="64"></canvas>
    <div class="detail-name">${name}</div>
    <div class="detail-row"><span>階段</span><span>${stageName}</span></div>
    <div class="detail-row"><span>屬性</span><span style="color:#ffcc00">${ATTR_CN[s.attr] || s.attr || "—"}</span></div>
    <div class="detail-row"><span>生命值</span><span>${s.hp}</span></div>
    <div class="detail-row"><span>攻擊力</span><span>${s.atk}</span></div>
    <div class="detail-row"><span>速度</span><span>${s.spd}</span></div>
    <div class="detail-row"><span>爆擊率</span><span>${Math.round(s.critRate * 100)}%</span></div>
    <div class="detail-row"><span>閃避率</span><span>${Math.round(s.dodgeRate * 100)}%</span></div>
    <div class="detail-row"><span>初始親密度</span><span>${s.bondInitial}</span></div>
    <button class="detail-back" id="digidexBackBtn">← 返回圖鑑</button>
  `;
  detailDiv.style.display = "block";
  
  // 繪製大圖
  const canvas = document.getElementById("detailSpriteCanvas");

  cx.imageSmoothingEnabled = false;
  cx.drawImage(rowImages[row], 0, 0, 16, 16, 0, 0, 64, 64);

  document.getElementById("digidexBackBtn").addEventListener('click', () => {
    detailDiv.style.display = "none";
    container.style.display = "";
  });
}

function feedDigimon(food){
  // 關閉食物面板與圖鑑面板
  document.getElementById("foodDisplay").style.display = "none";
  document.getElementById("digidexDisplay").style.display = "none";
  if(gameMode !== "auto") return; // 動畫進行中不可操作

  if(food === "meat"){
    if(gameHunger >= 10){
      // 拒絕：搖晃動畫
      gameMode = "refusing";
      gameModeStep = 0;
      if(autoMoveTimer){ clearInterval(autoMoveTimer); autoMoveTimer = null; }
      restartAnimTimer(REFUSE_IV);
      return;
    }
    gameHunger = Math.min(10, gameHunger + 1);
    gameWeight = Math.max(1, gameWeight + 1);       // 吃東西增加體重
    updateCallButton();
    // 進食：eat1/eat2 動畫，龍在右邊，食物從左到右
    gameMode = "eating";
    gameModeStep = 0;
    autoX = 14;
    autoTargetX = null;
    if(autoMoveTimer){ clearInterval(autoMoveTimer); autoMoveTimer = null; }
    restartAnimTimer(EAT_IV);
    saveGameState();
    renderFrame();
    console.log(`餵食: ${food}, 飽食度: ${gameHunger}`);
  }
}

// 睡眠時間設定
let sleepHour = 22; // 預設晚上10點睡覺
function initSleepHourSelect(){
  const sel = document.getElementById("sleepHourSelect");
  for(let h = 0; h < 24; h++){
    const opt = document.createElement("option");
    opt.value = h;
    opt.textContent = h + ":00";
    if(h === sleepHour) opt.selected = true;
    sel.appendChild(opt);
  }
  sel.onchange = () => {
    sleepHour = parseInt(sel.value);
    saveSettings();
    document.getElementById("settingsOverlay").classList.remove("open");
    updateSleepByTime(); // 立即反映設定變更
    const gh = new Date().getHours(); // 显示现实时间
    const wh = (sleepHour + 8) % 24;
    setTimeout(() => {
      showToast("睡眠設定：" + sleepHour + ":00~" + wh + ":00（目前遊戲時間 " + gh + ":00）");
    }, 300);
  };
}

// 儲存設定
function saveSettings(){
  localStorage.setItem("digivpet_settings", JSON.stringify({ soundEnabled, sleepHour, lightsOff }));
}
function loadSettings(){
  const raw = localStorage.getItem("digivpet_settings");
  if(raw){
    try {
      const s = JSON.parse(raw);
      soundEnabled = s.soundEnabled ?? true;
      sleepHour = s.sleepHour ?? 22;
      lightsOff = s.lightsOff ?? false;
    } catch(e){}
  }
  const tgl = document.getElementById("toggleSound");
  if(soundEnabled){
    tgl.classList.add("on");
  } else {
    tgl.classList.remove("on");
  }
  // 恢復關燈狀態
  const overlay = document.getElementById("darkOverlay");
  if(overlay && lightsOff){
    overlay.classList.add("on");
  }
}
loadSettings();
initSleepHourSelect();

// ========== 啟動 ==========
if("serviceWorker" in navigator){
  if(location.protocol === "file:"){
    console.warn("⚠️ 無法在 file:// 協定下註冊 Service Worker，請使用 HTTP/HTTPS 伺服器開啟");
  } else {
    navigator.serviceWorker.register("sw.js").then(() => {
      console.log("✅ Service Worker 註冊成功");
    }).catch(err => {
      console.warn("❌ SW 註冊失敗", err);
    });
  }
}
// 偵測 PWA 安裝提示（用於偵錯）
let deferredPrompt;
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;
  console.log("✅ Chrome 已觸發安裝條件（beforeinstallprompt）");
});

buildFunctionButtons();
loadGameState(); // 讀取存檔
updateSleepByTime(); // 根據存檔時間同步睡眠狀態
// 首次啟動時進入蛋時期
if(!localStorage.getItem(SAVE_KEY)){
  startEggPhase();
}

let loadedCount = 0;
const TOTAL_IMAGES = 18 + BG_NAMES.length + 1 + 15 + 1 + 14 + 3 + 3 + 4 + 1 + 1 + 1; // 18 row + 3 bg + 1 meat + 15 training + 1 evolution + 14 attack fireballs + 3 evo color icons + 5 battle scenes + 1 hp bar + 1 feces + 1 flushing + 1 egg
function onImageLoaded(){
  loadedCount++;
  if(loadedCount >= TOTAL_IMAGES) {
    generateHdBackgrounds(); // 生成高清像素背景
    if(isEggPhase){
      renderFrame(); // 蛋時期重繪一次（蛋圖片已加載）
    } else {
      selectDigimon(currentRow); // 還原上次選擇的數碼獸
    }
    // 離線進化補捉：圖片載入完成後觸發進化動畫
    if(evoAnimPending){
      evoAnimPending = false;
      startNaturalEvoAnim(getEvolutionRow(currentRow));
    }
  }
}
function onImageError(){
  onImageLoaded();
}

// 加載 18 張獨立行圖片
for(let r = 0; r < 18; r++){
  const img = new Image();
  const idx = String(r).padStart(2, '0');
  img.src = `sprites/row_${idx}.png`;
  img.onload = onImageLoaded;
  img.onerror = onImageError;
  rowImages[r] = img;
}

// 加載 14 張攻擊火球圖片 (00_at ~ 13_at，16×8 上半部)

  const img = new Image();
  const idx = String(r).padStart(2, '0');
  img.src = `sprites/Attack/${idx}_at.png`;
  img.onload = onImageLoaded;
  img.onerror = onImageError;
  attackRowImages[r] = img;
}

  const img = new Image();

  img.onload = onImageLoaded;
  img.onerror = onImageError;
  bgImages[name] = img;
});

// 每分鐘自動切換背景
setInterval(updateBgByTime, 60000);

// 數值計時器：年齡每分鐘 +1，每日疊加 12 訓練點，檢查階段進化
setInterval(() => { 
  if(isEggPhase) return; // 蛋時期不計時
  if(evoAnimActive) return; // 進化動畫期間不計時
  gameAge++;
  updateSleepByTime(); // 每分鐘檢查是否需要進入/離開睡眠
  // 黑球獸(row 0) 5分鐘後進化為滾球獸(row 1)
  if(currentRow === 0 && gameAge === 5 && !evoAnimActive){
    startNaturalEvoAnim(1);
    return;
  }
  // 滾球獸(row 1) 15分鐘後依育成失誤進化
  if(currentRow === 1 && gameAge === 15 && !evoAnimActive){
    startNaturalEvoAnim(getEvolutionRow(1));
    return;
  }
  const currentDay = Math.floor(gameAge / 1440);
  if(currentDay > gameAgeLastDay){
    gameAgeLastDay = currentDay;
    // 幼年期(0,1)不疊加訓練點，不檢查進化
    if(currentRow >= 2){
      gameTrainingPoints += 12;
      checkStageEvolution();
    }
  }
}, 60000);
// 飢餓：每 30 分鐘 -1 個心（10個心共 5 小時耗盡）
setInterval(() => { if(!isEggPhase){ gameHunger = Math.max(0, gameHunger - 1); updateCallButton(); } }, 1800000);
// 育成失誤檢查：CALL 出現超過 10 分鐘計 1 次，同個飢餓周期不重複計算
setInterval(() => {
  if(!isEggPhase && callFirstShownTime > 0 && !callMistakeRecorded && gameHunger === 0){
    if(Date.now() - callFirstShownTime >= 600000){
      gameCareMistakes++;
      callMistakeRecorded = true;
    }
  }
}, 5000);

// 定時自動存檔（每 30 秒）
setInterval(saveGameState, 30000);
// 頁面關閉/重新整理時存檔
window.addEventListener("beforeunload", saveGameState);

// 訓練按鈕事件綁定
document.getElementById("trainingClickBtn").onclick = handleTrainingClick;
document.getElementById("trainingBackBtn").onclick = stopTraining;
const trainingHelpTexts = {
  attack: '<div style="font-weight:700;color:#ffcc00;margin-bottom:4px;">📖 攻擊訓練</div><div>倒數結束前點擊「點擊」按鈕蓄力，每 2 次點擊向右移動 1 格，全滿後龍會自動發射火球攻擊沙包！</div>',
  life: '<div style="font-weight:700;color:#ffcc00;margin-bottom:4px;">📖 生命訓練</div><div>倒數結束前點擊消除盾牌上的紅色點數，全部消除且沒打中盾牌即成功！</div>',
  critical: '<div style="font-weight:700;color:#ffcc00;margin-bottom:4px;">📖 爆擊訓練</div><div>爆擊條從左到右來回移動，在最右格時點擊即成功擊碎牆壁！</div>',
  evade: '<div style="font-weight:700;color:#ffcc00;margin-bottom:4px;">📖 閃避訓練</div><div>飛彈從左方飛來，在飛彈碰到 instruct（x=40）時點擊即可閃避成功！<br>太早或太晚點擊都會失敗！</div>',
  speed: '<div style="font-weight:700;color:#ffcc00;margin-bottom:4px;">📖 速度訓練 +0.04</div><div>螢幕左側顯示 "→ABABAB" 隨機序列，<br>依序從左到右按下對應的 A（紅色）或 B（藍色）按鈕！<br>全部答對即成功，龍會往左走到最左再回到中央開心！<br>按錯即失敗。</div>',
  affinity: '<div style="font-weight:700;color:#ffcc00;margin-bottom:4px;">📖 親密度訓練</div><div>9 張卡片中分為紅/藍/綠 3 組，每組 3 張！<br>先記憶 2 秒，翻牌後根據右側顯示的目標顏色，<br>找出 3 張相同顏色的卡片即成功！<br>點錯即失敗。<br><span style="color:#4caf50;">成功 +1 親密度</span></div>'
};
document.querySelectorAll(".help-icon").forEach(el => {
  el.onclick = (e) => {
    e.stopPropagation();
    const popup = document.getElementById("trainingHelpPopup");
    popup.innerHTML = trainingHelpTexts[el.dataset.mode] + '<div style="text-align:right;margin-top:6px;"><button onclick="document.getElementById(\'trainingHelpPopup\').style.display=\'none\'" style="background:#555;color:#fff;border:none;border-radius:3px;padding:2px 10px;font-size:11px;cursor:pointer;">關閉</button></div>';
    popup.style.display = "block";
  };
});
["trainingModeAttack","trainingModeLife","trainingModeCritical","trainingModeEvade","trainingModeSpeed","trainingModeEvo"].forEach(id => {
  const btn = document.getElementById(id);
  btn.onclick = (e) => {
    if(e.target.classList.contains("help-icon")) return;
    const mode = btn.dataset.mode;
    selectTrainingType(mode);
  };
});
document.getElementById("trainingModeBackBtn").onclick = backToTrainingModeSelect;
document.getElementById("speedBtnA").onclick = () => handleSpeedClick("A");
document.getElementById("speedBtnB").onclick = () => handleSpeedClick("B");
document.querySelectorAll(".evo-card").forEach(card => {
  card.onclick = () => handleEvoClick(parseInt(card.getAttribute("data-idx")));
});

// 對戰按鈕事件綁定
document.getElementById("battleAttackBtn").onclick = handleBattleAttack;
document.getElementById("battleRunBtn").onclick = () => {
  // 攻擊進行中不允許退出
  if(battleProjectileActive || battleBoomActive || battleIntro || battleResult || battleEvoState !== "none" || battleEnemyEvoState !== "none") return;
  endBattle("run");
};
