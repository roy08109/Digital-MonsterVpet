  }
  if(lifeFailureHoldTimer){
    clearTimeout(lifeFailureHoldTimer);
    lifeFailureHoldTimer = null;
  }
  // 爆擊訓練計時器
  if(criticalBarTimer){
    clearInterval(criticalBarTimer);
    criticalBarTimer = null;
  }
  if(criticalAttackTimer){
    clearInterval(criticalAttackTimer);
    criticalAttackTimer = null;
  }
  criticalBarActive = false;
  // 閃避訓練清理
  if(evadeProjTimer){
    clearInterval(evadeProjTimer);
    evadeProjTimer = null;
  }
  evadePhase = "idle";
  evadeProjX = -16;
  evadeSucceeded = false;
  evadeDragonFlipped = false;
  if(evadeInstructTimer){ clearInterval(evadeInstructTimer); evadeInstructTimer = null; }
  evadeInstructFrame = 0;
  // 攻速訓練清理
  clearSpeedTraining();
  // 特殊進化訓練清理
  clearEvoTraining();
  lifePhase = "play";
  document.getElementById("trainingDisplay").style.display = "none";
  // 訓練成功獎勵：使用統一訓練系統
  if(trainingSucceeded){
    trainingSucceeded = false;
    const statType = trainingTypeMap(trainingType);
    const res = tryTrainingSuccess(statType);
    if(res.success){
      gameWeight = Math.max(1, gameWeight - 1); // 訓練減肥
    }
    updateStatsDisplay();
    updateTrainingPointsDisplay();
    saveGameState();
  }
  // 恢復 canvas 尺寸
  canvas.width = CANVAS_NORMAL_W;
  canvas.style.width = "";
  // 恢復時間段背景
  updateCssBackground("auto");
  // 恢復自動模式
  startAutoPlay();
}

function handleTrainingClick(){
  if(trainingAttackActive) return;  // 攻擊動畫中不可操作
  if(trainingCelebrationActive) return; // 慶祝中不可操作
  if(trainingFailed || trainingFailureActive) return; // 失敗後不可再點
  
  // 生命訓練邏輯
  if(trainingType === "life"){
    if(lifeShieldBroken) return;
    if(lifePointsRemaining <= 0){
      // 點完所有 point 再點 → 盾牌破壞 = 失敗
      lifeShieldBroken = true;
      if(trainingTimer){
        clearInterval(trainingTimer);
        trainingTimer = null;
      }
      document.getElementById("trainingTimerDisplay").textContent = "";
      triggerTrainingFailure();
      return;
    }
    lifePointsRemaining--;
    renderFrame();
    return;
  }

  // 爆擊訓練：停止 bar，判定成敗
  if(trainingType === "critical"){
    if(!criticalBarActive) return;
    stopCriticalBar();
    return;
  }

  // 閃避訓練：飛彈碰到 instruct 即成功
  if(trainingType === "evade"){
    if(evadePhase !== "moving") return;
    // 成功區間：飛彈頭（右側）碰到 instruct（x=40~48）
    if(evadeProjX >= 24 && evadeProjX <= 32){
      evadePhase = "success";
      evadeSucceeded = true;
      evadeDragonFlipped = true;  // 成功後龍面向右
      clearInterval(evadeProjTimer);
      evadeProjTimer = null;
      // 飛彈穿過（繼續往右飛出畫面消失）
      const finishTimer = setInterval(() => {
        evadeProjX += 2;
        if(evadeProjX >= 64){
          clearInterval(finishTimer);
          evadePhase = "done";
          startEvadeCelebration();
        }
        renderFrame();
      }, 30);
    } else {
      // 不在躲避區點擊 = 失敗
      evadePhase = "failure";
      evadeSucceeded = false;
      clearInterval(evadeProjTimer);
      evadeProjTimer = null;
      triggerTrainingFailure();
    }
    return;
  }
  
  trainingClickCount++;
  // 每2次點擊向右移動1格
  if(trainingClickCount % 2 === 0){
    trainingLevel++;
    if(trainingLevel >= TRAIN_SLOTS){
      // 成功滿能 → 清除計時器，觸發攻擊
      if(trainingTimer){
        clearInterval(trainingTimer);
        trainingTimer = null;
      }
      document.getElementById("trainingTimerDisplay").textContent = "";
      triggerTrainingAttack();
      return;
    }
  }
  renderFrame();
}

function triggerTrainingAttack(){
  trainingSucceeded = true;
  trainingAttackActive = true;
  trainingLevel = 6;
  // 確保計時器清除
  if(trainingTimer){
    clearInterval(trainingTimer);
    trainingTimer = null;
  }
  document.getElementById("trainingTimerDisplay").textContent = "";
  // 攻擊時停止 idle 與沙包動畫
  if(trainingIdleTimer){
    clearInterval(trainingIdleTimer);
    trainingIdleTimer = null;
  }
  if(sandbagTimer){
    clearInterval(sandbagTimer);
    sandbagTimer = null;
  }

  // 生命訓練：新的成功動畫序列（boxing → boom → shield 完好 → 龍移動 happy）
  if(trainingType === "life"){
    startLifeSuccessAnimation();
    return;
  }

  trainingProjectileX = 16;
  renderFrame();
  
  // 火球連續每像素向左移動
  trainingProjectileTimer = setInterval(() => {
    if(!trainingMode) return;
    trainingProjectileX -= 1;
    renderFrame();
    if(trainingProjectileX <= 0){
      // 火球擊中沙包 → 停止移動、觸發爆炸
      clearInterval(trainingProjectileTimer);
      trainingProjectileTimer = null;
      trainingAttackActive = false;
      startBoomSequence();
    } else if(trainingProjectileX < -16){
      // 防護：若直接飛過頭則重置
      clearInterval(trainingProjectileTimer);
      trainingProjectileTimer = null;
      trainingAttackActive = false;
      endTrainingAttack();
    }
  }, 16);
}

function startBoomSequence(){
  // 切換到爆炸狀態
  sandbagState = "boom";
  boomFrame = 0;
  boomCycle = 0;
  renderFrame();
  
  // 每 200ms 切換爆炸幀，2 週期後結束
  boomTimer = setInterval(() => {
    if(!trainingMode) return;
    boomFrame = boomFrame === 0 ? 1 : 0;
    if(boomFrame === 0){
      boomCycle++; // 完成一個完整週期 (01→02)
    }
    if(boomCycle >= 2){
      clearInterval(boomTimer);
      boomTimer = null;
      // 爆炸結束 → 換成被打中的沙包
      sandbagState = "hit";
      renderFrame();
      endTrainingAttack();
      return;
    }
    renderFrame();
  }, 200);
}

function endTrainingAttack(){
  // 攻擊/爆炸完成的清理與重置
  trainingLevel = 0;
  trainingClickCount = 0;
  trainingProjectileX = 0;
  trainingAttackActive = false;
  trainingPowerHidden = true;

  // 停止 idle 定時器（若有）
  if(trainingIdleTimer){
    clearInterval(trainingIdleTimer);
    trainingIdleTimer = null;
  }

  // 開始慶祝動畫：idle → happy → idle → happy
  trainingCelebrationActive = true;
  trainingCelebrationStep = 0;
  trainingCelebrationTimer = setInterval(() => {
    if(!trainingMode) return;
    trainingCelebrationStep++;
    if(trainingCelebrationStep >= TRAINING_CELEBRATION_SEQ.length){
      // 慶祝結束，自動返回
      clearInterval(trainingCelebrationTimer);
      trainingCelebrationTimer = null;
      trainingCelebrationActive = false;
      stopTraining();
    }
    renderFrame();
  }, 600);

  renderFrame();
}

function triggerTrainingFailure(){
  if(trainingAttackActive) return;  // 攻擊中不算失敗
  if(trainingFailed) return;       // 已經失敗了
  if(trainingLevel >= TRAIN_SLOTS) return; // 已滿不算
  if(trainingFailureActive) return;

  // 確保計時器已清除
  if(trainingTimer){
    clearInterval(trainingTimer);
    trainingTimer = null;
  }
  document.getElementById("trainingTimerDisplay").textContent = "";

  trainingFailed = true;
  trainingFailureActive = true;
  trainingPowerHidden = true;

  // 停止 Idle 動畫
  if(trainingIdleTimer){
    clearInterval(trainingIdleTimer);
    trainingIdleTimer = null;
  }

  // 生命訓練：先等 1 秒（盾牌完好），龍再移動到盾牌位置 + SAD
  if(trainingType === "life"){
    lifePhase = "failureHold";      // 等 1 秒，龍在 x=48，盾牌完好
    renderFrame();
    lifeFailureHoldTimer = setTimeout(() => {
      lifeFailureHoldTimer = null;
      lifePhase = "failure";        // 盾牌隱藏，龍移到盾牌位置
      lifeDragonMoveX = 32;
      // 開始 SAD 動畫
      trainingFailureStep = 0;
      trainingFailureTimer = setInterval(() => {
        if(!trainingMode) return;
        trainingFailureStep++;
        if(trainingFailureStep >= TRAINING_FAILURE_SEQ.length){
          clearInterval(trainingFailureTimer);
          trainingFailureTimer = null;
          trainingFailureActive = false;
          trainingFailed = false;
          stopTraining();
        }
        renderFrame();
      }, 600);
      renderFrame();
    }, 1000);
    return;
  }

  // 其他訓練：直接失敗動畫
  trainingFailureStep = 0;
  trainingFailureTimer = setInterval(() => {
    if(!trainingMode) return;
    trainingFailureStep++;
    if(trainingFailureStep >= TRAINING_FAILURE_SEQ.length){
      clearInterval(trainingFailureTimer);
      trainingFailureTimer = null;
      trainingFailureActive = false;
      trainingFailed = false;
      stopTraining();
    }
    renderFrame();
  }, 600);

  renderFrame();
}

// ========== 生命訓練成功動畫 ==========
function startLifeSuccessAnimation(){
  trainingSucceeded = true;
  // 確保計時器清除
  if(trainingTimer){
    clearInterval(trainingTimer);
    trainingTimer = null;
  }
  document.getElementById("trainingTimerDisplay").textContent = "";
  if(trainingCelebrationTimer){
    clearInterval(trainingCelebrationTimer);
    trainingCelebrationTimer = null;
  }
  trainingCelebrationActive = false;
  trainingCelebrationStep = 0;
  trainingPowerHidden = true;

  // 龍保持原本位置 x=48
  lifeDragonMoveX = 48;

  // 階段 1: boxing 從最左一格一格向右移動到盾牌
  lifePhase = "boxing";
  lifeBoxingX = 0;
  renderFrame();

  let boxingStepCount = 0;
  lifeBoxingTimer = setInterval(() => {
    if(!trainingMode) return;
    boxingStepCount++;
    if(boxingStepCount >= 32){
      // 已到達盾牌位置 (x=32)，切到 BOOM 階段
      clearInterval(lifeBoxingTimer);
      lifeBoxingTimer = null;
      lifePhase = "boom";
      startLifeBoom();
    } else {
      lifeBoxingX += 1; // 每次移動 1 像素
      renderFrame();
    }
  }, 30);
}

function startLifeBoom(){
  // 顯示 BOOM 動畫覆蓋盾牌位置
  boomFrame = 0;
  boomCycle = 0;
  renderFrame();

  lifeBoomTimer = setInterval(() => {
    if(!trainingMode) return;
    boomFrame = boomFrame === 0 ? 1 : 0;
    if(boomFrame === 0) boomCycle++;
    if(boomCycle >= 2){
      // BOOM 結束 → 盾牌完好顯示 1 秒
      clearInterval(lifeBoomTimer);
      lifeBoomTimer = null;
      lifePhase = "shieldHold";
      renderFrame();
      lifeShieldHoldTimer = setTimeout(() => {
        lifeShieldHoldTimer = null;
        // 盾牌隱藏，龍移動到盾牌位置 + happy
        lifePhase = "celebration";
        startLifeCelebration();
      }, 1000);
      return;
    }
    renderFrame();
  }, 200);
}

function startLifeCelebration(){
  lifeDragonMoveX = 48;
  trainingCelebrationActive = true;
  trainingCelebrationStep = 0;
  trainingAttackActive = false; // 慶祝階段由 trainingCelebrationActive 阻擋操作

  trainingCelebrationTimer = setInterval(() => {
    if(!trainingMode) return;
    trainingCelebrationStep++;
    // 龍在慶祝過程中從 x=48 移動到 x=32（盾牌位置，從右到左第2個16×16）
    if(trainingCelebrationStep === 1) lifeDragonMoveX = 32;       // 第1下 happy 就到盾牌位置
    else if(trainingCelebrationStep >= 2) lifeDragonMoveX = 32;   // 停留

    if(trainingCelebrationStep >= TRAINING_CELEBRATION_SEQ.length){
      clearInterval(trainingCelebrationTimer);
      trainingCelebrationTimer = null;
      trainingCelebrationActive = false;
      stopTraining();
      return;
    }
    renderFrame();
  }, 600);
  renderFrame();
}

// ========== 爆擊訓練函數 ==========
function startCriticalBar(){
  criticalPos = 0;
  criticalDirection = 1;
  criticalBarActive = true;
  criticalPaused = false;
  renderFrame();

  criticalBarTimer = setInterval(() => {
    if(!criticalBarActive) return;
    if(criticalPaused) return; // 端點暫停中，等 timeout 恢復

    criticalPos += criticalDirection;

    if(criticalPos > 3){
      // 到最右邊 (x=48)，暫停 1 秒後左移
      criticalPos = 3;
      criticalPaused = true;
      renderFrame();
      setTimeout(() => {
        criticalPaused = false;
        criticalDirection = -1;
        criticalPos = 2;
        renderFrame();
      }, 400);
      return;
    } else if(criticalPos < 0){
      // 到最左邊 (x=0)，立即右移
      criticalPos = 0;
      criticalDirection = 1;
      criticalPos = 1;
      renderFrame();
      return;
    }
    renderFrame();
  }, 150);
}

function stopCriticalBar(){
  criticalBarActive = false;
  if(criticalBarTimer){
    clearInterval(criticalBarTimer);
    criticalBarTimer = null;
  }
  if(criticalPos === 3){
    // 停在最右 → 成功！雙上下攻擊
    startCriticalSuccessAnimation();
  } else {
    // 沒對準 → 失敗
    if(trainingTimer){
      clearInterval(trainingTimer);
      trainingTimer = null;
    }
    document.getElementById("trainingTimerDisplay").textContent = "";
    triggerTrainingFailure();
  }
}

function startCriticalSuccessAnimation(){
  trainingSucceeded = true;
  // 成功：龍在 x=32 發射雙火球 → 抵達牆後 BOOM → 牆變 broken → 慶祝
  trainingAttackActive = true;
  criticalAttackStep = 16;  // 火球起始 x 位置
  criticalWallBroken = false;
  renderFrame();

  // Phase 1：火球從 x=16 一格一格向左移動到牆（16ms 每格）
  criticalAttackTimer = setInterval(() => {
    if(!trainingMode) return;
    criticalAttackStep -= 1;
    if(criticalAttackStep <= 0){
      // 火球抵達牆，切到 Phase 2：BOOM 動畫
      clearInterval(criticalAttackTimer);
      boomFrame = 0;
      boomCycle = 0;
      renderFrame();

      criticalAttackTimer = setInterval(() => {
        if(!trainingMode) return;
        boomFrame = boomFrame === 0 ? 1 : 0;
        if(boomFrame === 0) boomCycle++;
        if(boomCycle >= 2){
          // BOOM 結束 → 牆變 broken → 慶祝
          clearInterval(criticalAttackTimer);
          criticalAttackTimer = null;
          criticalWallBroken = true;
          trainingAttackActive = false;
          endTrainingAttack();
          return;
        }
        renderFrame();
      }, 200);
      return;
    }
    renderFrame();
  }, 16);
}

// ========== 閃避訓練函式 ==========
function startEvadeProjectile(){
  // instruct 3幀循環固定 x=40（每200ms切換一幀）
  evadeInstructFrame = 0;
  if(evadeInstructTimer){ clearInterval(evadeInstructTimer); }
  evadeInstructTimer = setInterval(() => {
    evadeInstructFrame = (evadeInstructFrame + 1) % 3;
    renderFrame();
  }, 200);

  // 飛彈移動（從左往右，每20ms移動1像素）
  evadeProjTimer = setInterval(() => {
    if(!trainingMode) return;
    evadeProjX += 1;
    if(evadeProjX >= 48){
      // 飛彈到達龍的位置而沒被閃避 → 失敗（被擊中）
      clearInterval(evadeProjTimer);
      evadeProjTimer = null;
      if(evadeInstructTimer){ clearInterval(evadeInstructTimer); evadeInstructTimer = null; }
      if(evadePhase === "moving"){
        evadePhase = "failure";
        evadeSucceeded = false;
        triggerTrainingFailure();
      }
    }
    renderFrame();
  }, 30);
}

function startEvadeCelebration(){
  trainingSucceeded = true;
  // 清除計時器
  if(trainingTimer){ clearInterval(trainingTimer); trainingTimer = null; }
  document.getElementById("trainingTimerDisplay").textContent = "";
  if(trainingCelebrationTimer){ clearInterval(trainingCelebrationTimer); trainingCelebrationTimer = null; }
  trainingCelebrationActive = false;
  trainingCelebrationStep = 0;
  trainingPowerHidden = true;
  trainingAttackActive = false;

  trainingCelebrationActive = true;
  trainingCelebrationStep = 0;
  trainingCelebrationTimer = setInterval(() => {
    if(!trainingMode) return;
    trainingCelebrationStep++;
    if(trainingCelebrationStep >= TRAINING_CELEBRATION_SEQ.length){
      clearInterval(trainingCelebrationTimer);
      trainingCelebrationTimer = null;
      trainingCelebrationActive = false;
      trainingCelebrationStep = 0;
      stopTraining();
    }
    renderFrame();
  }, 600);
  renderFrame();
}

// ========== 攻速訓練函數 ==========
function handleSpeedClick(btn){
  if(!speedActive || speedMovePhase !== "") return;
  if(btn === speedSequence[speedCurrentIndex]){
    // 正確：顯示正確指示器並前進到下一個字母
    const justCorrectIdx = speedCurrentIndex;
    speedCorrectFlashAt = justCorrectIdx;
    if(speedCorrectFlashTimer){ clearTimeout(speedCorrectFlashTimer); }
    speedCorrectFlashTimer = setTimeout(() => {
      speedCorrectFlashAt = -1;
      speedCorrectFlashTimer = null;
      renderFrame();
    }, 400);
    speedCurrentIndex++;
    if(speedCurrentIndex >= SPEED_SEQ_COUNT){
      // 全部正確！停止倒數並開始龍向左走的成功動畫
      speedActive = false;
      if(speedCountdownTimer){ clearInterval(speedCountdownTimer); speedCountdownTimer = null; }
      document.getElementById("trainingTimerDisplay").textContent = "";
      document.getElementById("speedTrainingBtns").style.display = "none";
      document.getElementById("trainingClickBtn").style.display = "";
      startSpeedWalkAnimation();
    }
    renderFrame();
  } else {
    // 錯誤 → 立刻失敗，龍移到 x=32
    clearSpeedTraining();
    speedDragonX = 32;
    triggerTrainingFailure();
  }
}

function startSpeedWalkAnimation(){
  trainingSucceeded = true;
  // 第一階段：龍從 x=48 一格一格往左走到 x=0
  speedMovePhase = "movingLeft";
  speedDragonX = 48;
  if(speedMoveTimer){ clearInterval(speedMoveTimer); }
  speedMoveTimer = setInterval(() => {
    speedDragonX--;
    renderFrame();
    if(speedDragonX <= 0){
      // 走到最左，開始返回
      clearInterval(speedMoveTimer);
      speedMovePhase = "returning";
      speedMoveTimer = setInterval(() => {
        speedDragonX++;
        renderFrame();
        if(speedDragonX >= 32){
          // 回到 x=32，顯示 happy
          clearInterval(speedMoveTimer);
          speedMoveTimer = null;
          speedMovePhase = "done";
          // 開始慶祝動畫
          trainingCelebrationActive = true;
          trainingCelebrationStep = 0;
          trainingCelebrationTimer = setInterval(() => {
            if(!trainingMode) return;
            trainingCelebrationStep++;
            if(trainingCelebrationStep >= TRAINING_CELEBRATION_SEQ.length){
              clearInterval(trainingCelebrationTimer);
              trainingCelebrationTimer = null;
              trainingCelebrationActive = false;
              stopTraining();
            }
            renderFrame();
          }, 600);
          renderFrame();
        }
      }, 15);
    }
  }, 15);
}

function clearSpeedTraining(){
  speedActive = false;
  speedMovePhase = "";
  speedCurrentIndex = 0;
  speedSequence = [];
  speedDragonX = 48;
  speedCorrectFlashAt = -1;
  if(speedMoveTimer){ clearInterval(speedMoveTimer); speedMoveTimer = null; }
  if(speedCorrectFlashTimer){ clearTimeout(speedCorrectFlashTimer); speedCorrectFlashTimer = null; }
  if(speedCountdownTimer){ clearInterval(speedCountdownTimer); speedCountdownTimer = null; }
  document.getElementById("trainingTimerDisplay").textContent = "";
  document.getElementById("trainingClickBtn").style.display = "";
  document.getElementById("speedTrainingBtns").style.display = "none";
  document.getElementById("evoGrid").style.display = "none";
}

// ========== 特殊進化訓練函數 ==========
function updateEvoCards(show){
  const cards = document.querySelectorAll(".evo-card");
  cards.forEach(card => {
    const idx = parseInt(card.getAttribute("data-idx"));
    const type = evoCards[idx];
    card.className = "evo-card";
    card.style.backgroundImage = ""; // 清除上局殘留的 inline style
    card.style.backgroundSize = "";
    card.style.backgroundPosition = "";
    if(show){
      // 顯示顏色
      card.classList.add("evo-card-type-"+type);
      card.textContent = "";
    } else {
      // 翻牌（背面）
      card.classList.add("flipped");
      card.textContent = "?";
    }
  });
}

function handleEvoClick(idx){
  if(!evoActive || evoPhase !== "playing") return;
  const card = document.querySelector(`.evo-card[data-idx="${idx}"]`);
  if(!card || card.classList.contains("found")) return;
  const type = evoCards[idx];
  if(type === evoTarget){
    // 正確！
    evoFound++;
    card.classList.add("found");
    card.textContent = "✓";
    card.style.backgroundImage = "url('" + EVO_COLOR_IMGS[type] + "')";
    card.style.backgroundSize = "cover";
    card.style.backgroundPosition = "center";
    if(evoFound >= EVO_EACH){
      // 全部找到 → 成功
      trainingSucceeded = true;
      evoActive = false;
      evoPhase = "success";
      if(evoFlipTimer){ clearTimeout(evoFlipTimer); evoFlipTimer = null; }
      document.getElementById("trainingTimerDisplay").textContent = "";
      document.getElementById("trainingClickBtn").style.display = "none";
      updateEvoCards(true);
      // 親密度訓練成功：簡單慶祝動畫
      trainingCelebrationActive = true;
      trainingCelebrationStep = 0;
      if(evoEvolutionTimer){ clearInterval(evoEvolutionTimer); }
      evoEvolutionTimer = setInterval(() => {
        if(!trainingMode){ return; }
        trainingCelebrationStep++;
        if(trainingCelebrationStep >= TRAINING_CELEBRATION_SEQ.length){
          clearInterval(evoEvolutionTimer);
          evoEvolutionTimer = null;
          trainingCelebrationActive = false;
          stopTraining();
          return;
        }
        renderFrame();
      }, EVO_SEQ_INTERVAL * 3);
      renderFrame();
    }
  } else {
    // 錯誤 → 立刻失敗
    // 顯示錯誤卡片原圖
    card.style.backgroundImage = "url('" + EVO_COLOR_IMGS[type] + "')";
    card.style.backgroundSize = "cover";
    card.style.backgroundPosition = "center";
    card.textContent = "✗";
    clearEvoTraining();
    triggerTrainingFailure();
  }
}

function clearEvoTraining(){
  evoActive = false;
  evoPhase = "";
  evoCards = [];
  evoFound = 0;
  evoTarget = -1;
  if(evoFlipTimer){ clearTimeout(evoFlipTimer); evoFlipTimer = null; }
  if(evoEvolutionTimer){ clearInterval(evoEvolutionTimer); evoEvolutionTimer = null; }
  evoEvolutionActive = false;
  evoEvolutionStep = 0;
  evoEvolvePhase = "";
  evoNewRow = -1;
  evoOldRow = -1;
  evoMissileX = 16;
  document.getElementById("trainingTimerDisplay").textContent = "";
  document.getElementById("trainingClickBtn").style.display = "";
  document.getElementById("evoGrid").style.display = "none";
}

function renderTrainingCanvas(){
  ctx.clearRect(0, 0, CANVAS_TRAIN_W, 16);

  // 龍幀選擇：慶祝/失敗/攻擊/平時
  let dragonFrame;
  if(trainingFailureActive){
    dragonFrame = TRAINING_FAILURE_SEQ[trainingFailureStep];
  } else if(trainingCelebrationActive){
    const idx = trainingType === "affinity" ? trainingCelebrationStep % TRAINING_CELEBRATION_SEQ.length : trainingCelebrationStep;
    dragonFrame = TRAINING_CELEBRATION_SEQ[idx];
  } else if(trainingAttackActive && trainingType !== "life"){
    dragonFrame = 11;
  } else {
    dragonFrame = trainingIdleFrame;
  }

  if(trainingType === "life"){
    // 生命訓練：根據 lifePhase 決定顯示
    // 計算龍當前 x 位置（慶祝/失敗 sad 時在盾牌位置 x=32，其餘固定 x=48）
    const lifeDragonX = (lifePhase === "celebration" || lifePhase === "failure") ? lifeDragonMoveX : 48;

    // 盾牌 / BOOM 顯示
    if(lifePhase === "boom"){
      // 階段 2: BOOM 動畫覆蓋盾牌位置
      const bImg = boomFrame === 0 ? boomImage : boomImage2;
      if(bImg.complete && bImg.naturalWidth > 0){
        ctx.drawImage(bImg, 32, 0, 16, 16);
      }
    } else if(lifePhase === "celebration" || lifePhase === "failure"){
      // 階段 5: 盾牌隱藏（慶祝 / 失敗 SAD 時）
    } else {
      // 階段 play / boxing / shieldHold：顯示盾牌
      const shieldImg = lifeShieldBroken ? shieldBreakImage : shieldImage;
      if(shieldImg.complete && shieldImg.naturalWidth > 0){
        ctx.drawImage(shieldImg, 32, 0, 16, 16);
      }
      // 僅 play 階段顯示剩餘 point
      if(lifePhase === "play" && !lifeShieldBroken && pointImage.complete && pointImage.naturalWidth > 0){
        const positions = [
          [32, 0], // 上左
          [40, 0], // 上右
          [32, 8], // 下左
          [40, 8], // 下右
        ];
        for(let i = 0; i < lifePointsRemaining && i < 4; i++){
          ctx.drawImage(pointImage, positions[i][0], positions[i][1], 8, 8);
        }
      }
    }

    // 顯示 boxing 圖（僅 boxing 階段）
    if(lifePhase === "boxing" && boxingImage.complete && boxingImage.naturalWidth > 0){
      ctx.drawImage(boxingImage, lifeBoxingX, 0, 16, 16);
    }

    // 龍（跟隨 lifeDragonX，慶祝時從 48 移動到 32）
    if(rowImages[currentRow] && rowImages[currentRow].complete && rowImages[currentRow].naturalWidth > 0){
      ctx.drawImage(
        rowImages[currentRow],
        dragonFrame * PITCH, 0,
        16, 16,
        lifeDragonX, 0,
        16, 16
      );
    }

    // 慶祝時 happy icons（固定位置 x=24, x=48，與攻擊訓練相同）
    if(trainingCelebrationActive && happyImage.complete && happyImage.naturalWidth > 0
       && TRAINING_CELEBRATION_SEQ[trainingCelebrationStep] === 7){
      ctx.drawImage(happyImage, 24, 0, 8, 8);
      ctx.drawImage(happyImage, 48, 0, 8, 8);
    }
    // 失敗時 sad icons（固定位置 x=24, x=48，與攻擊訓練相同）
    if(trainingFailureActive && sadImage.complete && sadImage.naturalWidth > 0
       && TRAINING_FAILURE_SEQ[trainingFailureStep] === 10){
      ctx.drawImage(sadImage, 24, 0, 8, 8);
      ctx.drawImage(sadImage, 24, 8, 8, 8);
      ctx.drawImage(sadImage, 48, 0, 8, 8);
      ctx.drawImage(sadImage, 48, 8, 8, 8);
    }
    return;
  }

  // 爆擊訓練：顯示 牆 + bar + 龍
  if(trainingType === "critical"){
    // 牆在最左 x=0（破壞後顯示 Wall broken）
    const wImg = criticalWallBroken ? wallBrokenImage : wallImage;
    if(wImg.complete && wImg.naturalWidth > 0){
      ctx.drawImage(wImg, 0, 0, 16, 16);
    }

    // Critical Hit Bar 放在最右 x=48，根據 criticalPos 顯示對應的 cell
    // 慶祝（happy）或失敗（sad）時隱藏
    if(!trainingCelebrationActive && !trainingFailureActive && criticalBarImage.complete && criticalBarImage.naturalWidth > 0){
      ctx.drawImage(criticalBarImage, criticalPos * 16, 0, 16, 16, 48, 0, 16, 16);
    }

    // 成功動畫：雙火球 → BOOM → 牆變 broken
    if(trainingAttackActive){
      if(criticalAttackStep > 0){
        // 火球移動中（從 x=16 一格一格向左到 x=0）
        const fireImg = (currentRow < 14) ? attackRowImages[currentRow] : attackRowImages[0];
        if(fireImg && fireImg.complete){
          ctx.drawImage(fireImg, 0, 0, 16, 8, criticalAttackStep, 0, 16, 8);
          ctx.drawImage(fireImg, 0, 0, 16, 8, criticalAttackStep, 8, 16, 8);
        }
      } else {
        // 火球到達牆壁，BOOM 動畫覆蓋牆位置
        const bImg = boomFrame === 0 ? boomImage : boomImage2;
        if(bImg.complete && bImg.naturalWidth > 0){
          ctx.drawImage(bImg, 0, 0, 16, 16);
        }
      }
      // 龍在 x=24 攻擊（真正居中）
      if(rowImages[currentRow] && rowImages[currentRow].complete && rowImages[currentRow].naturalWidth > 0){
        ctx.drawImage(rowImages[currentRow], 11 * PITCH, 0, 16, 16, 24, 0, 16, 16);
      }
    } else {
      // 龍在 x=24（真正居中）
      if(rowImages[currentRow] && rowImages[currentRow].complete && rowImages[currentRow].naturalWidth > 0){
        ctx.drawImage(rowImages[currentRow], dragonFrame * PITCH, 0, 16, 16, 24, 0, 16, 16);
      }
    }

    // 慶祝 happy icons（避開居中龍 x=24）
    if(trainingCelebrationActive && happyImage.complete && happyImage.naturalWidth > 0
       && TRAINING_CELEBRATION_SEQ[trainingCelebrationStep] === 7){
      ctx.drawImage(happyImage, 8, 0, 8, 8);
      ctx.drawImage(happyImage, 48, 0, 8, 8);
    }
    // 失敗 sad icons（避開居中龍 x=24）
    if(trainingFailureActive && sadImage.complete && sadImage.naturalWidth > 0
       && TRAINING_FAILURE_SEQ[trainingFailureStep] === 10){
      ctx.drawImage(sadImage, 8, 0, 8, 8);
      ctx.drawImage(sadImage, 8, 8, 8, 8);
      ctx.drawImage(sadImage, 48, 0, 8, 8);
      ctx.drawImage(sadImage, 48, 8, 8, 8);
    }
    return;
  }

  // 閃避訓練：飛彈從左方飛來，龍在 x=48，x=40 有 instruct 3幀循環
  if(trainingType === "evade"){
    // instruct 在 x=40，三幀循環（成功/失敗後隱藏）
    if(instructImage.complete && instructImage.naturalWidth > 0
       && !trainingCelebrationActive && !trainingFailureActive){
      ctx.drawImage(instructImage, evadeInstructFrame * 8, 0, 8, 16, 40, 0, 8, 16);
    }

    // 飛彈（從畫外飛入，missile.png 16×16）
    if(evadeMissileImage.complete && evadeMissileImage.naturalWidth > 0 && evadePhase !== "done"){
      ctx.drawImage(evadeMissileImage, 0, 0, 16, 16, evadeProjX, 0, 16, 16);
    }

    // 龍：遊戲時間在 x=48，成功/失敗後移到 x=32
    const isCelebrating = trainingCelebrationActive || trainingFailureActive;
    const dragonX = isCelebrating ? 32 : 48;
    if(rowImages[currentRow] && rowImages[currentRow].complete && rowImages[currentRow].naturalWidth > 0){
      if(evadeDragonFlipped){
        ctx.save();
        ctx.scale(-1, 1);
        ctx.drawImage(rowImages[currentRow], dragonFrame * PITCH, 0, 16, 16, -(dragonX + 16), 0, 16, 16);
        ctx.restore();
      } else {
        ctx.drawImage(rowImages[currentRow], dragonFrame * PITCH, 0, 16, 16, dragonX, 0, 16, 16);
      }
    }

    // 成功飛彈穿過後消失位置再畫一次（確保飛彈超出左邊界時不再繪製）
    if(attackProjImage.complete && attackProjImage.naturalWidth > 0 && evadeSucceeded && evadePhase === "done"){
      // 飛彈已消失
    }

    // 慶祝 happy icons
    if(trainingCelebrationActive && happyImage.complete && happyImage.naturalWidth > 0
       && TRAINING_CELEBRATION_SEQ[trainingCelebrationStep] === 7){
      ctx.drawImage(happyImage, 24, 0, 8, 8);
      ctx.drawImage(happyImage, 48, 0, 8, 8);
    }

    // 失敗 sad icons
    if(trainingFailureActive && sadImage.complete && sadImage.naturalWidth > 0
       && TRAINING_FAILURE_SEQ[trainingFailureStep] === 10){
      ctx.drawImage(sadImage, 24, 0, 8, 8);
      ctx.drawImage(sadImage, 24, 8, 8, 8);
      ctx.drawImage(sadImage, 48, 0, 8, 8);
      ctx.drawImage(sadImage, 48, 8, 8, 8);
    }
    return;
  }

  // 攻速訓練：序列 AB 配對，龍在右邊面向左
  if(trainingType === "speed"){
    // 龍位置：遊戲中在 x=48，動畫中在 speedDragonX
    const dragonPosX = (!speedActive)
      ? speedDragonX : 48;
    const faceRight = (speedMovePhase === "returning" || speedMovePhase === "done");
    if(rowImages[currentRow] && rowImages[currentRow].complete && rowImages[currentRow].naturalWidth > 0){
      if(faceRight){
        ctx.save();
        ctx.scale(-1, 1);
        ctx.drawImage(rowImages[currentRow], dragonFrame * PITCH, 0, 16, 16, -(dragonPosX + 16), 0, 16, 16);
        ctx.restore();
      } else {
        ctx.drawImage(rowImages[currentRow], dragonFrame * PITCH, 0, 16, 16, dragonPosX, 0, 16, 16);
      }
    }
    // 使用 AB.png 精靈繪製序列：箭頭 + 6 個 A/B
    if(speedSequence.length > 0 && (speedActive || speedCorrectFlashAt >= 0) && abGuideImage.complete && abGuideImage.naturalWidth > 0){
      // 箭頭
      ctx.font = "6px monospace";
      ctx.textAlign = "left";
      ctx.fillStyle = "#aaa";
      ctx.fillText("→", 0, 10);
      // 繪製每個字母（AB.png 下半部：A=sx:0,sy:8, B=sx:8,sy:8）
      const lxStart = 5;
      const lSpacing = 7;
      for(let i = 0; i < speedSequence.length; i++){
        const lx = lxStart + i * lSpacing;
        const isCurrent = (i === speedCurrentIndex);
        const isDone = (i < speedCurrentIndex);
        const isFlash = (i === speedCorrectFlashAt);
        const letter = speedSequence[i];
        const sx = (letter === "A") ? 0 : 8;
        // 字母精靈 6×6
        ctx.drawImage(abGuideImage, sx, 8, 8, 8, lx, 8, 6, 6);
        // 已完成：上方繪製「正確」指示器
        if(isDone && abGuideImage.complete){
          ctx.drawImage(abGuideImage, 0, 0, 8, 8, lx, 0, 6, 6);
        }
        // 當前字母：黃色底線 + 箭頭
        if(isCurrent){
          ctx.fillStyle = "#ffcc00";
          ctx.fillRect(lx, 14, 6, 2);
          ctx.fillText("▲", lx + 1, 7);
        }
        // 剛按下正確：閃現「正確」
        if(isFlash && abGuideImage.complete){
          ctx.drawImage(abGuideImage, 0, 0, 8, 8, lx + 1, 0, 8, 8);
        }
      }
    }
    // 慶祝 (左右各一對)
    if(trainingCelebrationActive && happyImage.complete && happyImage.naturalWidth > 0
       && TRAINING_CELEBRATION_SEQ[trainingCelebrationStep] === 7){
      ctx.drawImage(happyImage, 24, 0, 8, 8);
      ctx.drawImage(happyImage, 48, 0, 8, 8);
    }
    // 失敗
    if(trainingFailureActive && sadImage.complete && sadImage.naturalWidth > 0
       && TRAINING_FAILURE_SEQ[trainingFailureStep] === 10){
      ctx.drawImage(sadImage, 24, 0, 8, 8);
      ctx.drawImage(sadImage, 24, 8, 8, 8);
      ctx.drawImage(sadImage, 48, 0, 8, 8);
      ctx.drawImage(sadImage, 48, 8, 8, 8);
    }
    return;
  }

  // 親密度訓練：記憶翻牌，龍居中 x=24
  if(trainingType === "affinity"){
    // 繪製龍（慶祝時用 idle/happy/idle/happy 序列）
    const dFrame = trainingCelebrationActive
      ? TRAINING_CELEBRATION_SEQ[trainingCelebrationStep % TRAINING_CELEBRATION_SEQ.length]
      : trainingIdleFrame;
    if(rowImages[currentRow] && rowImages[currentRow].complete && rowImages[currentRow].naturalWidth > 0){
      ctx.drawImage(rowImages[currentRow], dFrame * PITCH, 0, 16, 16, 24, 0, 16, 16);
    }
    // 右側顯示目標圖案（僅遊戲進行中）
    if(evoPhase === "playing" && evoTarget >= 0 && evoTarget < EVO_TYPES){
      const iconImg = evoColorImages[evoTarget];
      if(iconImg && iconImg.complete && iconImg.naturalWidth > 0){
        ctx.drawImage(iconImg, 50, 3, 10, 10);
      }
    }
    // 慶祝時 Happy.png 與龍 happy 幀同步（左右各一對上下，避開居中龍 x=24）
    if(trainingCelebrationActive && happyImage.complete && happyImage.naturalWidth > 0
       && TRAINING_CELEBRATION_SEQ[trainingCelebrationStep % TRAINING_CELEBRATION_SEQ.length] === 7){
      ctx.drawImage(happyImage, 8, 0, 8, 8);
      ctx.drawImage(happyImage, 48, 0, 8, 8);
    }
    // 失敗圖標（避開居中龍 x=24）
    if(trainingFailureActive && sadImage.complete && sadImage.naturalWidth > 0
       && TRAINING_FAILURE_SEQ[trainingFailureStep] === 10){
      ctx.drawImage(sadImage, 8, 0, 8, 8);
      ctx.drawImage(sadImage, 8, 8, 8, 8);
      ctx.drawImage(sadImage, 48, 0, 8, 8);
      ctx.drawImage(sadImage, 48, 8, 8, 8);
    }
    return;
  }

  // 攻擊訓練：原來的布局
  // 1) 最左側訓練靶子 (x=0)，依狀態顯示不同圖
  if(sandbagState === "hit"){
    // 被打中後：顯示 Sandbag03
    if(sandbagImage3.complete && sandbagImage3.naturalWidth > 0){
      ctx.drawImage(sandbagImage3, 0, 0, 16, 16);
    }
  } else if(sandbagState === "boom"){
    // 爆炸動畫：顯示 Boom01/Boom02
    const bImg = boomFrame === 0 ? boomImage : boomImage2;
    if(bImg.complete && bImg.naturalWidth > 0){
      ctx.drawImage(bImg, 0, 0, 16, 16);
    }
  } else {
    // 正常狀態：靜止顯示 Sandbag01
    if(sandbagImage.complete && sandbagImage.naturalWidth > 0){
      ctx.drawImage(sandbagImage, 0, 0, 16, 16);
    }
  }
  
  // 2) 龍真正居中（x=24，中心在畫布 x=32）
  if(rowImages[currentRow] && rowImages[currentRow].complete && rowImages[currentRow].naturalWidth > 0){
    ctx.drawImage(
      rowImages[currentRow],
      dragonFrame * PITCH, 0,
      16, 16,
      24, 0,
      16, 16
    );
  }
  
  // 慶祝時只在 happy 幀顯示愛心（避開居中龍的位置）
  if(trainingCelebrationActive && happyImage.complete && happyImage.naturalWidth > 0
     && TRAINING_CELEBRATION_SEQ[trainingCelebrationStep] === 7){
    ctx.drawImage(happyImage, 8, 0, 8, 8);
    ctx.drawImage(happyImage, 48, 0, 8, 8);
  }
  // 失敗時只在 sad 幀顯示難過圖（避開居中龍的位置）
  if(trainingFailureActive && sadImage.complete && sadImage.naturalWidth > 0
     && TRAINING_FAILURE_SEQ[trainingFailureStep] === 10){
    ctx.drawImage(sadImage, 8, 0, 8, 8);
    ctx.drawImage(sadImage, 8, 8, 8, 8);
    ctx.drawImage(sadImage, 48, 0, 8, 8);
    ctx.drawImage(sadImage, 48, 8, 8, 8);
  }
  
  // Power 在龍右側（x=48），攻擊完成後隱藏
  if(!trainingPowerHidden){
    if(powerImage.complete && powerImage.naturalWidth > 0){
      const powerFrame = Math.min(trainingLevel, 5);
      ctx.drawImage(
        powerImage,
        powerFrame * 16, 0, 16, 16,
        48, 0,
        16, 16
      );
    } else {
      ctx.fillStyle = "#ff0";
      ctx.fillRect(49, 1, 14, 14);
    }
  }
  
  // 攻擊彈在龍左方，火球連續移動（單發，取上半 16×8）
  if(trainingAttackActive){
    const fireImg = (currentRow < 14) ? attackRowImages[currentRow] : attackRowImages[0];
    if(fireImg && fireImg.complete){
      ctx.drawImage(fireImg, 0, 0, 16, 8, trainingProjectileX, 0, 16, 8);
    }
  }
}

// ========== 自動存檔 ==========
const SAVE_KEY = "digimon_vpet_save";
const DATA_VERSION = 2; // 數據版本：2 - 訓練加成系統
function saveGameState(){
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      dataVersion: DATA_VERSION,
      gameAge,
      gameHunger,
      gameWeight,
      gameAffinity,
      gameTrainingPoints,
      currentRow,
      gameHpBonus, gameAtkBonus, gameSpdBonus,
      gameCritBonus, gameDodgeBonus, gameAffBonus,
      totalTrainingCount, gameAgeLastDay,
      stageStartDay, stageTrainingPointsUsed,
      poopsOnScreen, poopCountdown,
      isSleeping,
      isEggPhase,
      gameCareMistakes, callMistakeRecorded,
      eggStartTime: isEggPhase ? eggStartTime : undefined,
      timestamp: Date.now()
    }));
  } catch(e){ /* 忽略存檔錯誤 */ }
}
function loadGameState(){
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return;
    const data = JSON.parse(raw);
    // === 蛋時期狀態處理 ===
    if(data.isEggPhase && data.eggStartTime){
      const eggElapsed = (Date.now() - data.eggStartTime) / 1000;
      if(eggElapsed >= 60){
        // 蛋已孵化，初始化為黑球獸
        isEggPhase = false;
        eggStartTime = 0;
        currentRow = 0;
        gameAge = 0;
        gameAgeLastDay = 0;
        stageStartDay = 0;
        gameHunger = 0;
        gameWeight = DIGIMON_STATS[0].weight;
        gameAffinity = DIGIMON_STATS[0].bondInitial || 10;
        resetAllBonuses();
        gameTrainingPoints = 0; // 幼年期無訓練點
        isSleeping = false;
        poopsOnScreen = 0;
        poopCountdown = 0;
        return; // 孵化完成，跳過離線計算
      } else {
        // 仍在蛋時期，恢復狀態
        isEggPhase = true;
        eggStartTime = data.eggStartTime;
        gameHunger = 0;
        gameWeight = 0;
        gameAffinity = 0;
        gameTrainingPoints = 0;
        gameAge = 0;
        gameAgeLastDay = 0;
        stageStartDay = 0;
        resetAllBonuses();
        return; // 跳過離線時間計算
      }
    } else {
      isEggPhase = false;
    }
    const elapsed = Math.floor((Date.now() - data.timestamp) / 60000); // 經過分鐘
    gameAge = (data.gameAge || 0) + elapsed;
    gameHunger = Math.min(10, Math.max(0, (data.gameHunger ?? 5) - Math.floor(elapsed / 30)));
    gameTrainingPoints = data.gameTrainingPoints ?? 12;
    gameAgeLastDay = data.gameAgeLastDay ?? 0;
    // 離線期間每天疊加 12 點訓練點
    const offlineDay = Math.floor(gameAge / 1440);
    const lastDay = gameAgeLastDay;
    if(offlineDay > lastDay){
      gameTrainingPoints += (offlineDay - lastDay) * 12;
      gameAgeLastDay = offlineDay;
    }
    currentRow = data.currentRow ?? 2;
    // 版本匹配才沿用存檔的所有訓練數據
    if(data.dataVersion === DATA_VERSION){
      gameWeight = data.gameWeight ?? DIGIMON_STATS[data.currentRow ?? 2].weight;
      gameAffinity = data.gameAffinity ?? (DIGIMON_STATS[data.currentRow ?? 2].bondInitial || 0);
      gameHpBonus = data.gameHpBonus ?? 0;
      gameAtkBonus = data.gameAtkBonus ?? 0;
      gameSpdBonus = data.gameSpdBonus ?? 0;
      gameCritBonus = data.gameCritBonus ?? 0;
      gameDodgeBonus = data.gameDodgeBonus ?? 0;
      gameAffBonus = data.gameAffBonus ?? 0;
      totalTrainingCount = data.totalTrainingCount ?? 0;
      gameAgeLastDay = data.gameAgeLastDay ?? 0;
      stageStartDay = data.stageStartDay ?? 0;
      stageTrainingPointsUsed = data.stageTrainingPointsUsed ?? 0;
      poopsOnScreen = data.poopsOnScreen ?? 0;
      poopCountdown = data.poopCountdown ?? 0;
      isSleeping = data.isSleeping ?? false;
      gameCareMistakes = data.gameCareMistakes ?? 0;
      callMistakeRecorded = data.callMistakeRecorded ?? false;
      // 離線育成失誤：存檔時飢餓=0且未記錄失誤，離線≥10分鐘則計1次
      if(data.gameHunger === 0 && !callMistakeRecorded && elapsed >= 10){
        gameCareMistakes++;
        callMistakeRecorded = true;
        callFirstShownTime = 0;
      } else if(gameHunger === 0){
        callFirstShownTime = Date.now();
      }
      // 計算離線經過的秒數，處理排便倒數
      const elapsedSec = Math.floor((Date.now() - data.timestamp) / 1000);
      if(poopCountdown > 0){
        let remaining = poopCountdown - elapsedSec;
        while(remaining <= 0 && poopsOnScreen < 8){
          poopsOnScreen++;
          remaining += randPoopInterval();
        }
        poopCountdown = Math.max(0, remaining);
      }
      if(poopCountdown <= 0) resetPoopCountdown();
    } else {
      gameWeight = DIGIMON_STATS[data.currentRow ?? 2].weight;
      gameAffinity = DIGIMON_STATS[data.currentRow ?? 2].bondInitial || 0;
      gameHpBonus = 0; gameAtkBonus = 0; gameSpdBonus = 0;
      gameCritBonus = 0; gameDodgeBonus = 0; gameAffBonus = 0;
      totalTrainingCount = 0; gameAgeLastDay = 0;
      stageStartDay = 0; stageTrainingPointsUsed = 0;
      gameTrainingPoints = (currentRow <= 1) ? 0 : 12;
      poopsOnScreen = 0; poopCountdown = 0;
    }
    // 離線期間的階段進化檢查（確保即時觸發）
    if(stageStartDay > 0) checkStageEvolution();
    // 離線補捉：黑球獸應在 5 分鐘後進化（待圖片載入後觸發）
    if(currentRow === 0 && gameAge >= 5) evoAnimPending = true;
    // 離線補捉：滾球獸應在 15 分鐘後進化
    if(currentRow === 1 && gameAge >= 15) evoAnimPending = true;
  } catch(e){ /* 忽略讀檔錯誤 */ }
}

function startCelebration(){
  birthEvoCelebrate = true;
  birthEvoCelebrateStep = 0;
  // 停止自動移動
  if(autoTimer){ clearInterval(autoTimer); autoTimer = null; }
  if(autoMoveTimer){ clearInterval(autoMoveTimer); autoMoveTimer = null; }
  autoX = 8; autoTargetX = null;
  renderFrame();

  birthEvoCelebrateTimer = setInterval(() => {

      clearInterval(birthEvoCelebrateTimer);

function getTotalHp(){ return DIGIMON_STATS[currentRow].hp + gameHpBonus; }
function getTotalAtk(){ return DIGIMON_STATS[currentRow].atk + gameAtkBonus; }
function getTotalSpd(){ return DIGIMON_STATS[currentRow].spd + gameSpdBonus; }
function getTotalCrit(){ return Math.min(0.35, (DIGIMON_STATS[currentRow].critRate || 0) + gameCritBonus); }
function getTotalDodge(){ return Math.min(0.30, (DIGIMON_STATS[currentRow].dodgeRate || 0) + gameDodgeBonus); }
function getTotalAffinity(){ return Math.min(100, (DIGIMON_STATS[currentRow].bondInitial || 0) + gameAffBonus); }

function getStageMaxPoints(){
  const s = DIGIMON_STATS[currentRow].stage;
  if(s === "成長期") return 24;
  if(s === "成熟期") return 48;
  if(s === "完全體") return 96;
  return 0;
}

function tryTrainingSuccess(type){
  const babyStage = (currentRow <= 1);
  const cap = {"crit":0.35,"dodge":0.30,"affinity":100}[type] || null;
  const cur = type==="hp"?getTotalHp():type==="atk"?getTotalAtk():type==="spd"?getTotalSpd():type==="crit"?getTotalCrit():type==="dodge"?getTotalDodge():getTotalAffinity();
  if(cap !== null && cur >= cap) return {success:false,reason:"cap"};
  if(!babyStage && gameTrainingPoints <= 0) return {success:false,reason:"no_points"};
  const sMax = getStageMaxPoints();
  if(!babyStage && sMax > 0 && stageTrainingPointsUsed >= sMax) return {success:false,reason:"stage_cap"};
  if(!babyStage){ gameTrainingPoints--; stageTrainingPointsUsed++; }
  // 幼年期訓練不累積加成（純動畫，不長屬性不計數）
  if(!babyStage){
    totalTrainingCount++;
    switch(type){
      case "hp": gameHpBonus += 0.8; break;
      case "atk": gameAtkBonus += 0.1; break;
      case "spd": gameSpdBonus += 0.04; break;
      case "crit": gameCritBonus += 0.004; break;
      case "dodge": gameDodgeBonus += 0.004; break;
      case "affinity": gameAffBonus += 1; break;
    }
  }
  return {success:true};
}

function checkStageEvolution(){
  const stage = DIGIMON_STATS[currentRow].stage;
  const daysInStage = Math.floor(gameAge / 1440) - stageStartDay;
  if(stage === "成長期" && daysInStage >= 2){
    triggerNaturalEvo();
  } else if(stage === "成熟期" && daysInStage >= 4){
    triggerNaturalEvo();
  } else if(stage === "完全體" && daysInStage >= 8){
    dieAndReturnToEgg();
  }
}

function triggerNaturalEvo(){
  const nxt = getNextEvoRow(currentRow);
  if(nxt >= 0){
    const wasBaby = (currentRow <= 1);
    currentRow = nxt;
    stageStartDay = Math.floor(gameAge / 1440);
    stageTrainingPointsUsed = 0;
    // 幼年期進化到成長期，給予初始訓練點
    if(wasBaby && currentRow >= 2) gameTrainingPoints = 12;
    battlePlayerMaxHp = getTotalHp();
    battlePlayerHp = getTotalHp();
    saveGameState();
  }
}

// 進化前慶祝：idle,happy,idle,happy,回 idle → 進化（5步，以 idle 收尾，happy 幀顯示 !.png）
function startPreEvoCelebration(callback){
  preEvoCelebrate = true;
  preEvoCelebrateStep = 0;
  if(autoTimer){ clearInterval(autoTimer); autoTimer = null; }
  if(autoMoveTimer){ clearInterval(autoMoveTimer); autoMoveTimer = null; }
  autoX = 8; autoTargetX = null;
  renderFrame();
  preEvoCelebrateTimer = setInterval(() => {
    preEvoCelebrateStep++;
    renderFrame();
    if(preEvoCelebrateStep >= 5){
      clearInterval(preEvoCelebrateTimer);
      preEvoCelebrateTimer = null;
      preEvoCelebrate = false;
      // 回到 idle 狀態後觸發進化
      if(callback) callback();
    }
  }, BIRTH_EVO_HAPPY_INTERVAL);
}

// 自然進化動畫：進化前慶祝 → evolution.png 從上到下一格一格（進化中）→ 切換 sprite → 從下到上一格一格（完成）
function startNaturalEvoAnim(nextRow){
  evoAnimActive = true;
  evoAnimNextRow = nextRow;
  gameMode = "auto";
  // 停止移動，將數碼獸移到中間
  if(autoTimer){ clearInterval(autoTimer); autoTimer = null; }
  if(autoMoveTimer){ clearInterval(autoMoveTimer); autoMoveTimer = null; }
  autoX = 8; autoTargetX = null;
  autoAnimStep = 0;
  renderFrame();
  // Phase 0: 進化前慶祝 idle,happy,idle,happy,idle（結束後開始 evoDown）
  startPreEvoCelebration(() => {
  // Phase 1: evoDown — evolution.png 從上到下一格一格覆蓋
  setTimeout(() => {
    evoAnimPhase = "evoDown";
    evoAnimStep = 0;
    const downIv = setInterval(() => {
      evoAnimStep++;
      renderFrame();
      if(evoAnimStep >= 16){
        clearInterval(downIv);
        // 切換到新數碼獸
        const oldRow = currentRow;
        currentRow = evoAnimNextRow;
        stageStartDay = Math.floor(gameAge / 1440);
        stageTrainingPointsUsed = 0;
        // 進化到成長期，增加 12 訓練點
        if(currentRow >= 2 && currentRow <= 3) gameTrainingPoints += 12;
        battlePlayerMaxHp = getTotalHp();
        battlePlayerHp = getTotalHp();
        updateStatsDisplay();
        renderFrame();
        saveGameState();
        // Phase 2: evoUp — evolution.png 從下到上一格一格消失，露出新形態
        setTimeout(() => {
          evoAnimPhase = "evoUp";
          evoAnimStep = 16;
          const upIv = setInterval(() => {
            evoAnimStep--;
            renderFrame();
            if(evoAnimStep <= 0){
              clearInterval(upIv);
              evoAnimActive = false;
              evoAnimPhase = "";
              evoAnimNextRow = -1;
              // 進化慶祝：idle,happy,idle,happy + Happy.png（結束後自動恢復移動）
              startCelebration();
              showToast(ALL_NAMES[oldRow] + "進化為" + ALL_NAMES[currentRow] + "！");
            }
          }, 50);
        }, 400);
      }
    }, 50);
  }, 500);
  }); // 結束 startPreEvoCelebration callback
}

function getNextEvoRow(row){
  const stage = DIGIMON_STATS[row].stage;
  if(stage === "成長期"){
    for(let i=0;i<TOTAL_DIGIMON;i++){ if(DIGIMON_STATS[i].stage==="成熟期"&&DIGIMON_STATS[i].attr===DIGIMON_STATS[row].attr) return i; }

    for(let i=0;i<TOTAL_DIGIMON;i++){ if(DIGIMON_STATS[i].stage==="完全體"&&DIGIMON_STATS[i].attr===DIGIMON_STATS[row].attr) return i; }
  }
  return -1;
}

function clickFunction(idx){
  // 蛋時期限制：只允許狀態(0)、圖鑑(7)
  if(isEggPhase && idx !== 0 && idx !== 7){
    showToast("蛋還在孵化中，請耐心等待 🥚");
    return;
  }
  // 睡眠時只允許：狀態(0)、清理(4)、睡眠按鈕關燈(5)、圖鑑(7)
  if(isSleeping && idx !== 0 && idx !== 4 && idx !== 5 && idx !== 7){
    showToast("龍正在睡覺，請勿打擾 💤");
    return;
  }
  // 關燈時不能訓練和對戰
  if(lightsOff && (idx === 2 || idx === 3)){
    showToast("請開灯 💡");
    return;
  }
  // 進食中不能點其他按鈕
  if(gameMode === "eating") return;
  // 清潔動畫中不能操作其他按鈕
  if(flushingMode && idx !== 4) return;
  // 對戰中：所有功能按鈕無效，請使用對戰面板內按鈕操作
  if(battleActive) return;
  // 訓練中點其他按鈕 → 退出訓練（但點戰鬥時直接切換，不經過 auto mode）
  if(trainingMode && idx !== 2 && idx !== 3){
    stopTraining();
  }
  const btn = document.querySelector(`.func-btn[data-idx="${idx}"]`);
  if(!btn) return;
  btn.classList.add('active');
  setTimeout(() => btn.classList.remove('active'), 200);
  console.log(`功能: ${FUNCTION_BTNS[idx]}`);
  if(idx === 0) showStats();   // 狀態
  else if(idx === 1) showFood(); // 食物
  else if(idx === 2) startTraining(); // 訓練
  else if(idx === 3) startBattle(); // 對戰
  else if(idx === 4) cleanPoops(); // 清理糞便
  else if(idx === 5) toggleLights(); // 關燈/開燈
  else if(idx === 7) showDigidex(); // 圖鑑
}

// 統一傷害計算（含閃避→暴擊→屬性→下限1）
function calcBattleDamage(attackerRow, defenderRow){
  const atkr = DIGIMON_STATS[attackerRow];
  const defr = DIGIMON_STATS[defenderRow];
  // 玩家攻擊用總屬性，敵方攻擊用基礎屬性
  const isPlayerAtk = (attackerRow === currentRow);
  const isPlayerDef = (defenderRow === currentRow);
  // 閃避優先判定（防禦方用總閃避）
  const defDodge = isPlayerDef ? getTotalDodge() : defr.dodgeRate;
  if(Math.random() < defDodge) return { dodged: true, dmg: 0, msg: defr.name + " 閃避了攻擊！" };
  // 基礎傷害（攻擊方用總攻擊）
  let dmg = isPlayerAtk ? getTotalAtk() : atkr.atk;
  let msgExtra = "";
  // 暴擊（攻擊方用總暴擊）
  const atkCrit = isPlayerAtk ? getTotalCrit() : atkr.critRate;
  let isCrit = false;
  if(Math.random() < atkCrit){
    dmg = Math.round(dmg * CRIT_MULT);
    msgExtra = "爆擊！";
    isCrit = true;
  }
  // 屬性相剋
  const aType = atkr.attr || "none";
  const dType = defr.attr || "none";
  const attrMult = (ATTR_TYPE_MULT[aType] && ATTR_TYPE_MULT[aType][dType]) || 1.0;
  if(attrMult > 1.0) msgExtra += " 屬性剋制！";
  else if(attrMult < 1.0) msgExtra += " 屬性劣勢…";
  dmg = Math.round(dmg * attrMult);
  dmg = Math.max(1, dmg); // 下限1
  const attrAdv = attrMult > 1.0;
  const attrDis = attrMult < 1.0;
  const msg = msgExtra ? (msgExtra + " " + dmg + " 傷害！") : (dmg + " 傷害！");
  return { dodged: false, dmg, msg, crit: isCrit, attrAdv: attrAdv, attrDis: attrDis };
}

// 逆境進化判定：血量<40%且尚未用完次數，且必須有下一階段可進化
function tryAdversityEvo(){
  if(battleAdversityTries >= ADVERSITY_EVO_MAX_TRIES) return false;
  // 檢查是否有下一階段可進化（完全體為最高階段，不可再進化）
  const curStage = DIGIMON_STATS[currentRow].stage;
  const stageOrder = ["幼年期","幼年期Ⅱ","成長期","成熟期","完全體"];
  const curIdx = stageOrder.indexOf(curStage);
  if(curIdx < 0 || curIdx >= stageOrder.length - 1) return false;
  // DEBUG: 強制觸發
  if(window.forceAdversityEvo) return true;
  const hpPct = battlePlayerHp / battlePlayerMaxHp;
  if(hpPct <= 0 || hpPct >= 0.4) return false;
  const prob = 0.0542 + (getTotalAffinity() / 100) * (0.1060 - 0.0542);
  return Math.random() < prob;
}

// 逆境進化執行：動畫 → 進化 → 攻擊
function doAdversityEvo(nextAttacker, onDone){
  battleAdversityTries++;
  const curStage = DIGIMON_STATS[currentRow].stage;

  // 確定下一階段
  const stageOrder = ["幼年期","幼年期Ⅱ","成長期","成熟期","完全體"];
  const curIdx = stageOrder.indexOf(curStage);
  if(curIdx < 0 || curIdx >= stageOrder.length - 1){ executeAttack(nextAttacker, onDone); return; }

  const nextStage = stageOrder[curIdx + 1];

  // 找到所有下一階段的數碼獸
  const candidates = [];
  for(let i = 0; i < TOTAL_DIGIMON; i++){
    if(DIGIMON_STATS[i].stage === nextStage){
      candidates.push(i);
    }
  }
  if(candidates.length === 0){ executeAttack(nextAttacker, onDone); return; }

  battleEvoNextRow = candidates[Math.floor(Math.random() * candidates.length)];
  if(battleAdversityEvoRow < 0) battleAdversityEvoRow = battleEvoNextRow;

  // 開始動畫序列：exclaim(0.5秒) → evoDown → 進化 → evoUp → 攻擊
  battleEvoState = "exclaim";
  battleEvoStep = 0;
  battleEvoCallback = () => { executeAttack(nextAttacker, onDone); };
  document.getElementById("adversityEvoBanner").style.display = "none";
  document.getElementById("battleMsg").textContent = "逆境進化！";
  renderBattleScene();

  // Phase 1: 顯示 ! 0.5 秒
  setTimeout(() => {
    if(!battleActive) return;
    battleEvoState = "evoDown";
    battleEvoStep = 0;
    runEvoAnim();
  }, 500);
}

function runEvoAnim(){
  if(!battleActive) return;
  const interval = setInterval(() => {
    if(!battleActive || battleEvoState === "none"){ clearInterval(interval); return; }

    if(battleEvoState === "evoDown"){
      battleEvoStep++;
      renderBattleScene();
      if(battleEvoStep >= 16){
        // 進化！訓練加成完整保留，基礎屬性替換為新形態
        currentRow = battleEvoNextRow;
        const s = DIGIMON_STATS[currentRow];
        stageStartDay = Math.floor(gameAge / 1440);
        stageTrainingPointsUsed = 0;
        battlePlayerMaxHp = getTotalHp();
        battlePlayerHp = getTotalHp();
        updateBattleHpDisplay();
        const advAttrColor = getAttrColor(s.attr, DIGIMON_STATS[battleEnemyRow].attr);
        document.getElementById("battlePlayerName").innerHTML = s.name + '(<span style="color:' + advAttrColor + '">' + (ATTR_CN[s.attr] || s.attr || "—") + '</span>) ⚡';
        document.getElementById("adversityEvoBanner").style.display = "block";
        document.getElementById("battleMsg").textContent = s.name + " 逆境進化！！";
        clearInterval(interval);
        // Phase 3: evoUp
        setTimeout(() => {
          if(!battleActive) return;
          battleEvoState = "evoUp";
          battleEvoStep = 16;
          runEvoAnimUp();
        }, 500);
      }
    }
  }, 50);
}

function runEvoAnimUp(){
  if(!battleActive) return;
  const interval = setInterval(() => {
    if(!battleActive || battleEvoState !== "evoUp"){ clearInterval(interval); return; }
    battleEvoStep--;
    renderBattleScene();
    if(battleEvoStep <= 0){
      battleEvoState = "none";
      battleEvoStep = 0;
      clearInterval(interval);
      renderBattleScene();
      if(battleEvoCallback){ const cb = battleEvoCallback; battleEvoCallback = null; cb(); }
    }
  }, 50);
}

// ========== 敵方逆境進化 ==========
function doEnemyAdversityEvo(nextAttacker, onDone){
  battleEnemyAdversityTries++;
  const curStage = DIGIMON_STATS[battleEnemyRow].stage;

  const stageOrder = ["幼年期","幼年期Ⅱ","成長期","成熟期","完全體"];
  const curIdx = stageOrder.indexOf(curStage);
  if(curIdx < 0 || curIdx >= stageOrder.length - 1){ executeAttack(nextAttacker, onDone); return; }

  const nextStage = stageOrder[curIdx + 1];
  const candidates = [];
  for(let i = 0; i < TOTAL_DIGIMON; i++){
    if(DIGIMON_STATS[i].stage === nextStage){
      candidates.push(i);
    }
  }
  if(candidates.length === 0){ executeAttack(nextAttacker, onDone); return; }

  battleEnemyEvoNextRow = candidates[Math.floor(Math.random() * candidates.length)];
  if(battleEnemyAdversityEvoRow < 0) battleEnemyAdversityEvoRow = battleEnemyEvoNextRow;

  battleEnemyEvoState = "exclaim";
  battleEnemyEvoStep = 0;
  battleEnemyEvoCallback = () => { executeAttack(nextAttacker, onDone); };
  document.getElementById("battleMsg").textContent = "敵方逆境進化！";

  setTimeout(() => {
    if(!battleActive) return;
    battleEnemyEvoState = "evoDown";
    battleEnemyEvoStep = 0;
    runEnemyEvoAnim();
  }, 500);
}

function runEnemyEvoAnim(){
  if(!battleActive) return;

function runEnemyEvoAnimUp(){

}

// 單次攻擊執行動畫
function executeAttack(who, onDone){
  if(!battleActive || battleResult) return;
  battleTurn = "";
  // 攻擊進行中不可退出
  document.getElementById("battleRunBtn").disabled = true;

  // 玩家攻擊前逆境進化判定
  if(who === "player" && battleAdversityTries < ADVERSITY_EVO_MAX_TRIES){
    if(tryAdversityEvo()){
      doAdversityEvo(who, onDone);
      return;
    }
  }

  // 敵方攻擊前逆境進化判定
  if(who === "enemy" && battleEnemyAdversityTries < ADVERSITY_EVO_MAX_TRIES){
    const eHpPct = battleEnemyHp / battleEnemyMaxHp;
    if(window.forceAdversityEvo || (eHpPct > 0 && eHpPct < 0.4 && Math.random() < 0.0542)){
      // 檢查敵方是否有下一階段可進化（完全體不可再進化）
      const eStage = DIGIMON_STATS[battleEnemyRow].stage;
      const eStageIdx = ["幼年期","幼年期Ⅱ","成長期","成熟期","完全體"].indexOf(eStage);
      if(eStageIdx >= 0 && eStageIdx < 4){
        doEnemyAdversityEvo(who, onDone);
        return;
      }
    }
  }

  const atkrRow = who === "player" ? currentRow : battleEnemyRow;
  const defrRow = who === "player" ? battleEnemyRow : currentRow;
  const atkrName = DIGIMON_STATS[atkrRow].name;

  const { dodged, dmg, msg, crit, attrAdv, attrDis } = calcBattleDamage(atkrRow, defrRow);
  battleIsCrit = crit;

  if(dodged){
    // 顯示攻擊幀 & 發射火球
    battleMsg = atkrName + " 攻擊！";
    document.getElementById("battleMsg").textContent = battleMsg;
    if(who === "player"){
      battlePlayerFrame = 11;
      battleProjectileX = 44;
      battleProjectileDir = 1;
    } else {
      battleEnemyFrame = 11;
      battleProjectileX = 8;
      battleProjectileDir = 0;
    }
    battleProjectileActive = true;
    renderBattleScene();

    // 火球飛向目標，穿越後目標龍原地轉身
    const dodgeDx = who === "player" ? -4 : 4;
    const dodgeTriggerX = who === "player" ? 14 : 42;  // 到達龍的位置觸發轉身
    const dodgeExitX = who === "player" ? -8 : 56;      // 飛出屏幕邊界
    let dodgedTriggered = false;
    const dodgeAnimTimer = setInterval(() => {
      if(!battleActive && !battleResult){ clearInterval(dodgeAnimTimer); return; }
      battleProjectileX += dodgeDx;
      if(who === "player") battlePlayerFrame = 11;
      else battleEnemyFrame = 11;

      // 火球到達龍的位置 → 龍原地轉身，火球繼續飛
      if(!dodgedTriggered && Math.abs(battleProjectileX - dodgeTriggerX) <= 4){
        dodgedTriggered = true;
        if(who === "player") battleEnemyDodge = true;
        else battlePlayerDodge = true;
      }

      // 火球飛出屏幕 → 結束
      const exited = who === "player" ? (battleProjectileX <= dodgeExitX) : (battleProjectileX >= dodgeExitX);
      if(exited){
        clearInterval(dodgeAnimTimer);
        battleProjectileActive = false;
        battleProjectileX = 0;

        battleMsg = msg;
        document.getElementById("battleMsg").textContent = battleMsg;
        addBattleLog(DIGIMON_STATS[defrRow].name, "閃避了攻擊！", false, true, false);
        battlePlayerFrame = 0;
        battleEnemyFrame = 0;
        renderBattleScene();

        setTimeout(() => {
          battlePlayerDodge = false;
          battleEnemyDodge = false;
          renderBattleScene();
          setTimeout(onDone, 300);
        }, 700);
        return;
      }
      renderBattleScene();
    }, 80);
    return;
  }

  // 攻擊動畫
  battleMsg = atkrName + " 攻擊！";
  document.getElementById("battleMsg").textContent = battleMsg;
  if(who === "player"){
    battlePlayerFrame = 11;
    battleProjectileX = 48;  // 我方火球發射位置
    battleProjectileDir = 1;
  } else {
    battleEnemyFrame = 11;
    battleProjectileX = 8;   // 敵方火球發射位置
    battleProjectileDir = 0;
  }
  battleProjectileActive = true;

  const dx = who === "player" ? -4 : 4;
  const isEnemyAttack = who === "enemy";
  const animTimer = setInterval(() => {
    if(!battleActive && !battleResult){ clearInterval(animTimer); return; }
    battleProjectileX += dx;
    if(who === "player") battlePlayerFrame = 11;
    else battleEnemyFrame = 11;

    if((who === "player" && battleProjectileX <= 0) || (who === "enemy" && battleProjectileX >= 48)){
      clearInterval(animTimer);
      battleProjectileX = 0;
      battleProjectileActive = false;
      battlePlayerFrame = 0;
      battleEnemyFrame = 0;

      // 開始爆炸動畫
      battleBoomActive = true;
      // 玩家攻擊→打中敵方(x=0), 敵方攻擊→打中玩家(x=48)
      battleBoomX = (who === "player") ? 0 : 48;
      battleBoomFrame = 0;
      battleBoomCycles = 0;
      if(battleBoomTimer){ clearInterval(battleBoomTimer); }

      battleBoomTimer = setInterval(() => {
        if(!battleActive && !battleResult){ clearInterval(battleBoomTimer); battleBoomTimer = null; return; }
        battleBoomFrame = battleBoomFrame === 0 ? 1 : 0;
        if(battleBoomFrame === 0) battleBoomCycles++;
        if(battleBoomCycles >= 2){
          clearInterval(battleBoomTimer);
          battleBoomTimer = null;
          battleBoomActive = false;

          if(isEnemyAttack){
            battlePlayerHp = Math.max(0, battlePlayerHp - dmg);
          } else {
            battleEnemyHp = Math.max(0, battleEnemyHp - dmg);
          }
          updateBattleHpDisplay();

          battleMsg = msg;
          document.getElementById("battleMsg").textContent = battleMsg;
          let typeLabel = "";
          if(crit && attrAdv) typeLabel = "爆擊！屬性剋制！";
          else if(crit) typeLabel = "爆擊！";
          else if(attrAdv) typeLabel = "屬性剋制！";
          else if(attrDis) typeLabel = "屬性劣勢…";
          else typeLabel = "普通攻擊";
          addBattleLog(atkrName, `${typeLabel} → -${dmg} HP`, crit, false, attrAdv, attrDis);
          renderBattleScene();

          if(battlePlayerHp <= 0){
            endBattle("lose");
            return;
          }
          if(battleEnemyHp <= 0){
            endBattle("win");
            return;
          }

          setTimeout(onDone, 600);
          return;
        }
        renderBattleScene();
      }, 200);

      renderBattleScene();
      return;
    }
    renderBattleScene();
  }, 80);
}

// 全自動戰鬥主循環
function runBattleAuto(){
  if(!battleActive || battleResult) return;
  const who = battleOrder[battleTurnIdx % 2];
  executeAttack(who, () => {
    if(!battleActive || battleResult) return;
    battleTurnIdx++;
    // 本輪攻擊結束，允許退出
    document.getElementById("battleRunBtn").disabled = false;
    runBattleAuto();
  });
}

function startBattle(){
  if(flushingMode) stopFlushing(); // 中斷清潔動畫
  const panel = document.getElementById("battleDisplay");
  // 對戰進行中，再次點擊切換為關閉（退出）
  if(battleActive){
    endBattle("run");
    return;
  }
  // 幼年期不可對戰
  if(currentRow <= 1){
    alert("幼年期還不能戰鬥！");
    return;
  }
  // 關閉其他面板
  document.getElementById("statsDisplay").style.display = "none";
  document.getElementById("foodDisplay").style.display = "none";
  document.getElementById("digidexDisplay").style.display = "none";
  document.getElementById("trainingDisplay").style.display = "none";
  panel.style.display = "block";

  // 暫停自動模式
  if(autoTimer){ clearInterval(autoTimer); autoTimer = null; }
  if(autoMoveTimer){ clearInterval(autoMoveTimer); autoMoveTimer = null; }

  // 從訓練模式直接切換：清理訓練狀態（不經過 auto mode）
  if(trainingMode){ clearTrainingState(); }

  // 隨機選擇對戰背景（5選1）
  battleBgIdx = Math.floor(Math.random() * BATTLE_BG_SOURCES.length);

  // 選擇敵方：僅限同階級（成長期vs成長期、成熟期vs成熟期…）
  const playerStage = DIGIMON_STATS[currentRow].stage;
  const sameStageIndices = [];
  for(let i = 0; i < TOTAL_DIGIMON; i++){
    if(DIGIMON_STATS[i].stage === playerStage && i !== currentRow){
      sameStageIndices.push(i);
    }
  }
  const enemyRow = sameStageIndices[Math.floor(Math.random() * sameStageIndices.length)];

  const ps = DIGIMON_STATS[currentRow];
  const es = DIGIMON_STATS[enemyRow];

  battleEnemyRow = enemyRow;
  battlePlayerMaxHp = getTotalHp();
  battlePlayerHp = getTotalHp();
  battleEnemyMaxHp = es.hp;
  battleEnemyHp = es.hp;

  // 清空對戰記錄
  battleLogEntries = [];
  document.getElementById("battleLog").innerHTML = "";
  updateBattleHpDisplay();
  battleAnimStep = 0;
  battleProjectileX = 0;
  battleProjectileDir = 0;
  battleProjectileActive = false;
  battleBoomActive = false;
  if(battleBoomTimer){ clearInterval(battleBoomTimer); battleBoomTimer = null; }
  battlePlayerFrame = 0;
  battleEnemyFrame = 0;
  battlePlayerDodge = false;
  battleEnemyDodge = false;
  battleResult = "";
  battleMsg = "";
  battleActive = true;
  // 重置逆境進化狀態
  battleOriginalRow = currentRow;
  battleAdversityEvoRow = -1;
  battleAdversityTries = 0;
  battleEvoState = "none";
  battleEvoStep = 0;
  battleEvoNextRow = -1;
  battleEvoCallback = null;
  // 重置敵方逆境進化狀態
  battleEnemyOriginalRow = battleEnemyRow;
  battleEnemyAdversityEvoRow = -1;
  battleEnemyAdversityTries = 0;
  battleEnemyEvoState = "none";
  battleEnemyEvoStep = 0;
  battleEnemyEvoNextRow = -1;
  battleEnemyEvoCallback = null;
  document.getElementById("adversityEvoBanner").style.display = "none";

  const pAttrColor = getAttrColor(ps.attr, es.attr);
  const eAttrColor = getAttrColor(es.attr, ps.attr);
  document.getElementById("battlePlayerName").innerHTML = ps.name + '(<span style="color:' + pAttrColor + '">' + (ATTR_CN[ps.attr] || ps.attr || "—") + '</span>)';
  document.getElementById("battleEnemyName").innerHTML = es.name + '(<span style="color:' + eAttrColor + '">' + (ATTR_CN[es.attr] || es.attr || "—") + '</span>)';
  document.getElementById("battleMsg").textContent = "點擊攻擊開始對戰！";
  document.getElementById("battleAttackBtn").disabled = false;
  document.getElementById("battleRunBtn").disabled = false;

  // 調整 canvas 為戰鬥模式 384×144（實際像素，無 CSS 縮放）
  trainingMode = false;  // 確保退出訓練模式
  canvas.width = CANVAS_BATTLE_W;
  canvas.height = CANVAS_BATTLE_H;
  canvas.style.width = CANVAS_BATTLE_W + "px";
  canvas.style.height = CANVAS_BATTLE_H + "px";
  gameMode = "battle";
  updateCssBackground("battle");
  battlePlayerFrame = 0;
  battleEnemyFrame = 0;
  renderBattleScene();
}

function startBattleIntro(){
  battleIntro = true;
  battleIntroStep = 0;
  battlePlayerFrame = 0;
  battleEnemyFrame = 0;
  renderBattleScene();

  battleIntroTimer = setInterval(() => {
    if(!battleActive && !battleResult){ clearInterval(battleIntroTimer); battleIntroTimer = null; return; }
    battleIntroStep++;
    if(battleIntroStep >= 7){
      // 3 次 idle+attack 完成，回到 idle 再開始
      clearInterval(battleIntroTimer);
      battleIntroTimer = null;
      battleIntro = false;
      battlePlayerFrame = 0;
      battleEnemyFrame = 0;
      renderBattleScene();
      setTimeout(() => beginBattle(), 400);
      return;
    }
    if(battleIntroStep % 2 === 1){
      // 攻擊幀（奇數步：1, 3, 5）
      battlePlayerFrame = 11;
      battleEnemyFrame = 11;
    } else {
      // 待機幀（偶數步：2, 4, 6）
      battlePlayerFrame = 0;
      battleEnemyFrame = 0;
    }
    renderBattleScene();
  }, 500);
}

function beginBattle(){
  const ps = DIGIMON_STATS[currentRow];
  const es = DIGIMON_STATS[battleEnemyRow];

  // 清空對戰記錄
  battleLogEntries = [];
  document.getElementById("battleLog").innerHTML = "";

  // 速度決定先後手（玩家使用總速度含訓練加成，相同時隨機）
  const playerSpd = getTotalSpd();
  const enemySpd = es.spd || 10;
  if(playerSpd > enemySpd) battleOrder = ["player", "enemy"];
  else if(enemySpd > playerSpd) battleOrder = ["enemy", "player"];
  else battleOrder = Math.random() < 0.5 ? ["player", "enemy"] : ["enemy", "player"];
  battleTurnIdx = 0;
  battleTurn = battleOrder[0];

  renderBattleScene();
  setTimeout(() => runBattleAuto(), 300);
}

function renderBattleScene(){
  const ctx2 = canvas.getContext('2d');
  ctx2.imageSmoothingEnabled = false;
  ctx2.clearRect(0, 0, CANVAS_BATTLE_W, CANVAS_BATTLE_H);

  // === 對戰背景（放在血量 UI 下方，y=48 起，高度 96） ===
  {
    const bgImg = battleBgImages[battleBgIdx];
    if(bgImg && bgImg.complete && bgImg.naturalWidth > 0){
      ctx2.drawImage(bgImg, 0, 48, CANVAS_BATTLE_W, CANVAS_BATTLE_H - 48);
    }
  }

  // === 血量 UI 底圖（384 × 48，貼在最頂部） ===
  if(battleHpBarImg && battleHpBarImg.complete && battleHpBarImg.naturalWidth > 0){
    ctx2.drawImage(battleHpBarImg, 0, 0);
  }

  // === 血量填充條（繪於底圖之上） ===
  const HP_BAR_Y = 4;
  const HP_BAR_H = 10;
  const now = Date.now();
  const blinkOn = (now % 800) < 400;  // 400ms 切換

  // 敵方血條（左側，從右到左填充，右邊固定 x=149，左邊隨血量變化，y=12, h=24）
  {
    const ratio = Math.max(0, battleEnemyHp / battleEnemyMaxHp);
    const barW = Math.floor(ratio * 130);
    if(ratio > 0){
      if(battleEnemyHp > 40){
        ctx2.fillStyle = "#77dd77";
      } else {
        ctx2.fillStyle = blinkOn ? "#dd3333" : "#ffdd22";
      }
      ctx2.fillRect(149 - barW, 12, barW, 24);
    }
  }

  // 我方血條（右側，從左到右填充，左邊固定 x=235，右邊隨血量變化，y=12, h=24）
  {
    const ratio = Math.max(0, battlePlayerHp / battlePlayerMaxHp);
    const barW = Math.floor(ratio * 130);
    if(ratio > 0){
      if(battlePlayerHp > 40){
        ctx2.fillStyle = "#77dd77";
      } else {
        ctx2.fillStyle = blinkOn ? "#dd3333" : "#ffdd22";
      }
      ctx2.fillRect(235, 12, barW, 24);
    }
  }

  const S = B_SCALE;  // 6x

  // === 敵方龍（左側） ===
  if(rowImages[battleEnemyRow] && rowImages[battleEnemyRow].complete && rowImages[battleEnemyRow].naturalWidth > 0){
    const frame = (battleEnemyFrame >= 0) ? battleEnemyFrame * PITCH : 0;
    ctx2.save();
    ctx2.translate(16 * S, 8 * S);
    if(battleEnemyDodge){
      ctx2.drawImage(rowImages[battleEnemyRow], frame, 0, 16, 16, -16 * S, 0, 16 * S, 16 * S);
    } else {
      ctx2.scale(-1, 1);
      ctx2.drawImage(rowImages[battleEnemyRow], frame, 0, 16, 16, 0, 0, 16 * S, 16 * S);
    }
    ctx2.restore();
  }

  // === 玩家龍（右側） ===
  if(rowImages[currentRow] && rowImages[currentRow].complete && rowImages[currentRow].naturalWidth > 0){
    const frame = (battlePlayerFrame >= 0) ? battlePlayerFrame * PITCH : 0;
    if(battlePlayerDodge){
      ctx2.save();
      ctx2.translate(65 * S, 8 * S);
      ctx2.scale(-1, 1);
      ctx2.drawImage(rowImages[currentRow], frame, 0, 16, 16, 0, 0, 16 * S, 16 * S);
      ctx2.restore();
    } else {
      ctx2.drawImage(rowImages[currentRow], frame, 0, 16, 16, 49 * S, 8 * S, 16 * S, 16 * S);
    }
  }

  // === 逆境進化特效（我方） ===
  if(battleEvoState === "exclaim"){
    if(battleEvoExclaimImg.complete && battleEvoExclaimImg.naturalWidth > 0){
      ctx2.drawImage(battleEvoExclaimImg, 40 * S, 8 * S, 16 * S, 8 * S);
    }
  } else if(battleEvoState === "evoDown" || battleEvoState === "evoUp"){
    if(battleEvoEffectImg.complete && battleEvoEffectImg.naturalWidth > 0){
      ctx2.drawImage(battleEvoEffectImg, 0, 0, 16, battleEvoStep, 49 * S, 8 * S, 16 * S, battleEvoStep * S);
    }
  }

  // === 逆境進化特效（敵方） ===
  if(battleEnemyEvoState === "exclaim"){
    if(battleEvoExclaimImg.complete && battleEvoExclaimImg.naturalWidth > 0){
      ctx2.drawImage(battleEvoExclaimImg, 16 * S, 8 * S, 16 * S, 8 * S);
    }
  } else if(battleEnemyEvoState === "evoDown" || battleEnemyEvoState === "evoUp"){
    if(battleEvoEffectImg.complete && battleEvoEffectImg.naturalWidth > 0){
      ctx2.drawImage(battleEvoEffectImg, 0, 0, 16, battleEnemyEvoStep, 0, 8 * S, 16 * S, battleEnemyEvoStep * S);
    }
  }

  // === Happy / Sad 效果 ===
  if(battleShowHappy && battleHappyImg.complete && battleHappyImg.naturalWidth > 0){
    ctx2.drawImage(battleHappyImg, 40 * S, 8 * S, 8 * S, 8 * S);
  }
  if(battleShowSad && battleSadImg.complete && battleSadImg.naturalWidth > 0){
    ctx2.drawImage(battleSadImg, 40 * S, 8 * S, 8 * S, 8 * S);
  }
  if(battleShowEnemySad && battleSadImg.complete && battleSadImg.naturalWidth > 0){
    ctx2.drawImage(battleSadImg, 16 * S, 8 * S, 8 * S, 8 * S);
  }
  if(battleShowEnemyHappy && battleHappyImg.complete && battleHappyImg.naturalWidth > 0){
    ctx2.drawImage(battleHappyImg, 16 * S, 8 * S, 8 * S, 8 * S);
  }

  // === 攻擊彈（普攻單發上方，爆擊雙發上下） ===
  if(battleProjectileActive){
    const atkrRow = (battleProjectileDir === 1) ? currentRow : battleEnemyRow;
    let fireImg = (atkrRow < attackRowImages.length) ? attackRowImages[atkrRow] : null;
    if(!fireImg || !fireImg.complete) fireImg = attackRowImages[0];
    if(fireImg && fireImg.complete){
      if(battleProjectileDir === 0){
        // 敵方火球：翻轉朝右
        ctx2.save();
        ctx2.translate(battleProjectileX * S + 16 * S, 9 * S);
        ctx2.scale(-1, 1);
        ctx2.drawImage(fireImg, 0, 0, 16, 8, 0, 0, 16 * S, 8 * S);
        ctx2.restore();
        if(battleIsCrit){
          ctx2.save();
          ctx2.translate(battleProjectileX * S + 16 * S, 17 * S);
          ctx2.scale(-1, 1);
          ctx2.drawImage(fireImg, 0, 0, 16, 8, 0, 0, 16 * S, 8 * S);
          ctx2.restore();
        }
      } else {
        // 我方火球：正常朝左（上方）
        ctx2.drawImage(fireImg, 0, 0, 16, 8, battleProjectileX * S, 9 * S, 16 * S, 8 * S);
        if(battleIsCrit){
          ctx2.drawImage(fireImg, 0, 0, 16, 8, battleProjectileX * S, 17 * S, 16 * S, 8 * S);
        }
      }
    }
  }

  // === 爆炸動畫（擊中時播放） ===
  if(battleBoomActive){
    const bImg = (battleBoomFrame === 0) ? boomImage : boomImage2;
    if(bImg.complete && bImg.naturalWidth > 0){
      ctx2.drawImage(bImg, battleBoomX * S, 8 * S, 16 * S, 16 * S);
    }
  }
}
